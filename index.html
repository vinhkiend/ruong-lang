}

/* Ốm đau: người cảm lạnh, gia súc ốm, người làng nhờ mang thuốc */
function nightSick(notes){
  const se = seasonOf(S.day), gentle = yearOf(S.day) === 1 && se === 3;
  if (S.sick){
    S.sick.n = (S.sick.n || 0) + 1;
    if (S.sick.n >= 4){ S.sick = null; notes.push(["good", "Cơn cảm đã qua, hôm nay anh thấy khoẻ lại."]); }
    else { S.suc = Math.min(S.suc, 10); notes.push(["bad", "Anh vẫn còn cảm, người mệt, chỉ có 10 sức. Uống thuốc cảm thì khỏi ngay."]); }
  } else if (S.day > 5 && !(S.phong >= S.day)){
    let p = se === 3 ? (gentle ? 0.06 : 0.12) : 0.03;
    if (S.faintLast) p += 0.2;
    p *= luck() > 0 ? 0.5 : luck() < 0 ? 1.6 : 1;
    if (Math.random() < p){ S.sick = {d:S.day, n:0}; S.suc = Math.min(S.suc, 10); notes.push(["bad", "Đêm qua trở trời, anh bị cảm lạnh, sáng nay chỉ còn 10 sức. Uống thuốc cảm (tự sắc hoặc mua ở hiệu thuốc phủ Thiên Đức) thì khỏi."]); }
  }
  S.faintLast = false;
  const dead = [];
  S.animals.forEach(a => {
    if (a.s){ a.s++; if (a.s >= 6 && !gentle){ dead.push(a); } }
    else { let p = 0.025 + (a.h > 0 ? 0.04 : 0) + (se === 3 ? 0.015 : 0); if (luck() < 0) p *= 1.5; if (Math.random() < p){ a.s = 1; notes.push(["bad", "Một con " + ANIMALS[a.t].n.toLowerCase() + " bị ốm, lờ đờ bỏ ăn" + (a.t === "ga" ? ", không đẻ" : a.t === "trau" ? ", không kéo cày được" : ", không lớn") + ". Cho uống thuốc gia súc ở Chuồng trại."]); } }
  });
  if (dead.length){ S.animals = S.animals.filter(a => !dead.includes(a)); notes.push(["bad", "Ốm lâu không chữa nên chết: " + dead.map(a => ANIMALS[a.t].n).join(", ") + "."]); }
  if (S.om && S.om.until < S.day){ const n = NPCS.find(x => x.id === S.om.id); S.om = null; if (n) notes.push(["bad", n.n + " đã tự đi bốc thuốc, không chờ anh nữa."]); }
  if (!S.om && S.day > 4 && Math.random() < 0.14){
    const L = NPCS.filter(n => !n.patrol && n.id !== S.spouse && n.id !== "tue" && S.talked[n.id]);
    if (L.length){ const n = L[Math.floor(Math.random()*L.length)], g = se === 3 || Math.random() < 0.5 ? "thuoccam" : "thuoc"; S.om = {id:n.id, g, until:S.day + 2}; notes.push(["good", "Nghe tin " + n.n + " bị " + (g === "thuoccam" ? "cảm" : "mệt người") + ", nhờ anh mang 1 " + GOODS[g].n + " đến (" + n.where + "), hạn 3 ngày."]); }
  }
}
function duaThuoc(){
  const n = talking; if (!n || !S.om || S.om.id !== n.id || !(S.goods[S.om.g] > 0)) return;
  S.goods[S.om.g]--; S.om = null; S.money += 30; stat("chuabenh");
  addRel(n.id, 15, n.n); emo(n, "tim"); RLA.sfx("thang"); checkGoals(); save(); render();
  showTalk(n, "Ôi, anh mang thuốc đến tận nơi! Uống vào thấy đỡ hẳn. Anh nhận chút tiền này cho tôi vui.", "+15 tình cảm, +30 đồng.");
}
function treatAnimal(i){
  const a = S.animals[i]; if (!a || !a.s) return;
  if (!(S.goods.thuocgs > 0)){ toast("Chưa có thuốc gia súc. Sắc ở ấm thuốc trong nhà hoặc mua ở hiệu thuốc phủ.", "warn"); return; }
  S.goods.thuocgs--; a.s = 0; RLA.sfx("gasuc"); toast("Cho " + ANIMALS[a.t].n.toLowerCase() + " uống thuốc, nó khoẻ lại rồi."); commit();
}
function drinkCam(){
  if (!(S.goods.thuoccam > 0)) return;
  S.goods.thuoccam--; RLA.sfx("mua");
  if (S.sick){ S.sick = null; S.suc = Math.min(MAXS, S.suc + 5); toast("Uống bát thuốc cảm nóng, mồ hôi vã ra, khỏi cảm rồi. Hồi 5 sức."); }

  commit();
}
function cureMe(){

  S.money -= 35; S.sick = null; S.suc = Math.min(MAXS, S.suc + 5); RLA.sfx("mua"); toast("Thầy lang bắt mạch, cho uống thang thuốc, anh khỏi cảm. Hồi 5 sức."); commit();
}

  cx.fillStyle = deep ? "#8A8698" : "#A8A296"; cx.beginPath(); cx.ellipse(x - 3, y - 6, 8, 4.5, -0.3, 0, 7); cx.fill();

function updFox(dt){
  if (!foxNight()){ FOX.on = false; return; }
  const F = foxSt(), w = FOXW[Math.min(F.st, 3)], tx = w[0]*T, ty = w[1]*T;
  if (!FOX.on){ FOX.on = true; FOX.x = tx; FOX.y = ty; if (!S.foxSeen){ S.foxSeen = 1; toast("Dưới trăng rằm, một con cáo trắng hiện ra ở đường xóm. Đi theo nó xem sao!"); } }
  const dx = tx - FOX.x, dy = ty - FOX.y, d = Math.hypot(dx, dy), v = 150*dt;
  if (d > 1){ FOX.x += d < v ? dx : dx/d*v; FOX.y += d < v ? dy : dy/d*v; if (Math.abs(dx) > 1) FOX.dir = dx > 0 ? 1 : -1; }
  else if (F.st < 3 && Math.hypot(P.x - FOX.x, P.y - FOX.y) < 80){ F.st++; RLA.sfx("tap"); if (F.st === 3) toast("Cáo trắng dừng dưới gốc đa đầu bãi, cào cào vào một cái hòm gỗ."); }
}
function drawFox(t){
  const x = FOX.x, y = FOX.y, s = FOX.dir, run = Math.hypot(FOXW[Math.min(foxSt().st, 3)][0]*T - x, FOXW[Math.min(foxSt().st, 3)][1]*T - y) > 1, b = run ? Math.sin(t*20)*2 : 0;
  cx.fillStyle = `rgba(255,255,230,${0.25 + 0.1*Math.sin(t*3)})`; cx.beginPath(); cx.arc(x, y - 8, 26, 0, 7); cx.fill();
  cx.fillStyle = "rgba(0,0,0,0.2)"; cx.beginPath(); cx.ellipse(x, y + 2, 14, 4, 0, 0, 7); cx.fill();
  cx.fillStyle = "#F6F2E6";
  cx.beginPath(); cx.ellipse(x - s*14, y - 12 - b*0.5, 9, 5, s*0.5, 0, 7); cx.fill();
  cx.beginPath(); cx.ellipse(x, y - 9 + b*0.3, 11, 6, 0, 0, 7); cx.fill();
  cx.fillRect(x - 7, y - 5, 3, 7 + b*0.5); cx.fillRect(x + 4, y - 5, 3, 7 - b*0.5);
  cx.beginPath(); cx.ellipse(x + s*11, y - 15, 6, 5, 0, 0, 7); cx.fill();
  cx.beginPath(); cx.moveTo(x + s*15, y - 15); cx.lineTo(x + s*21, y - 13); cx.lineTo(x + s*15, y - 11); cx.fill();
  cx.beginPath(); cx.moveTo(x + s*8, y - 18); cx.lineTo(x + s*9, y - 25); cx.lineTo(x + s*12, y - 19); cx.fill();
  cx.beginPath(); cx.moveTo(x + s*12, y - 19); cx.lineTo(x + s*14, y - 25); cx.lineTo(x + s*15, y - 18); cx.fill();
  cx.fillStyle = "#2A2A2A"; cx.fillRect(x + s*13 - 1, y - 16, 2, 2); cx.fillRect(x + s*21 - 1, y - 14, 2, 2);
  cx.fillStyle = "#FFFFFF"; cx.beginPath(); cx.ellipse(x - s*21, y - 14 - b*0.5, 4, 3, 0, 0, 7); cx.fill();
}

const DHG = {thoc:["Thóc", 100, 10], giao:["Giáo sắt", 20, 1], trau:["Trâu kéo xe lương", 2, 1], thuoc:["Thuốc (thuốc bổ, thuốc cảm)", 10, 1]};
const dhHave = k => k === "trau" ? S.animals.filter(a => a.t === "trau").length : k === "thuoc" ? (S.goods.thuoc||0) + (S.goods.thuoccam||0) : (S.goods[k]||0);

function dhHtml(){
  const D = S.dh; if (!D) return "";
  if (D.done) return `<div class="sec"><h3>Góp sức đánh giặc Nguyên</h3><p class="note">Làng Dâu đã góp đủ lương, giáo, trâu, thuốc cho quân nhà Trần. Anh được danh hiệu Nghĩa dân Diên Hồng.</p></div>`;
  const left = D.end - S.day;
  const rows = Object.entries(DHG).map(([k, [n, need, step]]) => { const g = D.g[k], h = dhHave(k), can = g < need && h >= Math.min(step, need - g);
    return `<div class="row"><span class="e">${k === "trau" ? "🐃" : k === "thuoc" ? "🧪" : GOODS[k].i}</span><span class="t"><b>${n}: ${g}/${need}</b><small>Anh đang có ${h}.</small></span>
     <span class="a"><button class="btn s p" data-act="gopdh" data-k="${k}" ${can ? "" : "disabled"}>${g >= need ? "Đủ" : "Góp " + Math.min(step, need - g)}</button></span></div>`; }).join("");
  return `<div class="sec"><h3>Góp sức đánh giặc Nguyên</h3>
   <p class="note">Năm 1284, giặc Nguyên sắp sang. Thượng hoàng mời bô lão về điện Diên Hồng bàn việc nước. Lý trưởng nhờ anh lo cho làng Dâu phần đóng góp. ${left >= 0 ? "Còn " + left + " ngày để góp kịp." : "Đã quá hạn, góp đủ vẫn được ghi công nhưng mất phần thưởng thêm."}</p>

function gopDh(k){
  const D = S.dh, G = DHG[k]; if (!D || D.done || !G) return;

  D.g[k] += n; stat("dh", n); addRel("ly", 1, "Lý trưởng"); RLA.sfx("mua");

const PLC = new WeakMap();
function poseL(L, k){ let m = PLC.get(L); if (!m){ m = {}; PLC.set(L, m); } return m[k] || (m[k] = Object.assign({}, L, {pose:k})); }
const Yv = v => v >= -13.5 ? v*1.63 : v >= -25 ? -22 + (v + 13.5)*1.565 : v - 15;

function handAt(pose, dir, x, y){

const FV = {0:[0.15,-1], 1:[1,0.3], 2:[0.15,1], 3:[-1,0.3], 4:[0.75,0.7], 5:[-0.75,0.7], 6:[0.75,-0.6], 7:[-0.75,-0.6]};

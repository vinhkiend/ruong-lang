<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruộng Làng Đại Việt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Bố cục bản 4: thanh trạng thái trên cùng, phần còn lại là bản đồ làng cuộn theo nhân vật.
   Nút Làm ở góc phải dưới, cần điều khiển hiện ra chỗ ngón tay chạm. Sáng: giấy mạ xanh nhạt, son đỏ, vàng hoè, chàm. Tối: nền sơn mài. */
:root{
  --bg:#E4E9D3; --bg2:#D5DCBC; --card:#F4F6EA; --ink:#21261A; --muted:#5B644C; --line:rgba(33,38,26,.16);
  --son:#B23A28; --onson:#FFFFFF; --hoe:#B88208; --cham:#2C4A6E; --la:#4A7A2C;
  --ripe:#E3B53C; --good:#3F7A2A; --bad:#B23A28;
  --fd:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif; --fb:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13180F; --bg2:#1B2216; --card:#1E2619; --ink:#E7EBD8; --muted:#A2AC8C; --line:rgba(231,235,216,.14);
  --son:#E0694F; --onson:#1A0E09; --hoe:#E4B446; --cham:#88AAD8; --la:#8FC167;
  --ripe:#C99A2B; --good:#8FC167; --bad:#E0694F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13180F; --bg2:#1B2216; --card:#1E2619; --ink:#E7EBD8; --muted:#A2AC8C; --line:rgba(231,235,216,.14);
  --son:#E0694F; --onson:#1A0E09; --hoe:#E4B446; --cham:#88AAD8; --la:#8FC167;
  --ripe:#C99A2B; --good:#8FC167; --bad:#E0694F; color-scheme:dark}
[hidden]{display:none!important}
.art{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.2em;flex:none}
.row .e .art,.seedpick .e .art{width:1.4em;height:1.4em}
.iconbtn.off{opacity:.55;text-decoration:line-through}
.sound{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.sound label{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.sound input{width:22px;height:22px;accent-color:var(--son)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.5;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--cham);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);line-height:1.15;text-wrap:balance;margin:0}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Thanh trên */
.top{flex:none;z-index:20;background:var(--bg2);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1180px;margin:0 auto;padding-block:8px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.brand b{font-family:var(--fd);font-size:1.35rem;font-weight:800;color:var(--son);line-height:1}
.brand span{font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.stat{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.season{font-family:var(--fd);font-weight:700;padding:1px 10px;border-radius:99px;color:var(--onson);background:var(--la)}
.season.s1{background:var(--hoe)}.season.s2{background:var(--son)}.season.s3{background:var(--cham)}
.coin{width:18px;height:18px;border-radius:50%;background:var(--hoe);position:relative;flex:none;box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}
.coin::after{content:"";position:absolute;inset:6px;background:var(--bg2);border-radius:1px}
.money b{font-family:var(--fd);font-size:1.15rem}
.bar{width:64px;height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--la);border-radius:9px;transition:width .25s}
.bar.low i{background:var(--son)}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:4px 10px;font-size:.85rem}
.sleep{background:var(--cham);color:var(--bg);border:0;border-radius:12px;padding:7px 14px;font-family:var(--fd);font-weight:700;font-size:1rem}
.btns{display:flex;gap:6px;align-items:center}

/* Bản đồ làng */
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#5E7F3E;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.news{position:absolute;top:10px;left:0;right:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-height:44%;pointer-events:none}
.news>*{pointer-events:auto}
.newsbtn{border:0;border-radius:99px;padding:3px 12px;font-size:.8rem;font-weight:600;background:var(--ink);color:var(--bg);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.news .items{display:flex;flex-direction:column;gap:6px;max-width:min(560px,100%);overflow:auto;min-height:0}
.news .items>div{background:var(--card);border-left:4px solid var(--cham);padding:6px 10px;border-radius:10px;font-size:.84rem;line-height:1.4;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.news .items>.bad{border-left-color:var(--bad)}.news .items>.good{border-left-color:var(--good)}
.actbtn{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));min-width:104px;max-width:min(230px,48vw);min-height:68px;border-radius:999px;border:3px solid rgba(255,255,255,.75);background:var(--son);color:var(--onson);box-shadow:0 4px 16px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:6px 18px;text-align:center;touch-action:manipulation}
.actbtn b{font-family:var(--fd);font-size:1.3rem;line-height:1}
.actbtn small{font-size:.74rem;font-weight:600}
.actbtn.idle{opacity:.6}
.actbtn:active{transform:scale(.95)}
.fabs{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 82px);display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.fab{position:relative;display:flex;align-items:center;gap:6px;border:2px solid rgba(255,255,255,.75);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px 6px 8px;font-weight:600;font-size:.86rem;box-shadow:0 3px 12px rgba(0,0,0,.3);touch-action:manipulation}
.fab .art{width:1.6em;height:1.6em}
.badge{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--son);color:var(--onson);font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;animation:nhay 1.2s ease-in-out infinite}
@keyframes nhay{50%{transform:scale(1.18)}}
.tracker{display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;width:min(300px,100%);border:0;border-left:4px solid var(--hoe);background:var(--card);border-radius:10px;padding:7px 11px;box-shadow:0 2px 10px rgba(0,0,0,.22);font-size:.84rem;line-height:1.3}
.tracker .tl{font-size:.72rem;font-weight:700;color:var(--hoe);text-transform:uppercase;letter-spacing:.04em}
.qbar{display:block;height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:4px 0 2px}
.qbar i{display:block;height:100%;background:var(--hoe);border-radius:6px}
.qrow{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;margin-top:8px;background:var(--bg)}
.qrow.ready{border-color:var(--hoe);box-shadow:0 0 0 2px var(--hoe) inset}
.qrow.claimed{opacity:.65}
.qrow .qic .art{width:2rem;height:2rem}
.qrow .qt b{display:block}.qrow .qt small{display:block;color:var(--muted);line-height:1.35}
.qrow .qa{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
details summary{cursor:pointer;font-family:var(--fd);font-weight:700;font-size:1.05rem}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:6px}
.slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px 8px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);text-align:center;font:inherit;color:inherit}
.slot:disabled{opacity:.4}
.slot.sel{border-color:var(--son);box-shadow:0 0 0 2px var(--son) inset}
.slot .si .art{width:2.2rem;height:2.2rem}
.slot .sn{font-size:.8rem;font-weight:600;line-height:1.2}
.slot .sc{position:absolute;top:4px;right:7px;font-family:var(--fd);font-weight:700}
@media (max-width:640px){.qrow{grid-template-columns:2rem minmax(0,1fr)}.qrow .qa{grid-column:2;flex-direction:row;justify-content:flex-start;flex-wrap:wrap}}
.joy{position:absolute;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.55);pointer-events:none}
.joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.joy.ghost{opacity:.55}
.hint{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));max-width:min(420px,calc(100% - 150px));background:rgba(20,24,16,.78);color:#fff;font-size:.8rem;line-height:1.4;padding:7px 11px;border-radius:10px;pointer-events:none;transition:opacity .8s}
.hint.coarse{bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 140px)}
.hint.gone{opacity:0}

/* Danh sách / bảng trong các nhà */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.btn{border:1.5px solid var(--ink);background:var(--card);border-radius:10px;padding:6px 12px;font-weight:600;font-size:.9rem;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.p{background:var(--son);border-color:var(--son);color:var(--onson)}
.btn.s{padding:3px 9px;font-size:.82rem}
.guide{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:.8rem;padding:2px 10px;border-radius:99px;border:1px solid var(--line);background:var(--bg)}
.chip.off{opacity:.45;text-decoration:line-through}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.box h3{font-size:1.15rem;margin-bottom:8px}
.sub{color:var(--muted);font-size:.88rem;margin:0 0 12px}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .e{font-size:1.5rem;text-align:center}
.row .t b{display:block}
.row .t small{color:var(--muted);display:block;line-height:1.35}
.row .a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--good)}.down{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.sec{margin-top:18px}
.sec h3{font-size:1.05rem;margin-bottom:4px}
.note{font-size:.85rem;color:var(--muted)}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:0 8px;border-radius:99px;background:var(--bg2);color:var(--ink);margin-left:6px;vertical-align:1px}
.pill.bad{background:var(--son);color:var(--onson)}.pill.good{background:var(--la);color:var(--onson)}
.goal{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:.9rem}
.goal i{flex:none;width:16px;height:16px;border-radius:4px;border:2px solid var(--muted);margin-top:3px}
.goal.done{color:var(--muted)}.goal.done i{background:var(--la);border-color:var(--la)}
.goal small{color:var(--muted)}
.log{list-style:none;margin:0;padding:0;font-size:.84rem;max-height:300px;overflow:auto}
.log li{padding:4px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px}
.log li span{color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.log .bad{color:var(--bad)}
.mobile-only{display:block}

/* Hộp thoại */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,12,8,.5);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.modal{align-items:center}}
.sheet{background:var(--card);color:var(--ink);border-radius:18px;padding:20px;width:min(520px,100%);max-height:86vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.sheet.wide{width:min(800px,100%)}
.sheet h2{font-size:1.45rem;margin-bottom:6px;color:var(--son)}
.sheet ol,.sheet ul{padding-left:1.2rem;margin:8px 0}
.sheet li{margin:4px 0}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.shead{position:sticky;top:-20px;display:flex;justify-content:flex-end;margin:-10px -10px -24px 0;z-index:2;pointer-events:none}
.shead button{pointer-events:auto;background:var(--card)}
.notes{list-style:none;padding:0}
.notes li{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.notes li::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--cham)}
.notes li.bad::before{background:var(--bad)}.notes li.good::before{background:var(--good)}.notes li.tax::before{background:var(--hoe)}
.seedpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.seedpick button{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;text-align:left;display:flex;gap:10px;align-items:center}
.seedpick button:disabled{opacity:.45}
.seedpick .e{font-size:1.7rem}
.seedpick small{display:block;color:var(--muted);line-height:1.3}
.mapcv{width:100%;height:auto;border-radius:10px;display:block;margin:8px 0 10px;cursor:pointer;border:1px solid var(--line)}
.places{display:flex;flex-wrap:wrap;gap:6px}
.keys{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:.88rem;margin:8px 0;padding:10px 12px;border-radius:10px;background:var(--bg)}
.keys b{white-space:nowrap}

.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(420px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:.9rem;font-weight:500;animation:tin .2s ease-out;text-align:center}
.toast.warn{background:var(--son);color:var(--onson)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

@media (max-width:640px){
  .grid2{grid-template-columns:minmax(0,1fr)}
  .seedpick{grid-template-columns:minmax(0,1fr)}
  .brand span{display:none}
  .brand b{font-size:1.15rem}
  .top-in{gap:4px 10px;padding-block:6px}
  .sleep{padding:5px 10px;font-size:.92rem}
  .iconbtn{padding:3px 8px}
  .bar{width:48px}
  .toasts{bottom:calc(160px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top"><div class="top-in gut" id="hdr"></div></header>
<main id="stage">
  <canvas id="world" role="img" aria-label="Bản đồ làng Đại Việt: ruộng, nhà, chuồng, chợ, đình, chùa. Nhân vật đội nón lá là anh."></canvas>
  <div class="news gut" id="news" aria-live="polite"></div>
  <div class="hint" id="hint"></div>
  <div class="joy" id="joy" hidden><i></i></div>
  <div class="fabs" id="fabs"></div>
  <button class="actbtn idle" id="actbtn" data-act="do"><b>Làm</b><small>Đến gần chỗ cần làm</small></button>
</main>
<div class="modal" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>

/* ===== Hình vẽ và âm thanh tự làm cho Ruộng Làng Đại Việt =====
   Toàn bộ hình là SVG vẽ tay trong mã, toàn bộ nhạc và tiếng động tạo bằng Web Audio ngay trên máy người chơi.
   Không dùng tệp hay tác phẩm của tác giả khác. Gọi: RLA.art(khoá), RLA.sfx(tên), RLA.music.season(0..3). */
const RLA = (function(){
"use strict";

/* ---------- Hình vẽ (khung 48×48) ---------- */
const G = {
  /* Cây trồng */
  lua: `<path d="M24 45V20M17 45c0-9-3-16-7-21M31 45c0-9 3-16 7-21" stroke="#6F7E2B" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M24 36c-4-4-9-5-13-4M24 32c4-4 9-6 13-5" stroke="#5C8A2D" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <g fill="#E3B53C" stroke="#A9781A" stroke-width=".8"><ellipse cx="25.5" cy="17" rx="2" ry="3.2" transform="rotate(25 25.5 17)"/><ellipse cx="28" cy="13.5" rx="2" ry="3.2" transform="rotate(45 28 13.5)"/><ellipse cx="31.5" cy="11.5" rx="2" ry="3.2" transform="rotate(75 31.5 11.5)"/><ellipse cx="34.5" cy="13" rx="1.8" ry="3" transform="rotate(120 34.5 13)"/>
    <ellipse cx="9.5" cy="21.5" rx="1.8" ry="3" transform="rotate(-20 9.5 21.5)"/><ellipse cx="7.5" cy="17.5" rx="1.8" ry="3" transform="rotate(-45 7.5 17.5)"/><ellipse cx="5.5" cy="14.5" rx="1.7" ry="2.8" transform="rotate(-80 5.5 14.5)"/>
    <ellipse cx="38.5" cy="21.5" rx="1.8" ry="3" transform="rotate(20 38.5 21.5)"/><ellipse cx="40.5" cy="17.5" rx="1.8" ry="3" transform="rotate(45 40.5 17.5)"/><ellipse cx="42.5" cy="14.5" rx="1.7" ry="2.8" transform="rotate(80 42.5 14.5)"/></g>`,
  rau: `<path d="M24 45c0-10-1-18-6-25M24 45c0-9 2-17 8-23M24 45V14" stroke="#7FA347" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <g fill="#4E8F2F" stroke="#2F6A1C" stroke-width=".9"><path d="M18 20c-6-1-11-5-12-11 6 0 11 3 12 11z"/><path d="M32 22c5-3 8-9 8-14-6 1-9 6-8 14z"/><path d="M24 14c-3-4-3-8 0-12 3 4 3 8 0 12z"/><path d="M21 31c-5 0-9-3-11-7 5-1 9 1 11 7z"/><path d="M27 30c4-2 8-5 9-10-5 1-9 4-9 10z"/></g>`,
  lac: `<path d="M8 44h32" stroke="#7A5A38" stroke-width="2" stroke-linecap="round"/>
    <g fill="#4E8F2F"><ellipse cx="14" cy="13" rx="5" ry="3.2" transform="rotate(-30 14 13)"/><ellipse cx="22" cy="9" rx="5" ry="3.2" transform="rotate(10 22 9)"/><ellipse cx="32" cy="12" rx="5" ry="3.2" transform="rotate(30 32 12)"/><ellipse cx="35" cy="20" rx="4.5" ry="3" transform="rotate(60 35 20)"/></g>
    <path d="M24 30V12M24 20l8-7M24 18l-9-4M24 24l10-4" stroke="#5C8A2D" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <g fill="#D9B27C" stroke="#9C7443" stroke-width="1"><path d="M10 34c0-3 3-5 6-4 2 .6 3 2 5 2s3 2 3 4-2 5-6 4c-2-.5-3-2-5-2-2 0-3-1-3-4z"/><path d="M26 38c0-3 3-5 6-4 2 .6 3 2 5 2s3 2 3 4-2 5-6 4c-2-.5-3-2-5-2-2 0-3-1-3-4z"/></g>

/* ---------- Âm thanh ---------- */
const PKEY = "ruonglang-amthanh";
let pref = {nhac:true, tiengdong:true};
try { const r = JSON.parse(localStorage.getItem(PKEY) || "null"); if (r) pref = {...pref, ...r}; } catch(e){}
function savePref(){ try { localStorage.setItem(PKEY, JSON.stringify(pref)); } catch(e){} }

let ac = null, master = null, musBus = null, sfxBus = null, verb = null, noiseBuf = null;
function ctx(){
  if (ac) return ac;
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
  try { ac = new AC(); } catch(e){ return null; }
  master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
  musBus = ac.createGain(); musBus.gain.value = pref.nhac ? 0.32 : 0; musBus.connect(master);
  sfxBus = ac.createGain(); sfxBus.gain.value = 0.55; sfxBus.connect(master);
  /* Vang nhẹ như đồng không mông quạnh: tiếng vọng ngắn tạo từ nhiễu tắt dần */
  verb = ac.createConvolver();
  const len = ac.sampleRate * 1.8, ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++){ const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 3.2); }
  verb.buffer = ir;
  const vg = ac.createGain(); vg.gain.value = 0.28; verb.connect(vg); vg.connect(master);
  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random()*2-1;
  return ac;
}
function out(node, bus, wet){ node.connect(bus); if (wet){ const s = ac.createGain(); s.gain.value = wet; node.connect(s); s.connect(verb); } }
const hz = m => 440 * Math.pow(2, (m - 69) / 12);

/* Nhạc cụ */
function danBau(t, m, dur, vel, bend){
  /* Đàn bầu: một dây, tiếng tròn, nhấn luyến lên xuống và rung ở đuôi nốt */
  const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  const lfo = ac.createOscillator(), lg = ac.createGain();
  o.type = "triangle"; o2.type = "sine"; f.type = "lowpass"; f.frequency.value = 2200;
  const fr = hz(m);
  o.frequency.setValueAtTime(bend ? hz(m + bend) : fr, t); o2.frequency.setValueAtTime(fr*2, t);
  if (bend){ o.frequency.exponentialRampToValueAtTime(fr, t + 0.16); }
  lfo.frequency.value = 5.2; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(fr*0.012, t + Math.min(dur*0.6, 0.5));
  lfo.connect(lg); lg.connect(o.frequency);
  const g2 = ac.createGain(); g2.gain.value = 0.18; o2.connect(g2); g2.connect(f);
  o.connect(f); f.connect(g);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vel, t + 0.02);
  g.gain.exponentialRampToValueAtTime(vel*0.45, t + 0.25); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.35);
  out(g, musBus, 0.5);
  [o, o2, lfo].forEach(x => { x.start(t); x.stop(t + dur + 0.4); });
}
function sao(t, m, dur, vel){
  /* Sáo trúc: âm thổi, có hơi gió */
  const o = ac.createOscillator(), g = ac.createGain(); o.type = "sine"; o.frequency.value = hz(m);
  const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 4.6; lg.gain.value = hz(m)*0.006; lfo.connect(lg); lg.connect(o.frequency);
  const n = ac.createBufferSource(), nf = ac.createBiquadFilter(), ng = ac.createGain();
  n.buffer = noiseBuf; nf.type = "bandpass"; nf.frequency.value = hz(m)*2; nf.Q.value = 6; ng.gain.value = vel*0.5;
  n.connect(nf); nf.connect(ng); ng.connect(g); o.connect(g);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vel, t + 0.08); g.gain.setValueAtTime(vel*0.85, t + dur*0.8); g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.12);
  out(g, musBus, 0.6);
  [o, lfo, n].forEach(x => { x.start(t); x.stop(t + dur + 0.2); });
}
function tranh(t, m, vel){
  /* Đàn tranh: gảy dây, tắt nhanh */
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  o.type = "sawtooth"; o.frequency.value = hz(m); f.type = "lowpass";
  f.frequency.setValueAtTime(3200, t); f.frequency.exponentialRampToValueAtTime(500, t + 0.6);
  o.connect(f); f.connect(g);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vel, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
  out(g, musBus, 0.45); o.start(t); o.stop(t + 1.3);
}
function mo(t, vel, bus){
  /* Mõ gỗ */
  const o = ac.createOscillator(), g = ac.createGain(); o.type = "sine";
  o.frequency.setValueAtTime(1150, t); o.frequency.exponentialRampToValueAtTime(820, t + 0.05);
  g.gain.setValueAtTime(vel, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
  o.connect(g); out(g, bus || musBus, 0.2); o.start(t); o.stop(t + 0.1);
}
function trong(t, vel){
  /* Trống cơm: tiếng bịch trầm */
  const o = ac.createOscillator(), g = ac.createGain(); o.type = "sine";
  o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.18);
  g.gain.setValueAtTime(vel, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
  o.connect(g); out(g, musBus, 0.15); o.start(t); o.stop(t + 0.32);
}
function cong(t, vel, bus, m){
  /* Cồng đồng: các họa âm lệch nhau, ngân dài */
  const base = hz(m || 45), parts = [1, 1.52, 2.03, 2.74, 3.4];
  parts.forEach((p, i) => {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = "sine"; o.frequency.value = base*p;
    const v = vel / (i + 1.3);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6 - i*0.35);
    o.connect(g); out(g, bus || musBus, 0.5); o.start(t); o.stop(t + 2.7);
  });
}
function noise(t, dur, vel, type, f0, f1, q, bus){
  const n = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  n.buffer = noiseBuf; f.type = type; f.Q.value = q || 1;
  f.frequency.setValueAtTime(f0, t); if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vel, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  n.connect(f); f.connect(g); out(g, bus || sfxBus, 0.15); n.start(t); n.stop(t + dur + 0.02);
}
function pluck(t, m, vel, bus, dur){
  const o = ac.createOscillator(), g = ac.createGain(); o.type = "triangle"; o.frequency.value = hz(m);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vel, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.4));
  o.connect(g); out(g, bus || sfxBus, 0.3); o.start(t); o.stop(t + (dur || 0.4) + 0.05);
}

  S.plots.forEach((p,i) => {
    if (p.c && p.a >= CROPS[p.c].days && S.suc >= 1){ const g = harvest(i, true); n++; for (const k in g) tot[k] = (tot[k]||0) + g[k]; }
  });
  if (n) RLA.sfx("gat");
  if (n) toast("Gặt " + n + " thửa: " + fmtGot(tot)); else toast("Chưa có thửa nào chín.");
  commit();
}
function buySeed(c, n){
  const cost = CROPS[c].seed * n;
  if (S.money < cost){ toast("Không đủ tiền. Cần " + cost + " đồng.", "warn"); return; }
  S.money -= cost; S.seeds[c] = (S.seeds[c]||0) + n;
  toast("Mua " + n + " giống " + CROPS[c].n + " (−" + cost + " đồng)."); commit();
}
function sellGood(g, all){
  const have = S.goods[g]||0; if (!have) return;
  const n = all ? have : 1, pr = sellPrice(g) * n;
  S.goods[g] = have - n; S.money += pr; stat("ban", pr); RLA.sfx("ban");
  toast("Bán " + n + " " + GOODS[g].n + " được " + pr + " đồng."); commit();
}
function buyRom(n){
  const cost = romBuy()*n;
  if (S.money < cost){ toast("Không đủ tiền. Cần " + cost + " đồng.", "warn"); return; }
  S.money -= cost; RLA.sfx("mua"); S.goods.rom = (S.goods.rom||0) + n;
  toast("Mua " + n + " rơm cỏ (−" + cost + " đồng)."); commit();
}
function buyAnimal(t){
  const A = ANIMALS[t];
  if (S.animals.length >= cap()){ toast("Chuồng đã đầy. Nâng cấp Chuồng rộng để nuôi thêm.", "warn"); return; }
  if (S.money < A.price){ toast("Không đủ tiền. Cần " + A.price + " đồng.", "warn"); return; }
  S.money -= A.price; RLA.sfx("gasuc"); S.animals.push({t, h:0, f:0});
  toast("Đã mua 1 " + A.n + "."); commit();
}
function animalValue(a){ const A = ANIMALS[a.t]; return (a.t === "lon" && a.f >= A.fat) ? A.fatSell : A.sell; }
function sellAnimal(i){
  const a = S.animals[i]; if (!a) return;
  const v = animalValue(a); S.money += v; RLA.sfx("ban"); S.animals.splice(i,1);
  toast("Bán " + ANIMALS[a.t].n + " được " + v + " đồng."); commit();
}
function buyUpg(id){
  const u = UPG.find(x => x.id === id);
  if (S.up[id]) return;
  if (S.money < u.price){ toast("Không đủ tiền. Cần " + u.price + " đồng.", "warn"); return; }
  S.money -= u.price; S.up[id] = true; if (id !== "nha") RLA.sfx("mua");
  addLog("Đã có " + u.n + ".", "good");
  if (id === "guong"){ S.plots.forEach(p => { if (p.c) p.w = true; }); S.wet = true; }
  if (id === "nha"){ mark("nha"); S.won = true; commit(); showWin(); return; }
  toast("Đã có " + u.n + "."); commit();
}
function buyPlot(){
  if (S.plots.length >= 16) return;
  const pr = plotPrice();
  if (S.money < pr){ toast("Không đủ tiền. Cần " + pr + " đồng.", "warn"); return; }
  S.money -= pr; RLA.sfx("mua"); S.plots.push({c:null, a:0, w:!!S.wet, m:60});
  toast("Khai hoang thêm 1 thửa ruộng."); commit();
}
function fillOrder(i){
  const o = S.orders[i]; if (!o) return;
  if ((S.goods[o.g]||0) < o.q){ toast("Chưa đủ hàng: cần " + o.q + " " + GOODS[o.g].n + ".", "warn"); return; }
  S.goods[o.g] -= o.q; S.money += o.pay; S.orders.splice(i,1); stat("don");
  addLog("Giao đơn cho " + o.who + ": " + o.q + " " + GOODS[o.g].n + ", nhận " + o.pay + " đồng.", "good");
  RLA.sfx("ban"); toast("Giao xong đơn, nhận " + o.pay + " đồng."); commit();
}

/* ===== Qua đêm ===== */
function sleep(){
  RLA.sfx("ngu");
  const notes = [], d = S.day, se = seasonOf(d);
  const gentle = yearOf(d) === 1 && se === 3;
  let died = 0;
  for (const p of S.plots){
    if (!p.c){ p.m = clampM(p.m + 4); p.w = false; continue; }
    const C = CROPS[p.c];
    if (p.a < C.days){
      if (p.w) p.a++;
      else if (S.ev && S.ev.id === "han"){ p.c = null; p.a = 0; died++; }
    }
    p.w = false;
  }
  if (died) notes.push(["bad", "Nắng hạn làm héo " + died + " thửa chưa được tưới."]);

  let eggs = 0, hungry = 0, thin = 0; const lost = [];
  for (const a of S.animals){
    const A = ANIMALS[a.t];
    if ((S.goods.rom||0) >= A.eat){ S.goods.rom -= A.eat; a.h = 0; a.f = (a.f||0) + 1; if (a.t === "ga") eggs++; if (a.t === "lon" && a.f === A.fat) stat("lonbeo"); if (a.t === "lon" && a.f === A.fat) notes.push(["good","Một con lợn đã béo. Vào Chuồng để bán được 170 đồng."]); }
    else { a.h++; if (a.t === "trau") thin++; else hungry++; }
  }
  S.animals = S.animals.filter(a => { if (a.t !== "trau" && !gentle && a.h >= 3){ lost.push(ANIMALS[a.t].n); return false; } return true; });
  if (eggs){ S.goods.trung = (S.goods.trung||0) + eggs; notes.push(["good","Gà đẻ " + eggs + " quả trứng."]); }
  if (thin) notes.push(["bad","Trâu thiếu rơm nên gầy đi, chưa kéo cày được. Cho ăn đủ là khoẻ lại."]);
  if (hungry) notes.push(["bad", hungry + " con vật bị đói vì hết rơm cỏ." + (gentle ? " Mùa Đông đầu tiên chúng chưa chết, nhưng không đẻ, không lớn." : " Đói 3 ngày liền sẽ chết.")]);
  if (lost.length) notes.push(["bad","Chết vì đói: " + lost.join(", ") + "."]);

  /* Mùa Đông cả nhà ăn 1 thóc mỗi ngày */
  S.tired = false;
  if (se === 3){
    if ((S.goods.thoc||0) >= 1) S.goods.thoc--;
    else { S.tired = true; notes.push(["bad","Hết thóc ăn, cả nhà đói nên hôm nay chỉ còn " + (MAXS-3) + " sức."]); }
  }

  if (dis(d) === SL){
    const t = taxDue();
    if (taxFree(d)) notes.push(["tax","Mùa Đông năm đầu, lý trưởng miễn tô thuế cho nhà mình."]);
    else {
      const have = S.goods.thoc||0, giveT = Math.min(have, t), short = t - giveT;
      const cash = short * sellPrice("thoc");
      if (short === 0){ S.goods.thoc -= t; notes.push(["tax","Lý trưởng thu tô thuế mùa " + SEASONS[se] + ": " + t + " thóc."]); mark("thue"); }
      else if (S.money >= cash){ S.goods.thoc -= giveT; S.money -= cash; notes.push(["tax","Nộp tô thuế: " + giveT + " thóc, thiếu " + short + " thóc nộp bù " + cash + " đồng."]); }
      else {
        S.goods.thoc -= giveT; const paid = S.money; S.money = 0;
        let m = "Thiếu tô thuế: nộp " + giveT + " thóc và " + paid + " đồng vẫn chưa đủ.";
        if (S.plots.length > 4){ S.plots.pop(); m += " Quan thu lại 1 thửa ruộng."; }
        notes.push(["bad", m]);
      }
    }
  }

  S.day++; S.suc = S.tired ? MAXS-3 : MAXS;
  S.ev = null; S.wet = false;
  if (isPhien(S.day)){
    S.pp = {...S.pf};
    for (const g in S.pf){ const f = S.pf[g] + (Math.random()-0.5)*0.4 + (1 - S.pf[g])*0.2; S.pf[g] = Math.min(1.5, Math.max(0.6, f)); }
    genOrders();
    notes.push(["good","Hôm nay có chợ phiên: giá mới, có 3 đơn hàng mới, giá bán cao hơn 25%."]);
  }
  else if (S.orders.length && S.orders.some(o => o.until <= S.day)) S.orders = S.orders.filter(o => o.until > S.day);
  if (S.warn && S.warn.day === S.day){ strike(S.warn.id, notes); S.warn = null; }
  else rollEvent(notes);
  if (S.up.guong){ S.plots.forEach(p => { if (p.c) p.w = true; }); S.wet = true; }
  if (S.day === SL*4 + 1) mark("dong");
  const nd = dis(S.day), nse = seasonOf(S.day);
  if (nd === 1) notes.unshift(["season","Sang mùa " + SEASONS[nse] + ". " + SEASON_TIP[nse]]);
  if (nd === SL-2 && !taxFree(S.day)) notes.push(["tax","Còn 3 ngày nữa nộp tô thuế: " + taxDue() + " thóc (thiếu thì nộp bù bằng tiền)."]);
  if (nse === 2 && (nd === 1 || nd === 6)){
    const w = winterInfo();
    notes.push(["bad","Còn " + (SL - nd + 1) + " ngày nữa đến mùa Đông. Kho thóc đủ cho nhà ăn " + Math.min(w.riceDays, SL) + "/" + SL + " ngày" + (w.romDays === null ? "" : ", rơm cỏ đủ cho gia súc " + Math.min(w.romDays, SL) + "/" + SL + " ngày") + "."]);
  }
  const need = romNeed(), have = S.goods.rom||0;
  if (need && have < need*3) notes.push(["bad","Rơm cỏ chỉ còn " + have + ", đủ cho khoảng " + Math.floor(have/need) + " ngày."]);
  notes.forEach(n => addLog(n[1], n[0]));
  commit();
  showMorning(notes);
}
function pickW(opts){ const tot = opts.reduce((s,o) => s + o[1], 0); let r = Math.random()*tot; for (const o of opts){ if ((r -= o[1]) < 0) return o[0]; } return opts[0][0]; }
function wipe(list, n){ let k = 0; while (k < n && list.length){ const p = list.splice(Math.floor(Math.random()*list.length),1)[0]; p.c = null; p.a = 0; p.w = false; k++; } return k; }
/* Sự kiện báo trước tới ngày thì xảy ra */
function strike(id, notes){
  let msg, k = "bad";
  if (id === "chau"){
    const lua = S.plots.filter(p => p.c === "lua"), other = S.plots.filter(p => p.c && p.c !== "lua");
    const n = Math.max(1, Math.ceil((lua.length + other.length)/2));
    let hit = wipe(lua, n); hit += wipe(other, n - hit);
    msg = hit ? "Châu chấu kéo đến như trưởng làng báo, ăn trụi " + hit + " thửa chưa gặt." : "Châu chấu kéo đến nhưng ruộng đã gặt sạch, nhà mình không mất gì.";
    if (!hit) k = "good";
  } else {
    if (S.up.de){ msg = "Nước sông lên cao nhưng đê vững, ruộng an toàn."; k = "good"; }
    else {
      const hit = wipe(S.plots.filter(p => p.c), 3);
      msg = hit ? "Nước sông tràn bờ, ngập " + hit + " thửa ruộng. Đắp đê (mục Nâng cấp) để phòng lần sau." : "Nước sông tràn bờ, may ruộng đang trống nên không mất gì.";
    }
  }
  S.ev = {id, msg, k};
  notes.push([k, msg]);
}
function rollEvent(notes){
  const se = seasonOf(S.day);
  if (S.day < 4 || Math.random() > (se === 3 ? 0.2 : 0.38)) return;
  const opts = [["mua", se === 3 ? 1 : 3], ["hoi", 0.6]];
  if (se !== 3) opts.push(["han", se === 1 ? 2 : 1]);
  if (!S.warn && (se === 1 || se === 2)){ opts.push(["chau", 1.5]); if (S.day > SL) opts.push(["lu", 1.2]); }
  if (S.animals.some(a => a.t === "ga")) opts.push(["cao", 1]);
  const id = pickW(opts); let msg, k = "bad";
  if (id === "chau" || id === "lu"){
    S.warn = {id, day:S.day + 2};
    msg = id === "chau"
      ? "Trưởng làng báo tin: 2 ngày nữa (sáng ngày " + dis(S.day+2) + ") châu chấu sẽ kéo đến, ăn một nửa số thửa chưa gặt. Hãy gặt lúa chín, hoặc gặt sớm cây đã lớn quá nửa."
      : "Trưởng làng báo tin: 2 ngày nữa (sáng ngày " + dis(S.day+2) + ") nước sông lên." + (S.up.de ? " Nhà mình đã đắp đê nên yên tâm." : " Chưa có đê thì có thể mất 3 thửa. Gặt sớm, hoặc đắp đê ngay trong mục Nâng cấp.");
    S.ev = {id:"warn", msg, k};
    notes.push([k, msg]);
    return;
  }
  if (id === "mua"){ S.plots.forEach(p => { if (p.c) p.w = true; }); S.wet = true; msg = "Mưa rào: cả cánh đồng được tưới hôm nay, gieo mới cũng có nước."; k = "good"; }
  else if (id === "hoi"){ msg = "Làng mở hội: mọi hàng bán ở chợ hôm nay được thêm 20%."; k = "good"; }
  else if (id === "han"){ msg = "Nắng hạn: thửa nào chưa tưới đến tối sẽ héo chết. Giá thóc và rau tăng."; }
  else if (id === "cao"){
    if (S.up.cho){ msg = "Đêm qua có cáo lảng vảng, chó sủa đuổi đi."; k = "good"; }
    else { const i = S.animals.findIndex(a => a.t === "ga"); S.animals.splice(i,1); msg = "Cáo vào chuồng bắt mất 1 con gà. Nuôi chó giữ nhà để phòng."; }
  }
  S.ev = {id, msg, k};
  notes.push([k, msg]);
}

const modal = document.getElementById("modal"), sheet = document.getElementById("sheet");
let modalLock = false;

   <li><b>Tưới:</b> thửa có nhãn đỏ “Khô” là chưa tưới. Cây chỉ lớn qua đêm nếu hôm đó đã được tưới. Ra Giếng đầu bờ để tưới, gặt cả đồng một lần.</li>
   <li><b>Gặt:</b> thửa viền vàng là đã chín, đứng vào bấm Làm để gặt. Hàng vào Kho thóc.</li>

function showMorning(notes){
  setTimeout(() => RLA.sfx(notes.some(n => n[0] === "bad") ? "sukien" : "sang"), 900);
  const se = seasonOf(S.day);
  openModal(`<h2>Sáng ngày ${dis(S.day)} · mùa ${SEASONS[se]}</h2>
   <p class="note">Năm thứ ${yearOf(S.day)}</p>
   ${notes.length ? `<ul class="notes">${notes.map(n => `<li class="${n[0]}">${esc(n[1])}</li>`).join("")}</ul>` : `<p>Một đêm yên bình. Trời quang, gà gáy sáng.</p>`}
   <div class="acts"><button class="btn p" data-act="close">Bắt đầu ngày mới</button></div>`);
}
function openSeeds(i){
  const se = seasonOf(S.day);
  const items = Object.entries(CROPS).map(([c,C]) => {
    const have = S.seeds[c]||0, ok = C.ss.includes(se);
    const est = fmtGot(yieldOf({c, a:C.days, m:S.plots[i].m})).replace(/\+/g,"");
    const why = !ok ? "Không hợp mùa " + SEASONS[se] : have ? "Còn " + have + " giống · " + C.days + " đêm · được " + est + " · " + fdText(C.fd) : "Hết giống, ra Chợ mua";
    return `<button data-act="plant" data-i="${i}" data-c="${c}" ${(!ok || !have) ? "disabled" : ""}><span class="e">${C.i}</span><span><b>${C.n}</b><small>${why}</small></span></button>`;
  }).join("");
  openModal(`<h2>Gieo gì ở thửa này?</h2><p class="note">Mùa ${SEASONS[se]}. Độ màu thửa này: <b>${S.plots[i].m}/100</b>. Gieo tốn 1 sức.</p><div class="seedpick">${items}</div>
   <div class="acts"><button class="btn" data-act="goto" data-place="cho">Đi ra chợ mua giống</button><button class="btn" data-act="close">Đóng</button></div>`);
}
function showReset(){

   <div class="acts"><button class="btn" data-act="close">Thôi, chơi tiếp</button><button class="btn p" data-act="doreset">Xoá và chơi lại</button></div>`);

     <span class="a"><button class="btn s" data-act="sell" data-g="${g}" ${have ? "" : "disabled"}>Bán 1</button><button class="btn s p" data-act="sellall" data-g="${g}" ${have ? "" : "disabled"}>Bán hết ${have ? "· " + pr*have + "đ" : ""}</button></span></div>`;

/* ===== Bảng nhiệm vụ: mục tiêu cần đạt, tiến độ, phần thưởng, bấm để nhận ===== */
function stat(k, n){ S.st = S.st || {}; S.st[k] = (S.st[k]||0) + (n ?? 1); }
const st = k => (S.st && S.st[k]) || 0;
/* go: nơi để chỉ đường. r: phần thưởng {money, seeds:{}, goods:{}, title} */
const QUESTS = [
  {id:"q_gieo",   t:"Gieo hạt đầu tiên",            d:"Ra ruộng, đứng trên thửa đất trống và bấm Làm để gieo.", need:1,  cur:() => st("gieo"), go:"gieng", r:{money:10, seeds:{rau:2}}},
  {id:"q_tuoi",   t:"Chăm ruộng: tưới 5 lượt",      d:"Thửa có nhãn đỏ “Khô” cần tưới thì cây mới lớn qua đêm.", need:5, cur:() => st("tuoi"), go:"gieng", r:{money:15}},
  {id:"q_lang",   t:"Làm quen người làng",           d:"Nói chuyện với Cu Tí, bà Hương, thầy đồ Chu và sư bác.", need:4, cur:() => Object.keys(S.talked||{}).length, r:{money:10}},
  {id:"lua1",     t:"Gặt vụ lúa đầu tiên",           d:"Lúa cần 5 đêm được tưới. Thửa viền vàng là đã chín.", need:1, cur:() => S.goals.lua1 ? 1 : 0, go:"gieng", r:{money:20, goods:{rom:5}}},
  {id:"q_ban",    t:"Bán hàng ở chợ được 50 đồng",   d:"Mang nông sản ra chợ làng bán. Ngày 5 và 10 là chợ phiên, giá cao hơn.", need:50, cur:() => st("ban"), go:"cho", r:{seeds:{lua:3}}},
  {id:"q_lac",    t:"Trồng lạc cho ruộng màu lại",   d:"Lạc là cây họ đậu, gặt xong ruộng được thêm 15 màu.", need:1, cur:() => st("lac"), go:"gieng", r:{money:15, seeds:{lac:2}}},
  {id:"q_nuoi",   t:"Nuôi đủ 4 con gia súc",         d:"Vào chuồng trại mua thêm gà, lợn hoặc trâu.", need:4, cur:() => S.animals.length, go:"chuong", r:{goods:{rom:10}}},
  {id:"q_don",    t:"Giao một đơn hàng chợ phiên",   d:"Đơn đặt hàng ở chợ trả gấp 1,3 đến 1,8 lần giá.", need:1, cur:() => st("don"), go:"cho", r:{money:30}},
  {id:"thue",     t:"Nộp đủ tô thuế bằng thóc",      d:"Cuối ngày 10 mỗi mùa nộp 1 thóc mỗi thửa. Gặp lý trưởng để xem.", need:1, cur:() => S.goals.thue ? 1 : 0, go:"ly", r:{money:20}},
  {id:"q_ruong8", t:"Khai hoang tới 8 thửa",          d:"Đứng cạnh tấm biển “Khai hoang” ở ruộng và bấm Làm.", need:8, cur:() => S.plots.length, go:"gieng", r:{money:30}},
  {id:"q_nang",   t:"Sắm một món ở phường thợ",      d:"Chó giữ nhà, chuồng rộng, đê, guồng nước đều giúp làm ăn dễ hơn.", need:1, cur:() => Object.keys(S.up).filter(k => k !== "nha").length, go:"nang", r:{money:20}},
  {id:"trau",     t:"Mua một con trâu kéo cày",      d:"Trâu ăn no thì mỗi lần gặt lúa được thêm 1 thóc.", need:1, cur:() => S.goals.trau ? 1 : 0, go:"chuong", r:{money:30}},
  {id:"q_lon",    t:"Nuôi một con lợn béo",          d:"Lợn ăn no đủ 8 ngày thì béo, bán được 170 đồng.", need:1, cur:() => st("lonbeo"), go:"chuong", r:{money:40}},
  {id:"r10",      t:"Có 10 thửa ruộng",              d:"Khai hoang thêm ruộng. Thêm ruộng thì tô thuế cũng thêm.", need:10, cur:() => S.plots.length, go:"gieng", r:{money:50}},
  {id:"q_giau",   t:"Dành dụm được 500 đồng",        d:"Có lúc nào trong túi đủ 500 đồng là xong.", need:500, cur:() => Math.max(st("maxmoney"), S.money), r:{seeds:{mia:3}}},
  {id:"dong",     t:"Qua hết mùa Đông năm thứ nhất", d:"Trữ thóc cho nhà ăn và rơm cỏ cho gia súc từ mùa Thu.", need:1, cur:() => S.goals.dong ? 1 : 0, go:"kho", r:{money:80}},
  {id:"nha",      t:"Dựng nhà ngói ba gian",         d:"Mục tiêu lớn nhất: 1.500 đồng ở phường thợ.", need:1, cur:() => S.goals.nha ? 1 : 0, go:"nang", r:{title:"Phú nông Đại Việt"}}
];
const DAILY = [
  {k:"tuoi", need:3, t:"Tưới 3 lượt ruộng"}, {k:"gat", need:2, t:"Gặt 2 thửa"}, {k:"gieo", need:2, t:"Gieo 2 thửa"}, {k:"ban", need:30, t:"Bán hàng được 30 đồng"}
];
function ensureQuests(){
  S.qc = S.qc || {}; S.qn = S.qn || {}; S.st = S.st || {};
  /* Ván cũ: mục tiêu đã xong ở bản trước thì thưởng đã cộng, đánh dấu là đã nhận để khỏi nhận hai lần */
  if (!S.qInit){ for (const q of QUESTS) if (S.goals[q.id]){ S.qc[q.id] = true; S.qn[q.id] = true; } S.qInit = true; }
  if (!S.daily || S.daily.day !== S.day){
    const pool = DAILY.filter(x => !(seasonOf(S.day) === 3 && x.k === "gieo"));
    const D = pool[Math.floor(Math.random()*pool.length)];
    S.daily = {day:S.day, k:D.k, need:D.need, t:D.t, base:st(D.k), money:8 + Math.floor(Math.random()*8)};
  }
  if (S.money > st("maxmoney")) S.st.maxmoney = S.money;
}
const qCur = q => Math.min(q.need, q.cur());
const qDone = q => q.cur() >= q.need;
const dCur = () => Math.min(S.daily.need, st(S.daily.k) - S.daily.base);
const dDone = () => dCur() >= S.daily.need;
const dId = () => "daily" + S.daily.day;
function rewardText(r){
  const a = [];
  if (r.money) a.push(r.money + " đồng");
  for (const c in r.seeds || {}) a.push(r.seeds[c] + " giống " + CROPS[c].n);
  for (const g in r.goods || {}) a.push(r.goods[g] + " " + GOODS[g].n);
  if (r.title) a.push("danh hiệu “" + r.title + "”");
  return a.join(", ");
}
function claimable(){ ensureQuests(); return QUESTS.filter(q => qDone(q) && !S.qc[q.id]).length + (dDone() && !S.qc[dId()] ? 1 : 0); }
function trackedQuest(){
  const q = QUESTS.find(x => x.id === S.qt && !S.qc[x.id]);
  return q || QUESTS.find(x => !S.qc[x.id]) || null;
}
function claimQuest(id){
  ensureQuests();
  let r, t;
  if (id === dId()){ if (!dDone() || S.qc[id]) return; r = {money:S.daily.money}; t = "Việc hôm nay: " + S.daily.t; }
  else { const q = QUESTS.find(x => x.id === id); if (!q || !qDone(q) || S.qc[id]) return; r = q.r; t = q.t; }
  S.qc[id] = true;
  if (r.money) S.money += r.money;
  for (const c in r.seeds || {}) S.seeds[c] = (S.seeds[c]||0) + r.seeds[c];
  for (const g in r.goods || {}) S.goods[g] = (S.goods[g]||0) + r.goods[g];
  if (r.title) S.title = r.title;
  if (S.qt === id) S.qt = null;
  addLog("Nhận thưởng nhiệm vụ “" + t + "”: " + rewardText(r) + ".", "good");
  RLA.sfx("ban"); toast("Nhận thưởng: " + rewardText(r));
  commit();
}
/* Báo khi một nhiệm vụ vừa xong để người chơi vào nhận thưởng */
function checkQuests(){
  ensureQuests();
  for (const q of QUESTS) if (!S.qn[q.id] && qDone(q)){ S.qn[q.id] = true; toast("Xong nhiệm vụ: " + q.t + ". Mở bảng Nhiệm vụ để nhận thưởng."); RLA.sfx("sang"); }
  if (dDone() && !S.qn[dId()]){ S.qn[dId()] = true; toast("Xong việc hôm nay. Mở bảng Nhiệm vụ để nhận thưởng."); }
}
function qRow(id, icon, title, desc, cur, need, rw, done, claimed, go){
  const pct = Math.round(cur/need*100);
  return `<div class="qrow ${done && !claimed ? "ready" : ""} ${claimed ? "claimed" : ""}">
    <span class="qic">${icon}</span>
    <div class="qt"><b>${esc(title)}${S.qt === id && !claimed ? '<span class="pill">Đang theo dõi</span>' : ""}</b>
     <small>${esc(desc)}</small>
     <div class="qbar" role="progressbar" aria-valuenow="${cur}" aria-valuemin="0" aria-valuemax="${need}"><i style="width:${pct}%"></i></div>
     <small class="num">${cur}/${need} · Thưởng: <b style="display:inline">${esc(rw)}</b></small></div>
    <div class="qa">${claimed ? '<span class="pill good">Đã nhận</span>'
      : done ? `<button class="btn s p" data-act="claim" data-id="${id}">Nhận thưởng</button>`
      : `${go ? `<button class="btn s" data-act="goto" data-place="${go}">Chỉ đường</button>` : ""}${id.startsWith("daily") ? "" : `<button class="btn s" data-act="track" data-id="${id}" ${S.qt === id ? "disabled" : ""}>Theo dõi</button>`}`}</div>
  </div>`;
}
function vNhiemVu(){

  const QI = {q_gieo:"mam", q_tuoi:"guong", q_lang:"cho", lua1:"lua", q_ban:"trung", q_lac:"lac", q_nuoi:"ga", q_don:"thoc", thue:"thoc", q_ruong8:"de", q_nang:"chuong", trau:"trau", q_lon:"lon", r10:"lua", q_giau:"mia", dong:"rom", nha:"nha"};

   <div class="sec"><h3>Việc hôm nay</h3>${qRow(dId(), RLA.art("thoc"), D.t, "Việc mới mỗi sáng, hết ngày thì đổi.", dCur(), D.need, D.money + " đồng", dDone(), !!S.qc[dId()], dGo)}</div>

   ${done.length ? `<details class="sec"><summary>Đã nhận thưởng (${done.length})</summary>${done.map(q => qRow(q.id, RLA.art(QI[q.id]), q.t, q.d, q.need, q.need, rewardText(q.r), true, true)).join("")}</details>` : ""}`;

function vTracker(){
  ensureQuests();
  const q = trackedQuest(), n = claimable();
  if (!q && !n) return "";
  const body = q ? `<b>${esc(q.t)}</b><span class="qbar"><i style="width:${Math.round(qCur(q)/q.need*100)}%"></i></span><small class="num">${qCur(q)}/${q.need}${qDone(q) ? " · xong, bấm để nhận thưởng" : ""}</small>` : `<b>Có phần thưởng đang chờ</b>`;
  return `<button class="tracker" data-act="nv" aria-label="Mở bảng nhiệm vụ"><span class="tl">Nhiệm vụ${n ? ` · ${n} thưởng chờ nhận` : ""}</span>${body}</button>`;
}

const FOOD = {khoai:2, trung:1, rau:1};
function vTui(){
  const seeds = Object.entries(CROPS).map(([c, C]) => {
    const n = S.seeds[c]||0, sel = S.hold === c;
    return `<button class="slot ${sel ? "sel" : ""}" data-act="hold" data-c="${c}" ${n ? "" : "disabled"} aria-pressed="${sel}"><span class="si">${C.i}</span><span class="sn">${C.n}</span><span class="sc num">${n}</span></button>`;
  }).join("");
  const goods = Object.entries(GOODS).map(([g, G]) => {
    const n = S.goods[g]||0, f = FOOD[g];
    return `<div class="slot"><span class="si">${G.i}</span><span class="sn">${G.n}</span><span class="sc num">${n}</span>${f ? `<button class="btn s" data-act="eat" data-g="${g}" ${n && S.suc < MAXS ? "" : "disabled"}>Ăn +${f} sức</button>` : ""}</div>`;
  }).join("");
  const H = S.hold && CROPS[S.hold];
  return `<h2>Túi đồ</h2>
   <p class="sub">Đồ đựng trong gùi tre anh đeo sau lưng. Chạm một loại giống để <b>cầm trên tay</b>: ra ruộng đứng trên thửa trống bấm Làm là gieo luôn, không phải chọn lại.</p>
   <div class="box" style="background:var(--bg)">Đang cầm: <b>${H ? H.n + " (còn " + (S.seeds[S.hold]||0) + " giống)" : "tay không"}</b>${H ? ` <button class="btn s" data-act="hold" data-c="">Cất đi</button>` : ""}</div>
   <div class="sec"><h3>Hạt giống</h3><div class="slots">${seeds}</div></div>
   <div class="sec"><h3>Nông sản</h3><div class="slots">${goods}</div><p class="note">Đói thì ăn khoai, trứng hoặc rau để hồi sức ngay trong ngày (sức tối đa ${MAXS}). Còn lại mang ra chợ bán.</p></div>
   <div class="sec"><h3>Vật nuôi, nhà cửa</h3><p class="note">${S.animals.length} con trong chuồng · ${S.plots.length} thửa ruộng · ${Object.keys(S.up).length ? "đã có: " + UPG.filter(u => S.up[u.id]).map(u => u.n).join(", ") : "chưa sắm nâng cấp nào"}.</p></div>`;
}
function eatGood(g){
  const f = FOOD[g]; if (!f || !(S.goods[g] > 0) || S.suc >= MAXS) return;
  S.goods[g]--; S.suc = Math.min(MAXS, S.suc + f); RLA.sfx("mua");
  toast("Ăn 1 " + GOODS[g].n + ", hồi " + f + " sức."); commit();
}
function holdSeed(c){
  S.hold = c && S.seeds[c] > 0 ? c : null; RLA.sfx("tap");
  toast(S.hold ? "Đang cầm giống " + CROPS[c].n + ". Ra thửa trống bấm Làm để gieo." : "Đã cất giống vào túi.");
  commit();
}

const T = 32, MW = 56, MH = 40;
const stage = document.getElementById("stage"), cv = document.getElementById("world"), cx = cv.getContext("2d");
const actBtn = document.getElementById("actbtn"), joyEl = document.getElementById("joy"), hintEl = document.getElementById("hint");
const coarse = matchMedia("(pointer:coarse)").matches;

/* Hình vẽ SVG của game chuyển thành ảnh để vẽ lên bản đồ */
const IMG = {};
for (const k in RLA.G){
  const im = new Image();
  im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">${RLA.G[k]}</svg>`);
  IMG[k] = im;
}
function img(k, x, y, s, flip){
  const im = IMG[k]; if (!(im && im.complete && im.naturalWidth)) return;
  if (flip){ cx.save(); cx.translate(x, y); cx.scale(-1, 1); cx.drawImage(im, -s/2, -s/2, s, s); cx.restore(); }
  else cx.drawImage(im, x - s/2, y - s/2, s, s);
}
function rr(g, x, y, w, h, r){ g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); }
function rng(seed){ return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }

/* Địa hình theo ô: 0 cỏ, 1 sông, 2 đường đất, 3 bãi cát, 4 sân đất, 5 bờ ruộng, 6 ao */
const ter = Array.from({length:MH}, () => new Uint8Array(MW));
const solid = Array.from({length:MH}, () => new Uint8Array(MW));
function fillT(x, y, w, h, v){ for (let j = y; j < y+h; j++) for (let i = x; i < x+w; i++) if (j >= 0 && j < MH && i >= 0 && i < MW) ter[j][i] = v; }
function block(x, y, w, h){ for (let j = y; j < y+h; j++) for (let i = x; i < x+w; i++) if (j >= 0 && j < MH && i >= 0 && i < MW) solid[j][i] = 1; }

const TREES = [[3,8],[3,15],[4,21],[23,6],[35,9],[36,13],[52,12],[52,21],[36,26],[41,36],[47,36],[5,34],[18,36],[2,27],[27,26],[33,24.9]];
const CAU = [[24,8],[31.5,5.2],[41,9],[49.5,9],[20,29],[28,33]];
const HOME = [28*T, 11*T + 6];

fillT(0,0,MW,3,1); fillT(0,3,MW,1,3);
fillT(2,23,52,2,2); fillT(38,5,2,33,2);
fillT(6,7,16,16,5);
fillT(24,10,14,2,4); fillT(41,11,9,2,4); fillT(41,26,13,8,4); fillT(8,31,10,3,4); fillT(20,34,8,2,4); fillT(46,18,6,1,4);
fillT(29,29,7,7,6);
block(0,0,MW,3); block(29,29,7,7);

const plotRect = i => [(6 + (i%4)*4)*T + 4, (7 + Math.floor(i/4)*4)*T + 4, 3*T - 8, 3*T - 8];

const solidAt = (x, y) => { const i = Math.floor(x/T), j = Math.floor(y/T); return i < 0 || j < 0 || i >= MW || j >= MH || solid[j][i] === 1; };
const hitBox = (x, y) => solidAt(x-7, y-6) || solidAt(x+7, y-6) || solidAt(x-7, y+1) || solidAt(x+7, y+1);
function tryMove(o, dx, dy){ if (dx && !hitBox(o.x + dx, o.y)) o.x += dx; if (dy && !hitBox(o.x, o.y + dy)) o.y += dy; }

let W = 0, H = 0, dpr = 1, zoom = 1, camX = 0, camY = 0;
function resize(){
  const r = stage.getBoundingClientRect(); W = r.width; H = r.height;

  cv.width = Math.max(1, Math.round(W*dpr)); cv.height = Math.max(1, Math.round(H*dpr));

}

/* ---------- Nền bản đồ vẽ sẵn một lần (vẽ lại khi đổi mùa, đắp đê, dựng nhà ngói) ---------- */
let bg = null, bgKey = "", BGS = 2;
const GRASS = [["#9DC46B","#86AE57","#B2D27F"],["#86B551","#6F9E3E","#9CC764"],["#B5B65C","#9C9C48","#C7C46E"],["#98A889","#7F8F72","#AAB89C"]];
const LEAF = [["#4E8F2F","#6FAE45"],["#3F7F26","#5E9E36"],["#8E9A34","#B49A3A"],["#5E7A48","#748E5C"]];
function ensureBg(){
  const k = seasonOf(S.day) + "|" + (S.up.de ? 1 : 0) + (S.up.nha ? 1 : 0);
  if (bg && k === bgKey) return;
  bgKey = k;
  if (!bg){ bg = document.createElement("canvas"); BGS = Math.max(1, Math.min(2, dpr*zoom)); bg.width = MW*T*BGS; bg.height = MH*T*BGS; }
  const g = bg.getContext("2d"); g.setTransform(BGS,0,0,BGS,0,0); paintBg(g);
}
function paintBg(g){
  const se = seasonOf(S.day), R = rng(11), [gr, grd, grl] = GRASS[se];
  g.fillStyle = gr; g.fillRect(0, 0, MW*T, MH*T);
  g.globalAlpha = 0.35;
  for (let i = 0; i < 260; i++){ g.fillStyle = R() < 0.5 ? grd : grl; g.beginPath(); g.ellipse(R()*MW*T, R()*MH*T, 20 + R()*50, 10 + R()*26, 0, 0, 7); g.fill(); }
  g.globalAlpha = 1;
  const TC = {1:"#4F80A8", 2:"#C8A472", 3:"#D9C695", 4:"#D4BE90", 5:"#7C9F55", 6:"#4C8197"};
  for (let j = 0; j < MH; j++) for (let i = 0; i < MW; i++){ const v = ter[j][i]; if (v){ g.fillStyle = TC[v]; g.fillRect(i*T, j*T, T + 0.5, T + 0.5); } }
  /* sỏi trên đường, cỏ lăn tăn */
  for (let i = 0; i < 900; i++){
    const x = R()*MW*T, y = R()*MH*T, v = ter[Math.floor(y/T)][Math.floor(x/T)];
    if (v === 2 || v === 4){ g.fillStyle = R() < 0.5 ? "rgba(120,90,50,.35)" : "rgba(255,240,210,.35)"; g.beginPath(); g.ellipse(x, y, 1.5 + R()*2, 1 + R()*1.5, 0, 0, 7); g.fill(); }
  }

/* ---------- Tự tìm đường khi chạm vào bản đồ ---------- */
let route = null, tapMark = null;
function nearestFree(px, py){
  const ti = Math.floor(px/T), tj = Math.floor(py/T); let best = null, bd = 1e9;
  for (let j = tj - 4; j <= tj + 4; j++) for (let i = ti - 4; i <= ti + 4; i++){
    if (i < 0 || j < 0 || i >= MW || j >= MH || solid[j][i]) continue;
    const d = Math.hypot((i + 0.5)*T - px, (j + 0.5)*T - py); if (d < bd){ bd = d; best = [i, j]; }
  }
  return best;
}
function bfs(si, sj, gi, gj){
  const N = MW*MH, prev = new Int32Array(N).fill(-1), q = new Int32Array(N); let h = 0, t = 0;
  const s = sj*MW + si, goal = gj*MW + gi; q[t++] = s; prev[s] = s;
  while (h < t){
    const c = q[h++]; if (c === goal) break;
    const ci = c % MW, cj = (c - ci)/MW;
    for (const [di, dj] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const ni = ci + di, nj = cj + dj; if (ni < 0 || nj < 0 || ni >= MW || nj >= MH || solid[nj][ni]) continue;
      const n = nj*MW + ni; if (prev[n] !== -1) continue; prev[n] = c; q[t++] = n;
    }
  }
  if (prev[goal] === -1) return null;
  const pts = []; for (let c = goal; c !== s; c = prev[c]){ const ci = c % MW; pts.push([(ci + 0.5)*T, ((c - ci)/MW + 0.5)*T + 6]); }
  return pts.reverse();
}
function walkTo(px, py, target){
  const goal = nearestFree(px, py); if (!goal){ route = null; return; }
  const pts = bfs(Math.floor(P.x/T), Math.floor((P.y - 3)/T), goal[0], goal[1]);
  if (!pts){ route = null; toast("Không có lối đi tới đó."); return; }
  if (!hitBox(px, py)) pts.push([px, py]);
  route = {pts, target, stuck:0};
}
function goWorld(wx, wy){
  const L = interacts(); let hit = null;
  for (const it of L){ const [x, y, w, h] = it.r; if (wx >= x - 6 && wx <= x + w + 6 && wy >= y - 6 && wy <= y + h + 6){ hit = it; if (it.npc) break; } }
  if (!hit) for (const k in PLACES){ const p = PLACES[k]; if (wx >= p.x*T && wx <= (p.x + p.w)*T && wy >= p.y*T - T && wy <= (p.y + p.h)*T){ hit = L.find(it => it.id === k); break; } }
  tapMark = {x:wx, y:wy, t:performance.now()};
  if (hit){
    if (focus && focus.id === hit.id){ route = null; hit.go(); return; }
    const [x, y, w, h] = hit.r; walkTo(x + w/2, y + h/2 + (hit.npc ? 12 : 0), hit.id);
  } else walkTo(wx, wy, null);
}
function goPlace(k){ const d = PLACES[k].door; walkTo((d[0] + d[2]/2)*T, (d[1] + d[3]/2)*T, k); }

  else if (e.code === "KeyI") openPanel("tui");
});
document.addEventListener("keyup", e => held.delete(e.code));
window.addEventListener("blur", () => held.clear());

/* ---------- Cần điều khiển cảm ứng: kéo ngón tay để đi, chạm nhẹ để tự đi tới ---------- */
let ptr = null;
function joyAt(x, y, kx, ky){ joyEl.hidden = false; joyEl.style.left = x + "px"; joyEl.style.top = y + "px"; joyEl.firstChild.style.transform = `translate(${kx}px,${ky}px)`; }
function joyRest(){
  if (coarse){ joyEl.classList.add("ghost"); joyAt(86 + Math.max(0, (window.visualViewport ? 0 : 0)), H - 96, 0, 0); }
  else joyEl.hidden = true;
}
cv.addEventListener("pointerdown", e => {
  if (ptr) return;
  try { cv.setPointerCapture(e.pointerId); } catch(_){}
  const r = stage.getBoundingClientRect();
  ptr = {id:e.pointerId, sx:e.clientX - r.left, sy:e.clientY - r.top, x:e.clientX - r.left, y:e.clientY - r.top, t:performance.now(), joy:false};
});
cv.addEventListener("pointermove", e => {
  if (!ptr || e.pointerId !== ptr.id) return;
  const r = stage.getBoundingClientRect(); ptr.x = e.clientX - r.left; ptr.y = e.clientY - r.top;
  const dx = ptr.x - ptr.sx, dy = ptr.y - ptr.sy, d = Math.hypot(dx, dy);
  if (!ptr.joy && d > 12){ ptr.joy = true; route = null; joyEl.classList.remove("ghost"); }
  if (ptr.joy){ const k = Math.min(1, 42/Math.max(d, 1)); joyAt(ptr.sx, ptr.sy, dx*k, dy*k); }
});
function ptrEnd(e){
  if (!ptr || e.pointerId !== ptr.id) return;
  const was = ptr; ptr = null; joyRest();
  if (!was.joy && e.type === "pointerup" && performance.now() - was.t < 600 && modal.hidden) goWorld(camX + was.x/zoom, camY + was.y/zoom);
}
cv.addEventListener("pointerup", ptrEnd);
cv.addEventListener("pointercancel", ptrEnd);
cv.addEventListener("contextmenu", e => e.preventDefault());

/* ---------- Cập nhật mỗi khung hình ---------- */
let focus = null, walked = 0, lastLab = null, saveT = 0, hintT = 0;
function update(dt){
  const free = modal.hidden;
  let mx = 0, my = 0;
  if (free){
    for (const c of held){ const v = MOVE[c]; mx += v[0]; my += v[1]; }
    if (ptr && ptr.joy){ let jx = (ptr.x - ptr.sx)/42, jy = (ptr.y - ptr.sy)/42; const l = Math.hypot(jx, jy); if (l > 1){ jx /= l; jy /= l; } mx += jx; my += jy; }
  }
  if (mx || my) route = null;
  else if (route && free){
    const wp = route.pts[0];
    if (!wp) route = null;
    else { const dx = wp[0] - P.x, dy = wp[1] - P.y, d = Math.hypot(dx, dy); if (d < 3){ route.pts.shift(); if (!route.pts.length && !route.target) route = null; } else { mx = dx/d; my = dy/d; } }
  }
  let l = Math.hypot(mx, my); if (l > 1){ mx /= l; my /= l; l = 1; }
  P.mv = false;
  if (l > 0.12 && free){
    const sp = 150*dt*(l < 0.5 ? 0.6 : 1), ox = P.x, oy = P.y;
    tryMove(P, mx*sp, my*sp);
    const moved = Math.hypot(P.x - ox, P.y - oy);
    walked += moved;
    if (route){ route.stuck = moved < sp*0.2 ? route.stuck + dt : 0; if (route.stuck > 0.6) route = null; }
    P.mv = moved > 0.1; P.ph += dt*11;
    P.dir = Math.abs(mx) > Math.abs(my) ? (mx > 0 ? 1 : 3) : (my > 0 ? 2 : 0);
  }
  focus = pickFocus();
  if (route && route.target && focus && focus.id === route.target && free){ const f = focus; route = null; f.go(); }
  if (route && !route.pts.length) route = null;
  NPCS.forEach(n => updNpc(n, dt)); updHerd(dt);
  if (modal.hidden) talking = null;
  const lab = focus ? focus.lab : "";
  if (lab !== lastLab){
    lastLab = lab;
    actBtn.innerHTML = `<b>Làm${coarse ? "" : " (E)"}</b><small>${lab ? esc(lab) : "Đến gần chỗ cần làm"}</small>`;
    actBtn.classList.toggle("idle", !lab);
  }
  S.pos = [Math.round(P.x), Math.round(P.y)];
  saveT += dt; if (saveT > 5){ saveT = 0; save(); }
  hintT += dt; if ((walked > 400 || hintT > 25) && !hintEl.classList.contains("gone")) hintEl.classList.add("gone");
}

/* ---------- Vẽ mỗi khung hình ---------- */
function drawPlot(i, t){
  const [x, y, w, h] = plotRect(i);
  if (i >= S.plots.length){
    cx.fillStyle = "rgba(70,90,40,.35)"; rr(cx, x, y, w, h, 6); cx.fill();
    const R = rng(100 + i); cx.strokeStyle = "#5E7A30"; cx.lineWidth = 1.6;
    for (let k = 0; k < 12; k++){ const tx = x + 6 + R()*(w - 12), ty = y + 10 + R()*(h - 14); cx.beginPath(); cx.moveTo(tx, ty); cx.lineTo(tx - 3, ty - 8); cx.moveTo(tx, ty); cx.lineTo(tx + 3, ty - 7); cx.stroke(); }
    if (i === S.plots.length){
      const sx = x + w/2, sy = y + h/2 + 8;
      cx.fillStyle = "#6E4823"; cx.fillRect(sx - 2, sy - 18, 4, 22);
      cx.fillStyle = "#C9A06A"; rr(cx, sx - 24, sy - 34, 48, 20, 4); cx.fill();
      cx.fillStyle = "#3C2A18"; cx.font = "700 9px 'Be Vietnam Pro',sans-serif"; cx.textAlign = "center"; cx.textBaseline = "middle";
      cx.fillText("Khai hoang", sx, sy - 28); cx.fillText(plotPrice() + "đ", sx, sy - 19);
    }
    return;
  }
  const p = S.plots[i];
  cx.fillStyle = p.w ? "#5B4330" : "#8B6A45"; rr(cx, x, y, w, h, 6); cx.fill();
  cx.strokeStyle = "rgba(0,0,0,.13)"; cx.lineWidth = 2;
  for (let yy = y + 9; yy < y + h - 4; yy += 10){ cx.beginPath(); cx.moveTo(x + 5, yy); cx.lineTo(x + w - 5, yy); cx.stroke(); }
  if (p.w){ cx.strokeStyle = "rgba(136,170,216,.55)"; cx.lineWidth = 2; rr(cx, x + 1, y + 1, w - 2, h - 2, 6); cx.stroke(); }
  if (p.m < 40){ cx.strokeStyle = "rgba(230,200,140,.5)"; cx.lineWidth = 1; cx.beginPath(); cx.moveTo(x + 10, y + h - 14); cx.lineTo(x + 18, y + h - 20); cx.lineTo(x + 24, y + h - 16); cx.moveTo(x + w - 12, y + 16); cx.lineTo(x + w - 20, y + 24); cx.stroke(); }
  if (!p.c) return;
  const C = CROPS[p.c], ripe = p.a >= C.days, small = p.a < C.days/2, key = small ? "mam" : p.c, s = small ? 24 : ripe ? 38 : 32;
  for (let q = 0; q < 4; q++) img(key, x + w*(q % 2 ? 0.72 : 0.28), y + h*(q < 2 ? 0.3 : 0.7) - (ripe ? Math.sin(t*2 + q)*1.2 : 0), s);
  if (ripe){ cx.strokeStyle = "#E3B53C"; cx.globalAlpha = 0.55 + 0.45*Math.sin(t*4); cx.lineWidth = 3; rr(cx, x - 1, y - 1, w + 2, h + 2, 7); cx.stroke(); cx.globalAlpha = 1; }
  else { cx.fillStyle = "rgba(0,0,0,.4)"; cx.fillRect(x + 8, y + h - 8, w - 16, 4); cx.fillStyle = "#E3B53C"; cx.fillRect(x + 8, y + h - 8, (w - 16)*p.a/C.days, 4); }
  if (!p.w && !ripe){ cx.fillStyle = "#B23A28"; rr(cx, x + 3, y + 3, 26, 13, 4); cx.fill(); cx.fillStyle = "#fff"; cx.font = "700 9px 'Be Vietnam Pro',sans-serif"; cx.textAlign = "center"; cx.textBaseline = "middle"; cx.fillText("Khô", x + 16, y + 10); }
}
function drawWater(t, x0, y0, x1, y1){
  cx.strokeStyle = "rgba(255,255,255,.3)"; cx.lineWidth = 1.5;
  for (let y = y0; y < y1; y += 18) for (let x = x0 - 40 + ((y*7) % 40); x < x1; x += 46){
    const ox = x + Math.sin(t*0.8 + y)*8;
    cx.beginPath(); cx.moveTo(ox, y); cx.quadraticCurveTo(ox + 6, y - 3, ox + 12, y); cx.stroke();
  }
}
function drawGuong(t){
  const x = 15*T, y = 2.4*T, r = 30;
  cx.fillStyle = "#6E4823"; cx.fillRect(x - 3, y, 6, 4.6*T); cx.fillRect(x + 10, y + 10, 5, 3.6*T);
  cx.fillStyle = "#8B6A45"; cx.fillRect(x - 10, 3.6*T, 20, 3.4*T); cx.fillStyle = "#5E86B8"; cx.fillRect(x - 6, 3.6*T, 12, 3.4*T);
  cx.save(); cx.translate(x, y); cx.rotate(t*0.9);
  cx.strokeStyle = "#D4A86A"; cx.lineWidth = 4; cx.beginPath(); cx.arc(0, 0, r, 0, 7); cx.stroke();
  cx.strokeStyle = "#A97E4B"; cx.lineWidth = 2.5;
  for (let k = 0; k < 8; k++){ const a = k*Math.PI/4; cx.beginPath(); cx.moveTo(0, 0); cx.lineTo(Math.cos(a)*r, Math.sin(a)*r); cx.stroke(); cx.fillStyle = "#5E86B8"; cx.fillRect(Math.cos(a)*r - 4, Math.sin(a)*r - 4, 8, 8); }
  cx.fillStyle = "#6E4823"; cx.beginPath(); cx.arc(0, 0, 5, 0, 7); cx.fill();
  cx.restore();
}
function labelAt(text, sx, sy, strong){
  cx.font = (strong ? "700 13px " : "600 12px ") + "'Be Vietnam Pro',sans-serif"; cx.textAlign = "center"; cx.textBaseline = "middle";
  const w = cx.measureText(text).width + 14;
  cx.fillStyle = strong ? "rgba(178,58,40,.92)" : "rgba(33,38,26,.72)"; rr(cx, sx - w/2, sy - 10, w, 20, 10); cx.fill();
  cx.fillStyle = "#fff"; cx.fillText(text, sx, sy + 0.5);
}
const EXTRA_LABELS = [["Ruộng nhà mình", 14, 6.6], ["Sông Cái", 30, 1.5], ["Ao sen", 32.5, 28.6], ["Đường làng", 8, 24]];
function draw(t){
  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.fillStyle = "#5E7F3E"; cx.fillRect(0, 0, cv.width, cv.height);
  const vw = W/zoom, vh = H/zoom, ww = MW*T, wh = MH*T;
  camX = ww <= vw ? (ww - vw)/2 : Math.max(0, Math.min(ww - vw, P.x - vw/2));
  camY = wh <= vh ? (wh - vh)/2 : Math.max(0, Math.min(wh - vh, P.y - 18 - vh/2));
  const k = dpr*zoom;
  cx.setTransform(k, 0, 0, k, -camX*k, -camY*k);
  ensureBg();
  const sx = Math.max(0, camX), sy = Math.max(0, camY), sw = Math.min(ww - sx, vw), sh = Math.min(wh - sy, vh);
  cx.drawImage(bg, sx*BGS, sy*BGS, sw*BGS, sh*BGS, sx, sy, sw, sh);
  if (camY < 3*T) drawWater(t, camX, 8, camX + vw, Math.min(2.6*T, camY + vh));
  if (camY + vh > 29*T && camX + vw > 29*T && camX < 36*T) drawWater(t, 29*T + 8, 29*T + 10, 36*T - 8, 36*T - 4);
  if (S.up.guong) drawGuong(t);
  for (let i = 0; i < 16; i++) drawPlot(i, t);
  if (focus && focus.plot !== undefined){ const [x, y, w, h] = focus.r; cx.setLineDash([6, 4]); cx.strokeStyle = "#fff"; cx.lineWidth = 2; rr(cx, x - 3, y - 3, w + 6, h + 6, 8); cx.stroke(); cx.setLineDash([]); }
  if (tapMark){ const a = (performance.now() - tapMark.t)/500; if (a > 1) tapMark = null; else { cx.strokeStyle = `rgba(255,255,255,${1 - a})`; cx.lineWidth = 2; cx.beginPath(); cx.ellipse(tapMark.x, tapMark.y, 6 + a*14, 3 + a*7, 0, 0, 7); cx.stroke(); } }
  if (route && route.pts.length){ const e = route.pts[route.pts.length - 1]; cx.fillStyle = "rgba(255,255,255,.7)"; cx.beginPath(); cx.ellipse(e[0], e[1], 5, 2.5, 0, 0, 7); cx.fill(); }
  const sp = [];
  const AS = {ga:24, lon:34, trau:44};
  herd.forEach((h, i) => { const a = S.animals[i]; if (!a) return; sp.push([h.y, () => {
    const s = AS[a.t]; cx.fillStyle = "rgba(0,0,0,.18)"; cx.beginPath(); cx.ellipse(h.x, h.y, s*0.36, s*0.12, 0, 0, 7); cx.fill();
    img(a.t, h.x, h.y - s*0.42 - (h.mv ? Math.abs(Math.sin(t*10))*1.5 : 0), s, h.fl);
    if (a.h > 0){ cx.fillStyle = "#B23A28"; cx.beginPath(); cx.arc(h.x, h.y - s - 4, 6, 0, 7); cx.fill(); cx.fillStyle = "#fff"; cx.font = "700 9px sans-serif"; cx.textAlign = "center"; cx.textBaseline = "middle"; cx.fillText("!", h.x, h.y - s - 3.5); }
  }]); });
  if (S.up.cho) sp.push([DOG.y, () => { cx.fillStyle = "rgba(0,0,0,.18)"; cx.beginPath(); cx.ellipse(DOG.x, DOG.y, 9, 3, 0, 0, 7); cx.fill(); img("cho", DOG.x, DOG.y - 11 - (DOG.mv ? Math.abs(Math.sin(t*14))*2 : 0), 26, DOG.fl); }]);
  NPCS.forEach(n => sp.push([n.y, () => person(n.x, n.y, n.dir, n.ph, n.mv, n.look)]));
  sp.push([P.y, () => person(P.x, P.y, P.dir, P.ph, P.mv, LOOK_ME)]);
  sp.sort((a, b) => a[0] - b[0]).forEach(s => s[1]());
  /* Lớp màu theo trời: chiều tối dần khi hết sức, mùa Đông se lạnh, nắng hạn vàng gắt */
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const se = seasonOf(S.day);
  if (se === 3){ cx.fillStyle = "rgba(120,150,200,.10)"; cx.fillRect(0, 0, W, H); }
  if (S.ev && S.ev.id === "han"){ cx.fillStyle = "rgba(255,170,60,.12)"; cx.fillRect(0, 0, W, H); }
  const dusk = (1 - S.suc/MAXS)*0.24; if (dusk > 0.01){ cx.fillStyle = `rgba(80,40,100,${dusk})`; cx.fillRect(0, 0, W, H); }
  if (S.ev && S.ev.id === "mua"){
    cx.strokeStyle = "rgba(210,225,255,.5)"; cx.lineWidth = 1.2; cx.beginPath();
    for (let i = 0; i < 90; i++){ const rx = ((i*97.3 + t*60) % (W + 40)) - 20, ry = ((i*53.1 + t*520) % (H + 40)) - 20; cx.moveTo(rx, ry); cx.lineTo(rx - 4, ry + 12); }
    cx.stroke();
  }
  /* Tên các nơi */
  const toS = (wx, wy) => [(wx - camX)*zoom, (wy - camY)*zoom];
  for (const key in PLACES){ const p = PLACES[key]; if (key === "gieng") continue; const [lx, ly] = toS((p.x + p.w/2)*T, p.y*T - (key === "chua" ? 26 : 6)); if (lx > -80 && lx < W + 80 && ly > -20 && ly < H + 20) labelAt(p.n, lx, ly); }
  for (const [n, x, y] of EXTRA_LABELS){ const [lx, ly] = toS(x*T, y*T); if (lx > -80 && lx < W + 80 && ly > -20 && ly < H + 20) labelAt(n, lx, ly); }
  if (focus && modal.hidden){ const [bx, by] = toS(P.x, P.y - 52); labelAt((coarse ? "" : "E · ") + focus.lab, bx, by, true); }
}

let lastT = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - lastT)/1000); lastT = now;
  if (S && W > 0 && !document.hidden){ try { update(dt); draw(now/1000); } catch(e){ console.error(e); } }
  requestAnimationFrame(frame);
}

/* ---------- Bản đồ toàn làng ---------- */
function showMap(){
  if (!S) return;
  ensureBg();
  const keys = Object.keys(PLACES);
  openModal(`<h2>Bản đồ làng</h2><p class="note">Chạm vào bản đồ hoặc tên một nơi, nhân vật sẽ tự đi tới đó. Chấm đỏ là anh đang đứng.</p>
   <canvas id="mapcv" class="mapcv" width="${MW*12}" height="${MH*12}" data-act="mapgo" aria-label="Bản đồ toàn làng"></canvas>
   <div class="places">${keys.map(k => `<button class="btn s" data-act="goto" data-place="${k}">${PLACES[k].n}</button>`).join("")}</div>
   <div class="acts"><button class="btn p" data-act="close">Đóng</button></div>`);
  sheet.classList.add("wide");
  const mc = document.getElementById("mapcv"), g = mc.getContext("2d"), s = 12/T;
  g.drawImage(bg, 0, 0, mc.width, mc.height);
  g.font = "600 13px 'Be Vietnam Pro',sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  for (const k of keys){ const p = PLACES[k], x = (p.x + p.w/2)*T*s, y = (p.y + p.h/2)*T*s, w = g.measureText(p.n).width + 12; g.fillStyle = "rgba(33,38,26,.78)"; rr(g, x - w/2, y - 10, w, 20, 10); g.fill(); g.fillStyle = "#fff"; g.fillText(p.n, x, y + 0.5); }
  for (let i = 0; i < 16; i++){ const [x, y, w, h] = plotRect(i), p = S.plots[i]; g.fillStyle = !p ? "rgba(60,80,30,.35)" : p.c && p.a >= CROPS[p.c].days ? "#E3B53C" : p.c ? "#5E8A35" : "#8B6A45"; g.fillRect(x*s, y*s, w*s, h*s); }
  g.fillStyle = "#B23A28"; g.strokeStyle = "#fff"; g.lineWidth = 3; g.beginPath(); g.arc(P.x*s, P.y*s, 8, 0, 7); g.stroke(); g.fill();
}

/* ===== Sự kiện chạm, bấm ===== */
document.addEventListener("click", e => {
  if (e.target === modal && !modalLock){ closeModal(); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const d = el.dataset;
  switch (d.act){
    case "do": doAct(); break;
    case "nv": openPanel("nv"); break;
    case "tui": openPanel("tui"); break;
    case "claim": claimQuest(d.id); break;
    case "track": S.qt = d.id; save(); render(); toast("Đã ghim nhiệm vụ ở góc bản đồ."); break;
    case "hold": holdSeed(d.c); break;
    case "eat": eatGood(d.g); break;
    case "map": showMap(); break;
    case "goto": closeModal(); goPlace(d.place); break;
    case "mapgo": { const r = el.getBoundingClientRect(); const wx = (e.clientX - r.left)/r.width*MW*T, wy = (e.clientY - r.top)/r.height*MH*T; closeModal(); goWorld(wx, wy); break; }
    case "news": newsOpen = !newsOpen; render(); break;
    case "plot": tapPlot(+d.i); break;
    case "plant": plant(+d.i, d.c); break;
    case "early": harvest(+d.i, false, true); break;
    case "order": fillOrder(+d.i); break;
    case "waterall": waterAll(); break;
    case "harvestall": harvestAll(); break;
    case "sleep": doSleep(); break;
    case "sell": sellGood(d.g, false); break;
    case "sellall": sellGood(d.g, true); break;
    case "buyseed": buySeed(d.c, +d.n); break;
    case "buyrom": buyRom(+d.n); break;
    case "buyanimal": buyAnimal(d.t); break;
    case "sellanimal": sellAnimal(+d.i); break;
    case "upg": buyUpg(d.id); break;
    case "buyplot": closeModal(); buyPlot(); break;
    case "help": showHelp(); break;
    case "credits": showCredits(); break;
    case "amthanh": showSound(); break;
    case "snd": if (d.k === "nhac") RLA.music.set(el.checked); else RLA.setSfx(el.checked); render(); break;
    case "closehelp": S.seenHelp = S.seenHelp4 = S.seenHelp5 = true; save(); closeModal(); break;
    case "close": closeModal(); break;
    case "reset": showReset(); break;
    case "doreset": S = fresh(); genOrders(); P.x = HOME[0]; P.y = HOME[1]; route = null; herd = []; save(); closeModal(); render(); showHelp(); break;
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !modal.hidden) closeModal(); });

function start(data){
  S = (data && data.S && data.S.v === 2 && data.S) || load() || fresh();
  if (!S.orders.length && S.day === 1) genOrders();
  if (Array.isArray(S.pos) && !hitBox(S.pos[0], S.pos[1])){ P.x = S.pos[0]; P.y = S.pos[1]; }
  hintEl.textContent = coarse
    ? "Kéo ngón tay trên bản đồ để đi (như cần điều khiển), hoặc chạm vào chỗ muốn đến. Tới gần rồi bấm nút Làm."
    : "Đi: phím W A S D hoặc mũi tên, hoặc bấm chuột vào chỗ muốn đến. Làm việc: phím E hoặc Space. Bản đồ: M · Nhiệm vụ: Q · Túi đồ: I.";
  hintEl.classList.toggle("coarse", coarse);
  ensureQuests();
  joyRest();
  render();
  if (!S.seenHelp5) showHelp();
  requestAnimationFrame(frame);
}
try { window.claude?.hot?.snapshot?.(() => ({S})); } catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruộng Làng Đại Việt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Bố cục bản 4: thanh trạng thái trên cùng, phần còn lại là bản đồ làng cuộn theo nhân vật.
   Nút Làm ở góc phải dưới, cần điều khiển hiện ra chỗ ngón tay chạm. Sáng: giấy mạ xanh nhạt, son đỏ, vàng hoè, chàm. Tối: nền sơn mài. */
:root{
  --bg:#E4E9D3; --bg2:#D5DCBC; --card:#F4F6EA; --ink:#21261A; --muted:#5B644C; --line:rgba(33,38,26,.16);
  --son:#B23A28; --onson:#FFFFFF; --hoe:#B88208; --cham:#2C4A6E; --la:#4A7A2C;
  --ripe:#E3B53C; --good:#3F7A2A; --bad:#B23A28;
  --fd:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif; --fb:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13180F; --bg2:#1B2216; --card:#1E2619; --ink:#E7EBD8; --muted:#A2AC8C; --line:rgba(231,235,216,.14);
  --son:#E0694F; --onson:#1A0E09; --hoe:#E4B446; --cham:#88AAD8; --la:#8FC167;
  --ripe:#C99A2B; --good:#8FC167; --bad:#E0694F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13180F; --bg2:#1B2216; --card:#1E2619; --ink:#E7EBD8; --muted:#A2AC8C; --line:rgba(231,235,216,.14);
  --son:#E0694F; --onson:#1A0E09; --hoe:#E4B446; --cham:#88AAD8; --la:#8FC167;
  --ripe:#C99A2B; --good:#8FC167; --bad:#E0694F; color-scheme:dark}
[hidden]{display:none!important}
.art{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.2em;flex:none}
.row .e .art,.seedpick .e .art{width:1.4em;height:1.4em}
.iconbtn.off{opacity:.55;text-decoration:line-through}
.sound{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.sound label{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.sound input{width:22px;height:22px;accent-color:var(--son)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.5;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--cham);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);line-height:1.15;text-wrap:balance;margin:0}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Thanh trên */
.top{flex:none;z-index:20;background:var(--bg2);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1180px;margin:0 auto;padding-block:8px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.brand b{font-family:var(--fd);font-size:1.35rem;font-weight:800;color:var(--son);line-height:1}
.brand span{font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.stat{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.season{font-family:var(--fd);font-weight:700;padding:1px 10px;border-radius:99px;color:var(--onson);background:var(--la)}
.season.s1{background:var(--hoe)}.season.s2{background:var(--son)}.season.s3{background:var(--cham)}
.coin{width:18px;height:18px;border-radius:50%;background:var(--hoe);position:relative;flex:none;box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}
.coin::after{content:"";position:absolute;inset:6px;background:var(--bg2);border-radius:1px}
.money b{font-family:var(--fd);font-size:1.15rem}
.bar{width:64px;height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--la);border-radius:9px;transition:width .25s}
.bar.low i{background:var(--son)}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:4px 10px;font-size:.85rem}
.sleep{background:var(--cham);color:var(--bg);border:0;border-radius:12px;padding:7px 14px;font-family:var(--fd);font-weight:700;font-size:1rem}
.btns{display:flex;gap:6px;align-items:center}

/* Bản đồ làng */
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#5E7F3E;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.news{position:absolute;top:10px;left:0;right:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-height:44%;pointer-events:none}
.news>*{pointer-events:auto}
.newsbtn{border:0;border-radius:99px;padding:3px 12px;font-size:.8rem;font-weight:600;background:var(--ink);color:var(--bg);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.news .items{display:flex;flex-direction:column;gap:6px;max-width:min(560px,100%);overflow:auto;min-height:0}
.news .items>div{background:var(--card);border-left:4px solid var(--cham);padding:6px 10px;border-radius:10px;font-size:.84rem;line-height:1.4;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.news .items>.bad{border-left-color:var(--bad)}.news .items>.good{border-left-color:var(--good)}
.actbtn{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));min-width:104px;max-width:min(230px,48vw);min-height:68px;border-radius:999px;border:3px solid rgba(255,255,255,.75);background:var(--son);color:var(--onson);box-shadow:0 4px 16px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:6px 18px;text-align:center;touch-action:manipulation}
.actbtn b{font-family:var(--fd);font-size:1.3rem;line-height:1}
.actbtn small{font-size:.74rem;font-weight:600}
.actbtn.idle{opacity:.6}
.actbtn:active{transform:scale(.95)}
.fabs{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 82px);display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.fab{position:relative;display:flex;align-items:center;gap:6px;border:2px solid rgba(255,255,255,.75);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px 6px 8px;font-weight:600;font-size:.86rem;box-shadow:0 3px 12px rgba(0,0,0,.3);touch-action:manipulation}
.fab .art{width:1.6em;height:1.6em}
.badge{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--son);color:var(--onson);font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;animation:nhay 1.2s ease-in-out infinite}
@keyframes nhay{50%{transform:scale(1.18)}}
.tracker{display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;width:min(300px,100%);border:0;border-left:4px solid var(--hoe);background:var(--card);border-radius:10px;padding:7px 11px;box-shadow:0 2px 10px rgba(0,0,0,.22);font-size:.84rem;line-height:1.3}
.tracker .tl{font-size:.72rem;font-weight:700;color:var(--hoe);text-transform:uppercase;letter-spacing:.04em}
.qbar{display:block;height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:4px 0 2px}
.qbar i{display:block;height:100%;background:var(--hoe);border-radius:6px}
.qrow{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;margin-top:8px;background:var(--bg)}
.qrow.ready{border-color:var(--hoe);box-shadow:0 0 0 2px var(--hoe) inset}
.qrow.claimed{opacity:.65}
.qrow .qic .art{width:2rem;height:2rem}
.qrow .qt b{display:block}.qrow .qt small{display:block;color:var(--muted);line-height:1.35}
.qrow .qa{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
details summary{cursor:pointer;font-family:var(--fd);font-weight:700;font-size:1.05rem}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:6px}
.slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px 8px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);text-align:center;font:inherit;color:inherit}
.slot:disabled{opacity:.4}
.slot.sel{border-color:var(--son);box-shadow:0 0 0 2px var(--son) inset}
.slot .si .art{width:2.2rem;height:2.2rem}
.slot .sn{font-size:.8rem;font-weight:600;line-height:1.2}
.slot .sc{position:absolute;top:4px;right:7px;font-family:var(--fd);font-weight:700}
@media (max-width:640px){.qrow{grid-template-columns:2rem minmax(0,1fr)}.qrow .qa{grid-column:2;flex-direction:row;justify-content:flex-start;flex-wrap:wrap}}
.joy{position:absolute;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.55);pointer-events:none}
.joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.joy.ghost{opacity:.55}
.hint{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));max-width:min(420px,calc(100% - 150px));background:rgba(20,24,16,.78);color:#fff;font-size:.8rem;line-height:1.4;padding:7px 11px;border-radius:10px;pointer-events:none;transition:opacity .8s}
.hint.coarse{bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 140px)}
.hint.gone{opacity:0}

/* Danh sách / bảng trong các nhà */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.btn{border:1.5px solid var(--ink);background:var(--card);border-radius:10px;padding:6px 12px;font-weight:600;font-size:.9rem;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.p{background:var(--son);border-color:var(--son);color:var(--onson)}
.btn.s{padding:3px 9px;font-size:.82rem}
.guide{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:.8rem;padding:2px 10px;border-radius:99px;border:1px solid var(--line);background:var(--bg)}
.chip.off{opacity:.45;text-decoration:line-through}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.box h3{font-size:1.15rem;margin-bottom:8px}
.sub{color:var(--muted);font-size:.88rem;margin:0 0 12px}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .e{font-size:1.5rem;text-align:center}
.row .t b{display:block}
.row .t small{color:var(--muted);display:block;line-height:1.35}
.row .a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--good)}.down{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.sec{margin-top:18px}
.sec h3{font-size:1.05rem;margin-bottom:4px}
.note{font-size:.85rem;color:var(--muted)}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:0 8px;border-radius:99px;background:var(--bg2);color:var(--ink);margin-left:6px;vertical-align:1px}
.pill.bad{background:var(--son);color:var(--onson)}.pill.good{background:var(--la);color:var(--onson)}
.goal{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:.9rem}
.goal i{flex:none;width:16px;height:16px;border-radius:4px;border:2px solid var(--muted);margin-top:3px}
.goal.done{color:var(--muted)}.goal.done i{background:var(--la);border-color:var(--la)}
.goal small{color:var(--muted)}
.log{list-style:none;margin:0;padding:0;font-size:.84rem;max-height:300px;overflow:auto}
.log li{padding:4px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px}
.log li span{color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.log .bad{color:var(--bad)}
.mobile-only{display:block}

/* Hộp thoại */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,12,8,.5);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.modal{align-items:center}}
.sheet{background:var(--card);color:var(--ink);border-radius:18px;padding:20px;width:min(520px,100%);max-height:86vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.sheet.wide{width:min(800px,100%)}
.sheet h2{font-size:1.45rem;margin-bottom:6px;color:var(--son)}
.sheet ol,.sheet ul{padding-left:1.2rem;margin:8px 0}
.sheet li{margin:4px 0}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.shead{position:sticky;top:-20px;display:flex;justify-content:flex-end;margin:-10px -10px -24px 0;z-index:2;pointer-events:none}
.shead button{pointer-events:auto;background:var(--card)}
.notes{list-style:none;padding:0}
.notes li{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.notes li::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--cham)}
.notes li.bad::before{background:var(--bad)}.notes li.good::before{background:var(--good)}.notes li.tax::before{background:var(--hoe)}
.seedpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.seedpick button{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;text-align:left;display:flex;gap:10px;align-items:center}
.seedpick button:disabled{opacity:.45}
.seedpick .e{font-size:1.7rem}
.seedpick small{display:block;color:var(--muted);line-height:1.3}
.mapcv{width:100%;height:auto;border-radius:10px;display:block;margin:8px 0 10px;cursor:pointer;border:1px solid var(--line)}
.places{display:flex;flex-wrap:wrap;gap:6px}
.keys{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:.88rem;margin:8px 0;padding:10px 12px;border-radius:10px;background:var(--bg)}
.keys b{white-space:nowrap}

.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(420px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:.9rem;font-weight:500;animation:tin .2s ease-out;text-align:center}
.toast.warn{background:var(--son);color:var(--onson)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

@media (max-width:640px){
  .grid2{grid-template-columns:minmax(0,1fr)}
  .seedpick{grid-template-columns:minmax(0,1fr)}
  .brand span{display:none}
  .brand b{font-size:1.15rem}
  .top-in{gap:4px 10px;padding-block:6px}
  .sleep{padding:5px 10px;font-size:.92rem}
  .iconbtn{padding:3px 8px}
  .bar{width:48px}
  .toasts{bottom:calc(160px + env(safe-area-inset-bottom,0px))}
}
/* Bản 6: đồng hồ, chuyển vùng, trái tim tình cảm, hộp thoại trò chuyện */
.clockw b{font-family:var(--fd);font-size:1.02rem;min-width:5.4em}
.sun{width:14px;height:14px;border-radius:50%;background:var(--hoe);box-shadow:0 0 0 3px rgba(227,181,60,.3);flex:none}
.sun.dem{background:transparent;box-shadow:inset -4px -1px 0 0 #B9B4DE}
.fade{position:absolute;inset:0;background:#0B0E08;opacity:0;pointer-events:none;transition:opacity .26s}
.fade.on{opacity:1}
.banner{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);background:rgba(20,24,16,.82);color:#fff;font-family:var(--fd);font-size:1.5rem;font-weight:800;line-height:1.2;padding:10px 26px;border-radius:14px;opacity:0;transition:opacity .5s;pointer-events:none;text-align:center;max-width:calc(100% - 32px)}
.banner small{display:block;font-family:var(--fb);font-size:.8rem;font-weight:500;opacity:.85}
.banner.on{opacity:1}
.hearts{display:flex;flex-wrap:wrap;gap:2px;margin:3px 0}
.hearts svg{width:15px;height:15px;flex:none}
.hearts path{fill:none;stroke:currentColor;stroke-opacity:.35;stroke-width:1.3}
.hearts path.on{fill:#D0384A;stroke:#A82638;stroke-opacity:1}
.talk{display:flex;gap:14px;align-items:center}
.talk .tk{min-width:0}
.talk h2{margin-bottom:2px}
canvas.pt{width:48px;height:48px;border-radius:50%;flex:none;display:block}
canvas.pt.big{width:72px;height:72px;box-shadow:0 0 0 3px var(--line)}
.row.rel{grid-template-columns:48px minmax(0,1fr) auto}
.row.rel>.e{display:flex;justify-content:center}
.row.rel>.e .art{width:2.6rem;height:2.6rem}
.say{background:var(--bg);border-radius:12px;padding:12px 14px;margin:14px 0 4px;font-size:1rem;line-height:1.5;border-left:4px solid var(--hoe)}
.sheet .acts.talkacts{justify-content:flex-start}
.qrow.locked{opacity:.55}
.qrow.locked .qic{filter:grayscale(1)}
.mapgrps{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mapgrp{flex:1 1 200px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--bg)}
.mapgrp.here{border-color:var(--son);box-shadow:0 0 0 1px var(--son) inset}
.mapgrp>b{display:block;margin-bottom:6px;font-size:.88rem}
.maparrow{color:var(--muted);font-size:1.2rem}
.hint.coarse{max-width:calc(100% - 200px)}
@media (max-width:640px){.clockw b{min-width:0}.banner{font-size:1.25rem}.maparrow{display:none}}
/* Bản 7: đồ nghề, tiếng xấu, cân điêu */
.tools{position:absolute;top:10px;right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px}
.tool{position:relative;width:46px;height:46px;border-radius:12px;border:2px solid rgba(255,255,255,.75);background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;padding:0;touch-action:manipulation}
.tool .art{width:32px;height:32px}
.tool.sel{border-color:var(--son);box-shadow:0 0 0 2px var(--son),0 2px 8px rgba(0,0,0,.28)}
.tool .tk{position:absolute;bottom:-5px;right:-6px;font-size:.64rem;line-height:1.3;background:var(--ink);color:var(--bg);border-radius:6px;padding:0 4px;font-weight:700;font-variant-numeric:tabular-nums}
.tool .kn{position:absolute;top:0;left:4px;font-size:.62rem;font-weight:700;color:var(--muted)}
.news{right:70px}
.bar.toi{display:block;width:100%;margin:6px 0}
.bar.toi i{background:var(--son)}
.gian{display:flex;gap:8px;align-items:flex-start;margin:4px 0 10px;padding:8px 10px;border-radius:10px;background:var(--bg);font-size:.86rem}
.gian input{margin-top:3px;accent-color:var(--son)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top"><div class="top-in gut" id="hdr"></div></header>
<main id="stage">
  <canvas id="world" role="img" aria-label="Thế giới Đại Việt ba vùng: xóm Bãi có nhà và ruộng của anh, làng Dâu, phủ Thiên Đức. Nhân vật đội nón lá, đeo gùi là anh."></canvas>
  <div class="fade" id="fade"></div>
  <div class="banner" id="banner"></div>
  <div class="news gut" id="news" aria-live="polite"></div>
  <div class="hint" id="hint"></div>
  <div class="joy" id="joy" hidden><i></i></div>
  <div class="tools" id="tools"></div>
  <div class="fabs" id="fabs"></div>
  <button class="actbtn idle" id="actbtn" data-act="do"><b>Làm</b><small>Đến gần chỗ cần làm</small></button>
</main>
<div class="modal" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>

/* ---------- Âm thanh ---------- */
const PKEY = "ruonglang-amthanh";
let pref = {nhac:true, tiengdong:true};
try { const r = JSON.parse(localStorage.getItem(PKEY) || "null"); if (r) pref = {...pref, ...r}; } catch(e){}
function savePref(){ try { localStorage.setItem(PKEY, JSON.stringify(pref)); } catch(e){} }

let ac = null, master = null, musBus = null, sfxBus = null, verb = null, noiseBuf = null;
function ctx(){
  if (ac) return ac;
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
  try { ac = new AC(); } catch(e){ return null; }
  master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
  musBus = ac.createGain(); musBus.gain.value = pref.nhac ? 0.32 : 0; musBus.connect(master);
  sfxBus = ac.createGain(); sfxBus.gain.value = 0.55; sfxBus.connect(master);
  /* Vang nhẹ như đồng không mông quạnh: tiếng vọng ngắn tạo từ nhiễu tắt dần */
  verb = ac.createConvolver();
  const len = ac.sampleRate * 1.8, ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++){ const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 3.2); }
  verb.buffer = ir;
  const vg = ac.createGain(); vg.gain.value = 0.28; verb.connect(vg); vg.connect(master);
  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random()*2-1;
  return ac;
}
function out(node, bus, wet){ node.connect(bus); if (wet){ const s = ac.createGain(); s.gain.value = wet; node.connect(s); s.connect(verb); } }
const hz = m => 440 * Math.pow(2, (m - 69) / 12);

/* Nhạc cụ */
function danBau(t, m, dur, vel, bend){
  /* Đàn bầu: một dây, tiếng tròn, nhấn luyến lên xuống và rung ở đuôi nốt */
  const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  const lfo = ac.createOscillator(), lg = ac.createGain();
  o.type = "triangle"; o2.type = "sine"; f.type = "lowpass"; f.frequency.value = 2200;
  const fr = hz(m);
  o.frequency.setValueAtTime(bend ? hz(m + bend) : fr, t); o2.frequency.setValueAtTime(fr*2, t);
  if (bend){ o.frequency.exponentialRampToValueAtTime(fr, t + 0.16); }
  lfo.frequency.value = 5.2; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(fr*0.012, t + Math.min(dur*0.6, 0.5));
  lfo.connect(lg); lg.connect(o.frequency);
  const g2 = ac.createGain(); g2.gain.value = 0.18; o2.connect(g2); g2.connect(f);
  o.connect(f); f.connect(g);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vel, t + 0.02);
  g.gain.exponentialRampToValueAtTime(vel*0.45, t + 0.25); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.35);
  out(g, musBus, 0.5);
  [o, o2, lfo].forEach(x => { x.start(t); x.stop(t + dur + 0.4); });
}
function sao(t, m, dur, vel){
  /* Sáo trúc: âm thổi, có hơi gió */
  const o = ac.createOscillator(), g = ac.createGain(); o.type = "sine"; o.frequency.value = hz(m);
  const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 4.6; lg.gain.value = hz(m)*0.006; lfo.connect(lg); lg.connect(o.frequency);
  const n = ac.createBufferSource(), nf = ac.createBiquadFilter(), ng = ac.createGain();
  n.buffer = noiseBuf; nf.type = "bandpass"; nf.frequency.value = hz(m)*2; nf.Q.value = 6; ng.gain.value = vel*0.5;
  n.connect(nf); nf.connect(ng); ng.connect(g); o.connect(g);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vel, t + 0.08); g.gain.setValueAtTime(vel*0.85, t + dur*0.8); g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.12);
  out(g, musBus, 0.6);
  [o, lfo, n].forEach(x => { x.start(t); x.stop(t + dur + 0.2); });
}
function tranh(t, m, vel){
  /* Đàn tranh: gảy dây, tắt nhanh */
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  o.type = "sawtooth"; o.frequency.value = hz(m); f.type = "lowpass";
  f.frequency.setValueAtTime(3200, t); f.frequency.exponentialRampToValueAtTime(500, t + 0.6);
  o.connect(f); f.connect(g);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vel, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
  out(g, musBus, 0.45); o.start(t); o.stop(t + 1.3);
}
function mo(t, vel, bus){
  /* Mõ gỗ */
  const o = ac.createOscillator(), g = ac.createGain(); o.type = "sine";
  o.frequency.setValueAtTime(1150, t); o.frequency.exponentialRampToValueAtTime(820, t + 0.05);
  g.gain.setValueAtTime(vel, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
  o.connect(g); out(g, bus || musBus, 0.2); o.start(t); o.stop(t + 0.1);
}
function trong(t, vel){
  /* Trống cơm: tiếng bịch trầm */
  const o = ac.createOscillator(), g = ac.createGain(); o.type = "sine";
  o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.18);
  g.gain.setValueAtTime(vel, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
  o.connect(g); out(g, musBus, 0.15); o.start(t); o.stop(t + 0.32);
}
function cong(t, vel, bus, m){
  /* Cồng đồng: các họa âm lệch nhau, ngân dài */
  const base = hz(m || 45), parts = [1, 1.52, 2.03, 2.74, 3.4];
  parts.forEach((p, i) => {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = "sine"; o.frequency.value = base*p;
    const v = vel / (i + 1.3);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6 - i*0.35);
    o.connect(g); out(g, bus || musBus, 0.5); o.start(t); o.stop(t + 2.7);
  });
}
function noise(t, dur, vel, type, f0, f1, q, bus){
  const n = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  n.buffer = noiseBuf; f.type = type; f.Q.value = q || 1;
  f.frequency.setValueAtTime(f0, t); if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vel, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  n.connect(f); f.connect(g); out(g, bus || sfxBus, 0.15); n.start(t); n.stop(t + dur + 0.02);
}
function pluck(t, m, vel, bus, dur){
  const o = ac.createOscillator(), g = ac.createGain(); o.type = "triangle"; o.frequency.value = hz(m);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vel, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.4));
  o.connect(g); out(g, bus || sfxBus, 0.3); o.start(t); o.stop(t + (dur || 0.4) + 0.05);
}

/* ---------- Bài nhạc theo mùa (ngũ cung) ----------
   Mỗi mùa một điệu, ghi bằng bậc trong thang 5 âm: 0..4 là năm âm của một quãng tám, 5..9 là quãng tám trên, -1..-5 quãng dưới.
   Mỗi nốt: [bậc, số phách, nhấn luyến]. null là nghỉ. */
const SCALES = {
  bac:[0,2,5,7,9],   /* Hơi Bắc (Hò Xự Xang Xê Cống): sáng, vui */
  nam:[0,3,5,7,10],  /* Hơi Nam (gần thang ngũ cung thứ): man mác, buồn nhẹ */
  xuan:[0,2,4,7,9]   /* Ngũ cung trưởng: trong trẻo */
};
const SONGS = [
  { n:"Xuân · Ra đồng", key:62, sc:"xuan", bpm:88, lead:"sao", mel:[
    [5,1],[7,1],[6,.5],[5,.5],[4,1],  [3,1],[4,.5],[5,.5],[2,2],
    [3,1],[4,1],[5,1],[7,1],          [6,1.5],[5,.5],[4,2],
    [5,1],[4,.5],[3,.5],[2,1],[3,1],  [4,1],[2,1],[1,1],[0,1],
    [1,1],[2,.5],[3,.5],[4,1],[2,1],  [0,3],null ]},
  { n:"Hạ · Tát nước", key:60, sc:"bac", bpm:104, lead:"tranh", mel:[
    [5,.5],[5,.5],[7,1],[6,.5],[5,.5],[4,1],  [5,.5],[4,.5],[2,1],[3,2],
    [4,.5],[5,.5],[4,.5],[3,.5],[2,1],[0,1],  [1,1],[2,1],[3,2],
    [5,.5],[6,.5],[7,1],[9,1],[7,1],          [6,.5],[5,.5],[4,1],[5,2],
    [3,.5],[2,.5],[1,1],[2,1],[4,1],          [3,1],[1,1],[0,2] ]},
  { n:"Thu · Gặt hái", key:62, sc:"nam", bpm:76, lead:"danBau", mel:[
    [4,1.5,2],[3,.5],[2,1],[3,1],  [4,2,-2],[2,2],
    [0,1],[1,1],[2,1],[4,1,2],     [3,3],null,
    [5,1,2],[4,1],[3,1],[2,1],     [3,1.5],[2,.5],[1,2],
    [2,1],[1,1],[0,1,2],[-1,1],    [0,3,-2],null ]},
  { n:"Đông · Bên bếp lửa", key:57, sc:"bac", bpm:64, lead:"danBau", mel:[
    [2,2,2],[3,1],[4,1],  [5,3,-2],null,
    [4,1],[3,1],[2,1],[1,1],  [2,4,2],
    [0,2],[1,1],[2,1],    [4,2,2],[3,2],
    [2,1],[1,1],[0,1],[-1,1],  [0,4,-2] ]}
];
function deg(sc, d){ const s = SCALES[sc], o = Math.floor(d/5), i = ((d%5)+5)%5; return s[i] + 12*o; }

let mus = {on:false, song:0, idx:0, next:0, timer:null, bar:0};
function schedule(){
  if (!ac || !mus.on) return;
  const S = SONGS[mus.song], beat = 60 / S.bpm;
  while (mus.next < ac.currentTime + 0.25){
    const ev = S.mel[mus.idx];
    const t = mus.next;
    if (ev){
      const [d, b, bend] = ev, m = S.key + 12 + deg(S.sc, d), dur = b*beat;
      if (S.lead === "sao") sao(t, m, dur*0.92, 0.22);
      else if (S.lead === "tranh") tranh(t, m, 0.16);
      else danBau(t, m, dur*0.95, 0.26, bend);
      /* Đệm: đàn tranh rải ở phách mạnh, mõ giữ nhịp, trống cơm cuối câu */
      if (mus.beatPos % 2 < 0.01){
        tranh(t, S.key + deg(S.sc, (mus.bar % 4 === 3) ? 3 : 0), 0.07);
        tranh(t + beat*0.5, S.key + deg(S.sc, 2), 0.045);
      }
      if (mus.song !== 3) for (let k = 0; k < b; k += 1) mo(t + k*beat, mus.song === 1 ? 0.06 : 0.035);
      mus.beatPos += b;
      if (mus.beatPos >= 4){ mus.beatPos -= 4; mus.bar++; if (mus.bar % 4 === 0) trong(t + dur - beat*0.5, 0.18); }
      mus.next += dur;
    } else {
      mus.next += beat*2; mus.beatPos = 0;
    }
    mus.idx++;
    if (mus.idx >= S.mel.length){ mus.idx = 0; mus.beatPos = 0; mus.bar = 0; mus.next += beat*2; }
  }
}
function musStart(){
  if (!ctx() || mus.on) return;
  mus.on = true; mus.idx = 0; mus.beatPos = 0; mus.bar = 0; mus.next = ac.currentTime + 0.3;
  mus.timer = setInterval(schedule, 90); schedule();
}
function musStop(){ mus.on = false; clearInterval(mus.timer); mus.timer = null; }
function setSeason(se){
  se = Math.max(0, Math.min(3, se|0));
  if (se === mus.song) return;
  mus.song = se; mus.idx = 0; mus.beatPos = 0; mus.bar = 0;
  if (ac && mus.on) mus.next = ac.currentTime + 0.4;
}

/* ---------- Tiếng động ---------- */
const SFX = {
  tap(t){ mo(t, 0.12, sfxBus); },
  gieo(t){ noise(t, 0.12, 0.35, "lowpass", 600, 200, 1); pluck(t + 0.06, 74, 0.18); pluck(t + 0.14, 79, 0.14); },
  tuoi(t){ for (let i = 0; i < 6; i++){ const tt = t + i*0.045 + Math.random()*0.02; const o = ac.createOscillator(), g = ac.createGain(); o.type = "sine";
      const f = 900 + Math.random()*900; o.frequency.setValueAtTime(f, tt); o.frequency.exponentialRampToValueAtTime(f*1.8, tt + 0.05);
      g.gain.setValueAtTime(0.12, tt); g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.07); o.connect(g); out(g, sfxBus, 0.3); o.start(tt); o.stop(tt + 0.08); }
    noise(t, 0.35, 0.12, "bandpass", 3000, 1500, 0.8); },
  gat(t){ noise(t, 0.22, 0.35, "bandpass", 1800, 5000, 1.5); pluck(t + 0.12, 69, 0.2); pluck(t + 0.22, 74, 0.2); pluck(t + 0.32, 81, 0.16, sfxBus, 0.6); },
  ban(t){ [2637, 3520, 4186].forEach((f, i) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + i*0.07); g.gain.exponentialRampToValueAtTime(0.12, t + i*0.07 + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + i*0.07 + 0.35);
      o.connect(g); out(g, sfxBus, 0.3); o.start(t + i*0.07); o.stop(t + i*0.07 + 0.4); }); },
  mua(t){ pluck(t, 76, 0.16); pluck(t + 0.08, 72, 0.14); mo(t + 0.16, 0.1, sfxBus); },
  canhbao(t){ mo(t, 0.16, sfxBus); mo(t + 0.16, 0.13, sfxBus); pluck(t, 57, 0.12, sfxBus, 0.5); },
  ngu(t){ cong(t, 0.28, sfxBus, 45); },
  sang(t){ [0,2,4,7].forEach((d, i) => sao(t + i*0.16, 74 + d, 0.22, 0.12)); },
  thue(t){ cong(t, 0.2, sfxBus, 52); SFX.ban(t + 0.3); },
  sukien(t){ trong(t, 0.25); trong(t + 0.2, 0.2); },
  thang(t){ [0,2,4,7,9,12,14,16].forEach((d, i) => pluck(t + i*0.11, 67 + d, 0.18, sfxBus, 0.8)); cong(t + 0.95, 0.22, sfxBus, 55); },
  gasuc(t){ noise(t, 0.18, 0.18, "bandpass", 700, 400, 3); pluck(t + 0.05, 64, 0.12); }
};
function sfx(name){
  if (!pref.tiengdong) return;
  const c = ctx(); if (!c || !SFX[name]) return;
  if (c.state === "suspended") c.resume();
  try { SFX[name](c.currentTime + 0.01); } catch(e){}
}

/* Trình duyệt chỉ cho phát âm thanh sau lần chạm đầu tiên của người chơi */
function unlock(){
  const c = ctx(); if (!c) return;
  if (c.state === "suspended") c.resume();
  if (pref.nhac) musStart();
}
document.addEventListener("pointerdown", unlock, {once:true, capture:true});
document.addEventListener("keydown", unlock, {once:true, capture:true});
document.addEventListener("visibilitychange", () => { if (!ac) return; if (document.hidden) ac.suspend(); else ac.resume(); });

function setMusic(on){
  pref.nhac = !!on; savePref();
  const c = ctx(); if (!c) return;
  if (c.state === "suspended") c.resume();
  musBus.gain.setTargetAtTime(on ? 0.32 : 0, c.currentTime, 0.2);
  if (on) musStart(); else setTimeout(() => { if (!pref.nhac) musStop(); }, 800);
}
function setSfx(on){ pref.tiengdong = !!on; savePref(); if (on) sfx("tap"); }

return {
  art, G, sfx,
  music:{ season:setSeason, set:setMusic, get on(){ return pref.nhac; }, songs:SONGS.map(s => s.n) },
  setSfx, get sfxOn(){ return pref.tiengdong; }
};
})();

  {title:"Nhạc nền bốn mùa: Ra đồng, Tát nước, Gặt hái, Bên bếp lửa", author:"Claude soạn riêng cho game theo ý tưởng của anh Kiên", license:"Tác phẩm riêng của game, không dùng nhạc của tác giả khác", source:"Viết trên thang ngũ cung (hơi Bắc, hơi Nam), mô phỏng sáo trúc, đàn bầu, đàn tranh, mõ, trống cơm; phát trực tiếp bằng Web Audio trên máy người chơi"},
  {title:"Tiếng động: gieo, tưới, gặt, tiền đồng, cồng đêm, sáo sớm", author:"Claude tạo riêng cho game", license:"Tác phẩm riêng của game", source:"Tạo bằng Web Audio, không dùng tệp ghi âm"},
  {title:"Hình vẽ cây trồng, gia súc, nông sản, nhà cửa", author:"Claude vẽ riêng cho game", license:"Tác phẩm riêng của game", source:"Vẽ bằng SVG trong mã nguồn, không dùng hình của tác giả khác"}
];
/* Thay biểu tượng emoji bằng hình vẽ riêng */
for (const o of [CROPS, ANIMALS, GOODS]) for (const k in o){ const a = RLA.art(k); if (a) o[k].i = a; }

/* ===== Trạng thái ===== */
let S, tab = "ruong";
function fresh(){
  const pf = {}; for (const g in GOODS) pf[g] = 1;
  return {v:2, day:1, money:300, suc:MAXS, water:8, tool:"cuoc", toi:0,
    plots:Array.from({length:6}, () => ({c:null, a:0, w:false, m:70, t:false})),
    seeds:{lua:5, rau:6, lac:3}, goods:{rom:10, thoc:5},
    animals:[{t:"ga",h:0,f:0},{t:"ga",h:0,f:0}],
    up:{}, pf, pp:{...pf}, ev:null, warn:null, orders:[], tired:false, wet:false, log:[], goals:{}, seenHelp:false, won:false};
}
function load(){ try { const r = localStorage.getItem(KEY); if (r){ const o = JSON.parse(r); if (o && o.v === 2) return o; } } catch(e){} return null; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

const seasonOf = d => Math.floor((d-1)/SL) % 4;
const yearOf = d => Math.floor((d-1)/(SL*4)) + 1;
const dis = d => (d-1) % SL + 1;
const isPhien = d => dis(d) === 5 || dis(d) === 10;
/* Tô thuế: 1 thóc mỗi thửa. Mùa Đông năm đầu được miễn để người mới làm quen. */
const taxDue = () => S.plots.length;
const taxFree = d => seasonOf(d) === 3 && yearOf(d) === 1;
const clampM = m => Math.max(0, Math.min(100, m));
function yieldOf(p, early){
  const C = CROPS[p.c], got = {};
  for (const [g,n] of Object.entries(C.out)){
    if (p.c === "lua" && g === "rom"){ got[g] = n; continue; }
    let v = Math.max(1, Math.floor(n * (0.5 + p.m/100)));
    if (p.c === "lua" && g === "thoc" && fedTrau()) v += 1;
    if (early) v = Math.max(1, Math.floor(v/2));
    got[g] = v;
  }
  return got;
}
const ORDER_QTY = {thoc:[4,8], rau:[3,6], lac:[3,6], mia:[2,5], khoai:[3,6], trung:[4,9]};
const VILLAGERS = ["Bà lý Hương","Nhà sư chùa Dâu","Thầy đồ Chu","Lái buôn bến Vạn","Phủ quan","Lò bánh đầu đình","Nhà bá hộ Lê"];
function genOrders(){
  const se = seasonOf(S.day);
  const pool = Object.keys(ORDER_QTY).filter(g => !(se === 3 && (g === "rau" || g === "lac" || g === "mia")));
  const out = [];
  while (out.length < 3 && pool.length){
    const g = pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    const [lo,hi] = ORDER_QTY[g], q = lo + Math.floor(Math.random()*(hi-lo+1));
    const mult = [1.3,1.4,1.5,1.6,1.8][Math.floor(Math.random()*5)];
    out.push({g, q, pay:Math.round(q*GOODS[g].base*mult), mult, who:VILLAGERS[Math.floor(Math.random()*VILLAGERS.length)], until:S.day+5});
  }
  S.orders = out;
}
function winterInfo(){
  const need = romNeed(), rom = S.goods.rom||0, thoc = S.goods.thoc||0;
  return {romDays: need ? Math.floor(rom/need) : null, riceDays: thoc};
}
const cap = () => S.up.chuong ? 10 : 4;
const fedTrau = () => S.animals.some(a => a.t === "trau" && a.h === 0);
const romBuy = () => seasonOf(S.day) === 3 ? 5 : 2;
const plotPrice = () => 40 + 15*(S.plots.length - 6);
const romNeed = () => S.animals.reduce((s,a) => s + ANIMALS[a.t].eat, 0);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function sellPrice(g){
  if (g === "rom") return Math.max(1, Math.floor(romBuy()/2));
  let p = GOODS[g].base * (S.pf[g] ?? 1);
  if (isPhien(S.day)) p *= 1.25;
  if (S.ev && S.ev.id === "hoi") p *= 1.2;
  if (S.ev && S.ev.id === "han" && (g === "thoc" || g === "rau")) p *= 1.3;
  return Math.max(1, Math.round(p));
}
function trend(g){ const d = S.pf[g] - (S.pp[g] ?? S.pf[g]); return d > 0.03 ? "up" : d < -0.03 ? "down" : "flat"; }

/* ===== Hành động ===== */
function toast(t, kind){
  const el = document.createElement("div"); el.className = "toast" + (kind ? " "+kind : ""); el.textContent = t; if (kind === "warn") RLA.sfx("canhbao");
  const box = document.getElementById("toasts"); box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => el.remove(), 2600);
}
function addLog(t, k){ S.log.unshift({d:S.day, t, k:k||""}); if (S.log.length > 40) S.log.length = 40; }
function commit(){ checkGoals(); save(); render(); }
function useSuc(n){
  if (S.suc < n){ toast("Hết sức rồi. Bấm “Đi ngủ” để sang ngày mới.", "warn"); return false; }
  S.suc -= n; return true;
}
function mark(id){
  if (S.goals[id]) return;
  S.goals[id] = true;
  const g = GOALS.find(x => x.id === id);
  addLog("Hoàn thành mục tiêu: " + g.t + ". Vào bảng Nhiệm vụ để nhận thưởng.", "good");
}
function checkGoals(){
  if (S.animals.some(a => a.t === "trau")) mark("trau");
  if (S.plots.length >= 10) mark("r10");
  checkQuests();
}
const fmtGot = got => Object.entries(got).map(([g,n]) => "+" + n + " " + GOODS[g].n).join(", ");

/* Làm ruộng từng bước như Harvest Moon: cuốc xới đất, gieo hạt, múc nước giếng vào bình rồi tưới, cầm liềm gặt */
function tapPlot(i){
  const p = S.plots[i];
  if (!p.c && !p.t){
    if (!useSuc(1)) return;
    p.t = true; stat("xoi"); toolAct("cuoc", i); RLA.sfx("gieo");
    toast("Xới xong thửa " + (i+1) + ". Giờ gieo hạt được rồi."); commit(); return;
  }
  if (!p.c){ const h = S.hold; if (h && S.seeds[h] > 0 && CROPS[h].ss.includes(seasonOf(S.day))) plant(i, h); else { if (h && !CROPS[h].ss.includes(seasonOf(S.day))) toast("Giống " + CROPS[h].n + " không hợp mùa này, chọn giống khác.", "warn"); openSeeds(i); } return; }
  const C = CROPS[p.c];
  if (p.a >= C.days){ if (S.suc >= 1) toolAct("liem", i); harvest(i); return; }
  if (!p.w){
    if (!(S.water > 0)){ S.tool = "binh"; toast("Bình tưới hết nước. Ra giếng bấm Làm để múc nước.", "warn"); render(); return; }
    if (!useSuc(1)) return;
    S.water--; p.w = true; stat("tuoi"); toolAct("binh", i); RLA.sfx("tuoi");
    toast("Đã tưới " + C.n + ". Bình còn " + S.water + " lượt nước."); commit(); return;
  }
  openPlotInfo(i);
}
function harvest(i, quiet, early){
  const p = S.plots[i], C = CROPS[p.c];
  if (!useSuc(1)) return null;
  const got = yieldOf(p, early);
  for (const g in got) S.goods[g] = (S.goods[g]||0) + got[g];
  stat("gat"); if (p.c === "lua" && !early) mark("lua1");
  p.m = clampM(p.m + (early ? Math.round(C.fd/2) : C.fd));
  p.c = null; p.a = 0; p.w = false; p.t = false;
  if (!quiet){ closeModal(); RLA.sfx("gat"); toast((early ? "Gặt sớm: " : "Gặt xong: ") + fmtGot(got)); commit(); }
  return got;
}
function canEarly(p){ const C = CROPS[p.c]; return p.a >= Math.ceil(C.days/2) && p.a < C.days; }
function openPlotInfo(i){
  const p = S.plots[i], C = CROPS[p.c];
  const full = fmtGot({...yieldOf({...p, a:C.days})}).replace(/\+/g,""), half = fmtGot(yieldOf(p, true)).replace(/\+/g,"");
  openModal(`<h2>${C.i} ${C.n} · thửa ${i+1}</h2>
   <p>Đã tưới hôm nay. Còn <b>${C.days - p.a} đêm</b> nữa thì chín.</p>
   <p class="note">Độ màu ruộng: ${p.m}/100. Chín sẽ được khoảng ${full}. Sau khi gặt: ${fdText(C.fd)}.</p>
   ${canEarly(p) ? `<p class="note">Gặt sớm (khi có tin châu chấu hay lũ) chỉ được khoảng ${half}.</p>` : `<p class="note">Cây lớn được nửa thời gian thì mới gặt sớm được.</p>`}
   <div class="acts">${canEarly(p) ? `<button class="btn" data-act="early" data-i="${i}">Gặt sớm (1 sức)</button>` : ""}<button class="btn p" data-act="close">Đóng</button></div>`);
}
function plant(i, c){
  const p = S.plots[i], C = CROPS[c];
  if (p.c || !p.t || !(S.seeds[c] > 0) || !C.ss.includes(seasonOf(S.day))) return;
  if (!useSuc(1)) return;
  S.seeds[c]--; p.c = c; p.a = 0; p.w = !!S.wet; stat("gieo"); toolAct("giong", i); if (c === "lac") stat("lac"); if (S.hold === c && !S.seeds[c]) S.hold = null;
  closeModal(); RLA.sfx("gieo");
  toast("Đã gieo " + C.n + (p.w ? " (đã có nước)." : ". Nhớ tưới nhé."));
  commit();
}
function waterAll(){
  let n = 0;
  for (const p of S.plots){ if (p.c && !p.w && p.a < CROPS[p.c].days){ if (S.suc < 1){ break; } S.suc--; p.w = true; n++; } }
  if (n){ stat("tuoi", n); RLA.sfx("tuoi"); toast("Đã tưới " + n + " thửa."); } else if (S.suc < 1) toast("Hết sức rồi.", "warn"); else toast("Không còn thửa nào cần tưới.");
  commit();
}
function harvestAll(){
  const tot = {}; let n = 0;
  S.plots.forEach((p,i) => {
    if (p.c && p.a >= CROPS[p.c].days && S.suc >= 1){ const g = harvest(i, true); n++; for (const k in g) tot[k] = (tot[k]||0) + g[k]; }
  });
  if (n) RLA.sfx("gat");
  if (n) toast("Gặt " + n + " thửa: " + fmtGot(tot)); else toast("Chưa có thửa nào chín.");
  commit();
}
function buySeed(c, n){
  const cost = CROPS[c].seed * n;
  if (S.money < cost){ toast("Không đủ tiền. Cần " + cost + " đồng.", "warn"); return; }
  S.money -= cost; S.seeds[c] = (S.seeds[c]||0) + n;
  toast("Mua " + n + " giống " + CROPS[c].n + " (−" + cost + " đồng)."); commit();
}
function sellGood(g, all){
  const have = S.goods[g]||0; if (!have) return;
  const n = all ? have : 1, pr = Math.round(sellPrice(g) * n * (S.gian ? 1.3 : 1));
  S.goods[g] = have - n; S.money += pr; stat("ban", pr); RLA.sfx("ban");
  if (S.gian) canDieu();
  toast("Bán " + n + " " + GOODS[g].n + " được " + pr + " đồng."); commit();
}
function buyRom(n){
  const cost = romBuy()*n;
  if (S.money < cost){ toast("Không đủ tiền. Cần " + cost + " đồng.", "warn"); return; }
  S.money -= cost; RLA.sfx("mua"); S.goods.rom = (S.goods.rom||0) + n;
  toast("Mua " + n + " rơm cỏ (−" + cost + " đồng)."); commit();
}
function buyAnimal(t){
  const A = ANIMALS[t];
  if (S.animals.length >= cap()){ toast("Chuồng đã đầy. Nâng cấp Chuồng rộng để nuôi thêm.", "warn"); return; }
  if (S.money < A.price){ toast("Không đủ tiền. Cần " + A.price + " đồng.", "warn"); return; }
  S.money -= A.price; RLA.sfx("gasuc"); S.animals.push({t, h:0, f:0});
  toast("Đã mua 1 " + A.n + "."); commit();
}
function animalValue(a){ const A = ANIMALS[a.t]; return (a.t === "lon" && a.f >= A.fat) ? A.fatSell : A.sell; }
function sellAnimal(i){
  const a = S.animals[i]; if (!a) return;
  const v = animalValue(a); S.money += v; RLA.sfx("ban"); S.animals.splice(i,1);
  toast("Bán " + ANIMALS[a.t].n + " được " + v + " đồng."); commit();
}
function buyUpg(id){
  const u = UPG.find(x => x.id === id);
  if (S.up[id]) return;
  if (S.money < u.price){ toast("Không đủ tiền. Cần " + u.price + " đồng.", "warn"); return; }
  S.money -= u.price; S.up[id] = true; if (id !== "nha") RLA.sfx("mua");
  addLog("Đã có " + u.n + ".", "good");
  if (id === "guong"){ S.plots.forEach(p => { if (p.c) p.w = true; }); S.wet = true; }
  if (id === "nha"){ mark("nha"); S.won = true; commit(); showWin(); return; }
  toast("Đã có " + u.n + "."); commit();
}
function buyPlot(){
  if (S.plots.length >= 16) return;
  const pr = plotPrice();
  if (S.money < pr){ toast("Không đủ tiền. Cần " + pr + " đồng.", "warn"); return; }
  S.money -= pr; RLA.sfx("mua"); S.plots.push({c:null, a:0, w:!!S.wet, m:60, t:false});
  toast("Khai hoang thêm 1 thửa ruộng."); commit();
}
function fillOrder(i){
  const o = S.orders[i]; if (!o) return;
  if ((S.goods[o.g]||0) < o.q){ toast("Chưa đủ hàng: cần " + o.q + " " + GOODS[o.g].n + ".", "warn"); return; }
  S.goods[o.g] -= o.q; S.money += o.pay; S.orders.splice(i,1); stat("don");
  addLog("Giao đơn cho " + o.who + ": " + o.q + " " + GOODS[o.g].n + ", nhận " + o.pay + " đồng.", "good");
  RLA.sfx("ban"); toast("Giao xong đơn, nhận " + o.pay + " đồng."); commit();
}

/* ===== Qua đêm ===== */
function sleep(quiet){
  RLA.sfx("ngu");
  const notes = [], d = S.day, se = seasonOf(d);
  const gentle = yearOf(d) === 1 && se === 3;
  let died = 0;
  for (const p of S.plots){
    if (!p.c){ p.m = clampM(p.m + 4); p.w = false; continue; }
    const C = CROPS[p.c];
    if (p.a < C.days){
      if (p.w) p.a++;
      else if (S.ev && S.ev.id === "han"){ p.c = null; p.a = 0; died++; }
    }
    p.w = false;
  }
  if (died) notes.push(["bad", "Nắng hạn làm héo " + died + " thửa chưa được tưới."]);

  let eggs = 0, hungry = 0, thin = 0; const lost = [];
  for (const a of S.animals){
    const A = ANIMALS[a.t];
    if ((S.goods.rom||0) >= A.eat){ S.goods.rom -= A.eat; a.h = 0; a.f = (a.f||0) + 1; if (a.t === "ga") eggs++; if (a.t === "lon" && a.f === A.fat) stat("lonbeo"); if (a.t === "lon" && a.f === A.fat) notes.push(["good","Một con lợn đã béo. Vào Chuồng để bán được 170 đồng."]); }
    else { a.h++; if (a.t === "trau") thin++; else hungry++; }
  }
  S.animals = S.animals.filter(a => { if (a.t !== "trau" && !gentle && a.h >= 3){ lost.push(ANIMALS[a.t].n); return false; } return true; });
  if (eggs){ S.goods.trung = (S.goods.trung||0) + eggs; notes.push(["good","Gà đẻ " + eggs + " quả trứng."]); }
  if (thin) notes.push(["bad","Trâu thiếu rơm nên gầy đi, chưa kéo cày được. Cho ăn đủ là khoẻ lại."]);
  if (hungry) notes.push(["bad", hungry + " con vật bị đói vì hết rơm cỏ." + (gentle ? " Mùa Đông đầu tiên chúng chưa chết, nhưng không đẻ, không lớn." : " Đói 3 ngày liền sẽ chết.")]);
  if (lost.length) notes.push(["bad","Chết vì đói: " + lost.join(", ") + "."]);

  /* Mùa Đông cả nhà ăn 1 thóc mỗi ngày */
  S.tired = false;
  if (se === 3){
    if ((S.goods.thoc||0) >= 1) S.goods.thoc--;
    else { S.tired = true; notes.push(["bad","Hết thóc ăn, cả nhà đói nên hôm nay chỉ còn " + (MAXS-3) + " sức."]); }
  }

  if (dis(d) === SL){
    const t = taxDue();
    if (taxFree(d)) notes.push(["tax","Mùa Đông năm đầu, lý trưởng miễn tô thuế cho nhà mình."]);
    else {
      const have = S.goods.thoc||0, giveT = Math.min(have, t), short = t - giveT;
      const cash = short * sellPrice("thoc");
      if (short === 0){ S.goods.thoc -= t; notes.push(["tax","Lý trưởng thu tô thuế mùa " + SEASONS[se] + ": " + t + " thóc."]); mark("thue"); }
      else if (S.money >= cash){ S.goods.thoc -= giveT; S.money -= cash; notes.push(["tax","Nộp tô thuế: " + giveT + " thóc, thiếu " + short + " thóc nộp bù " + cash + " đồng."]); }
      else {
        S.goods.thoc -= giveT; const paid = S.money; S.money = 0;
        let m = "Thiếu tô thuế: nộp " + giveT + " thóc và " + paid + " đồng vẫn chưa đủ.";
        if (S.plots.length > 4){ S.plots.pop(); m += " Quan thu lại 1 thửa ruộng."; }
        S.toi = Math.min(100, (S.toi||0) + 30); m += " Lý trưởng ghi tội trốn thuế: +30 tiếng xấu.";
        notes.push(["bad", m]);
      }
    }
  }

  S.day++; S.suc = S.tired ? MAXS-3 : MAXS; S.time = 360;
  if (S.faint){ S.faint = false; S.suc = Math.max(3, S.suc - 4); notes.push(["bad", "Đêm qua anh thức quá nửa đêm nên ngất giữa đường, bà con khiêng về nhà. Sáng nay chỉ còn " + S.suc + " sức."]); }
  S.ev = null; S.wet = false;
  if (isPhien(S.day)){
    S.pp = {...S.pf};
    for (const g in S.pf){ const f = S.pf[g] + (Math.random()-0.5)*0.4 + (1 - S.pf[g])*0.2; S.pf[g] = Math.min(1.5, Math.max(0.6, f)); }
    genOrders();
    notes.push(["good","Hôm nay có chợ phiên: giá mới, có 3 đơn hàng mới, giá bán cao hơn 25%."]);
  }
  else if (S.orders.length && S.orders.some(o => o.until <= S.day)) S.orders = S.orders.filter(o => o.until > S.day);
  if (S.warn && S.warn.day === S.day){ strike(S.warn.id, notes); S.warn = null; }
  else rollEvent(notes);
  if (S.up.guong){ S.plots.forEach(p => { if (p.c) p.w = true; }); S.wet = true; }
  nightExtra(notes);
  if (S.day === SL*4 + 1) mark("dong");
  const nd = dis(S.day), nse = seasonOf(S.day);
  if (nd === 1) notes.unshift(["season","Sang mùa " + SEASONS[nse] + ". " + SEASON_TIP[nse]]);
  if (nd === SL-2 && !taxFree(S.day)) notes.push(["tax","Còn 3 ngày nữa nộp tô thuế: " + taxDue() + " thóc (thiếu thì nộp bù bằng tiền)."]);
  if (nse === 2 && (nd === 1 || nd === 6)){
    const w = winterInfo();
    notes.push(["bad","Còn " + (SL - nd + 1) + " ngày nữa đến mùa Đông. Kho thóc đủ cho nhà ăn " + Math.min(w.riceDays, SL) + "/" + SL + " ngày" + (w.romDays === null ? "" : ", rơm cỏ đủ cho gia súc " + Math.min(w.romDays, SL) + "/" + SL + " ngày") + "."]);
  }
  const need = romNeed(), have = S.goods.rom||0;
  if (need && have < need*3) notes.push(["bad","Rơm cỏ chỉ còn " + have + ", đủ cho khoảng " + Math.floor(have/need) + " ngày."]);
  notes.forEach(n => addLog(n[1], n[0]));
  commit();
  if (quiet) return notes;
  showMorning(notes);
}
function pickW(opts){ const tot = opts.reduce((s,o) => s + o[1], 0); let r = Math.random()*tot; for (const o of opts){ if ((r -= o[1]) < 0) return o[0]; } return opts[0][0]; }
function wipe(list, n){ let k = 0; while (k < n && list.length){ const p = list.splice(Math.floor(Math.random()*list.length),1)[0]; p.c = null; p.a = 0; p.w = false; k++; } return k; }
/* Sự kiện báo trước tới ngày thì xảy ra */
function strike(id, notes){
  let msg, k = "bad";
  if (id === "chau"){
    const lua = S.plots.filter(p => p.c === "lua"), other = S.plots.filter(p => p.c && p.c !== "lua");
    const n = Math.max(1, Math.ceil((lua.length + other.length)/2));
    let hit = wipe(lua, n); hit += wipe(other, n - hit);
    msg = hit ? "Châu chấu kéo đến như trưởng làng báo, ăn trụi " + hit + " thửa chưa gặt." : "Châu chấu kéo đến nhưng ruộng đã gặt sạch, nhà mình không mất gì.";
    if (!hit) k = "good";
  } else {
    if (S.up.de){ msg = "Nước sông lên cao nhưng đê vững, ruộng an toàn."; k = "good"; }
    else {
      const hit = wipe(S.plots.filter(p => p.c), 3);
      msg = hit ? "Nước sông tràn bờ, ngập " + hit + " thửa ruộng. Đắp đê (mục Nâng cấp) để phòng lần sau." : "Nước sông tràn bờ, may ruộng đang trống nên không mất gì.";
    }
  }
  S.ev = {id, msg, k};
  notes.push([k, msg]);
}
function rollEvent(notes){
  const se = seasonOf(S.day);
  if (S.day < 4 || Math.random() > (se === 3 ? 0.2 : 0.38)) return;
  const opts = [["mua", se === 3 ? 1 : 3], ["hoi", 0.6]];
  if (se !== 3) opts.push(["han", se === 1 ? 2 : 1]);
  if (!S.warn && (se === 1 || se === 2)){ opts.push(["chau", 1.5]); if (S.day > SL) opts.push(["lu", 1.2]); }
  if (S.animals.some(a => a.t === "ga")) opts.push(["cao", 1]);
  if ((S.goods.thoc||0) >= 3) opts.push(["chuot", 1]);
  const id = pickW(opts); let msg, k = "bad";
  if (id === "chau" || id === "lu"){
    S.warn = {id, day:S.day + 2};
    msg = id === "chau"
      ? "Trưởng làng báo tin: 2 ngày nữa (sáng ngày " + dis(S.day+2) + ") châu chấu sẽ kéo đến, ăn một nửa số thửa chưa gặt. Hãy gặt lúa chín, hoặc gặt sớm cây đã lớn quá nửa."
      : "Trưởng làng báo tin: 2 ngày nữa (sáng ngày " + dis(S.day+2) + ") nước sông lên." + (S.up.de ? " Nhà mình đã đắp đê nên yên tâm." : " Chưa có đê thì có thể mất 3 thửa. Gặt sớm, hoặc đắp đê ngay trong mục Nâng cấp.");
    S.ev = {id:"warn", msg, k};
    notes.push([k, msg]);
    return;
  }
  if (id === "mua"){ S.plots.forEach(p => { if (p.c) p.w = true; }); S.wet = true; msg = "Mưa rào: cả cánh đồng được tưới hôm nay, gieo mới cũng có nước."; k = "good"; }
  else if (id === "hoi"){ msg = "Làng mở hội: mọi hàng bán ở chợ hôm nay được thêm 20%."; k = "good"; }
  else if (id === "han"){ msg = "Nắng hạn: thửa nào chưa tưới đến tối sẽ héo chết. Giá thóc và rau tăng."; }
  else if (id === "chuot"){
    if (S.cat){ msg = "Đêm qua chuột mò vào kho, mèo " + S.cat.n + " vồ được, không mất hạt thóc nào."; k = "good"; }
    else { const n = Math.min(S.goods.thoc||0, 2 + Math.floor(Math.random()*3)); S.goods.thoc -= n; msg = "Chuột vào kho ăn mất " + n + " thóc. Nuôi một con mèo (ở Chuồng trại) để bắt chuột."; }
  }
  else if (id === "cao"){
    if (S.up.cho){ msg = "Đêm qua có cáo lảng vảng, chó sủa đuổi đi."; k = "good"; }
    else { const i = S.animals.findIndex(a => a.t === "ga"); S.animals.splice(i,1); msg = "Cáo vào chuồng bắt mất 1 con gà. Nuôi chó giữ nhà để phòng."; }
  }
  S.ev = {id, msg, k};
  notes.push([k, msg]);
}

  return `<div class="row"><span class="e">${RLA.art("meo")}</span><span class="t"><b>Nhận nuôi mèo Mướp</b><small>Mèo mướp xám nhà hàng xóm đẻ lứa mới. Mèo theo anh quanh nhà, bắt chuột giữ kho thóc, không cần ăn rơm.</small></span><span class="a"><button class="btn s p" data-act="buycat">Nhận nuôi · 50đ</button></span></div>`;

/* ===== Tiếng xấu: phạm luật làng thì cộng điểm, từ 60 điểm lính bắt giải lên phủ ===== */
let arrestPending = false;
function addToi(n, why){
  S.toi = Math.min(100, (S.toi||0) + n); stat("toi", n);
  addLog("Phạm luật: " + why + ". Tiếng xấu +" + n + " (" + S.toi + "/100).", "bad");
  toast("Tiếng xấu +" + n + ": " + why + ".", "warn");
  if (S.toi >= 60) arrestPending = true;
}
function canDieu(){
  if (Math.random() < 0.25){
    addToi(30, "cân điêu ở chợ bị bắt quả tang");
    const n = NPCS.find(x => x.id === "huong"); if (n){ addRel(n.id, -6); emo(n, "gian"); }
    save(); render();
  }
}
function vToi(chuoc){
  const t = S.toi || 0, fee = t*2;
  return `<div class="box" style="background:var(--bg)"><h3>Tiếng xấu: ${t}/100</h3>
   <span class="bar toi"><i style="width:${t}%"></i></span>
   <p class="note">Hái trộm, cân điêu, trốn thuế, đi đêm quá 23 giờ ở làng hay phố bị lính bắt gặp đều mang tiếng xấu. Từ 60 điểm trở lên lính tuần sẽ bắt giải lên phủ: giam 2 đến 3 ngày và phạt tiền. Mỗi đêm tiếng xấu tự giảm 5 điểm.</p>
   ${chuoc && t ? `<button class="btn s p" data-act="chuoc" ${S.money >= fee ? "" : "disabled"}>Tự nộp phạt xoá tiếng xấu · ${fee}đ</button>` : ""}</div>`;
}
function chuocToi(){
  const fee = (S.toi||0)*2; if (!S.toi || S.money < fee) return;
  S.money -= fee; S.toi = 0; arrestPending = false; RLA.sfx("thue");
  addLog("Tự nộp phạt " + fee + " đồng ở công đường, xoá hết tiếng xấu.", "good"); toast("Đã nộp phạt " + fee + " đồng. Tiếng xấu về 0."); commit();
}
function vNguc(){
  return `<h2>Nhà ngục phủ Thiên Đức</h2><p class="sub">Tường đá, song gỗ lim. Kẻ phạm luật bị giam ở đây vài ngày.</p>${vToi(true)}`;
}
function vTrom(){
  const done = S.trom === S.day;
  return `<h2>Vườn cam nhà bá hộ Lê</h2>
   <p class="sub">Vườn cam Canh sai trĩu quả, rào tre kín. Đây là vườn nhà người ta.</p>
   <p>${done ? "Hôm nay vườn đã bị hái trộm rồi, bá hộ cho người canh chặt lắm." : "Hái trộm được vài quả cam, nhưng đó là <b>phạm luật làng</b>. Có người hay lính tuần đứng gần nhìn thấy thì bị bắt quả tang (+40 tiếng xấu, người thấy sẽ ghét anh). Không ai thấy thì bá hộ vẫn phát hiện mất cam (+15 tiếng xấu)."}</p>
   <div class="acts"><button class="btn p" data-act="close">Thôi, không lấy của người</button>${done ? "" : `<button class="btn" data-act="trom">Hái trộm cam</button>`}</div>`;
}
function doTrom(){
  if (S.trom === S.day) return;
  S.trom = S.day; S.goods.cam = (S.goods.cam||0) + 3; closeModal();
  const seen = NPCS.filter(n => npcVisible(n) && Math.hypot(n.x - P.x, n.y - P.y) < 260);
  if (seen.length){
    seen.forEach(n => { addRel(n.id, -8); emo(n, "gian"); faceP(n); });
    addToi(40, "hái trộm cam bị " + seen.map(n => n.n).join(", ") + " bắt quả tang");
  } else addToi(15, "hái trộm cam, bá hộ phát hiện mất cam");
  RLA.sfx("gat"); commit();
}
function showArrest(){
  arrestPending = false;
  const days = S.toi >= 85 ? 3 : 2, fine = 40 + S.toi;
  RLA.sfx("canhbao");
  openModal(`<h2>Lính tuần bắt giữ!</h2><p>Tiếng xấu của anh đã lên <b>${S.toi}/100</b>. Lính tuần trói tay anh giải lên công đường phủ Thiên Đức.</p>
   <p>Quan huyện xử: <b>giam ${days} ngày</b> ở nhà ngục và <b>phạt ${fine} đồng</b>${S.money < fine ? " (anh chỉ có " + S.money + " đồng, nộp hết)" : ""}. Trong những ngày bị giam, ruộng nhà không ai tưới${S.spouse ? " ngoài vợ anh" : ""}, cả làng xì xào bàn tán.</p>
   <div class="acts"><button class="btn p" data-act="jail">Chịu tội</button></div>`, true);
}
function doJail(){
  const days = S.toi >= 85 ? 3 : 2, fine = Math.min(S.money, 40 + S.toi);
  closeModal(); FISH = null;
  S.money -= fine; S.toi = 10; stat("tu");
  NPCS.forEach(n => { if (n.id !== S.spouse) addRel(n.id, -6); });
  if (S.map !== "tran"){ S.map = "tran"; loadMap("tran"); herd = []; }
  P.x = 49.5*T; P.y = 9.7*T; P.dir = 2; route = null; pendingGo = null;
  let notes = [["bad", "Anh bị giam " + days + " ngày ở nhà ngục phủ Thiên Đức, nộp phạt " + fine + " đồng. Ra tù, tiếng xấu còn 10, người quen ai cũng bớt quý anh."]];
  for (let d = 0; d < days; d++) notes = notes.concat(sleep(true) || []);
  addLog("Bị giam " + days + " ngày, phạt " + fine + " đồng.", "bad");
  commit(); showMorning(notes);
}

/* ===== Sọt bán hàng cạnh nhà (như thùng gửi hàng trong Harvest Moon) ===== */
const shipPrice = g => Math.max(1, Math.round(GOODS[g].base*(S.pf[g] ?? 1)*0.9));
function vSot(){
  S.ship = S.ship || {};
  const rows = Object.entries(GOODS).filter(([g, G]) => !G.shop).map(([g, G]) => {
    const have = S.goods[g]||0, inS = S.ship[g]||0;
    return `<div class="row"><span class="e">${G.i}</span><span class="t"><b>${G.n}${inS ? `<span class="pill good">trong sọt ${inS}</span>` : ""}</b><small class="num">Trong kho ${have} · lái buôn trả ${shipPrice(g)}đ một</small></span>
     <span class="a"><button class="btn s" data-act="ship" data-g="${g}" ${have ? "" : "disabled"}>Bỏ 1</button><button class="btn s p" data-act="shipall" data-g="${g}" ${have ? "" : "disabled"}>Bỏ hết</button></span></div>`;
  }).join("");
  const tot = Object.entries(S.ship).reduce((a, [g, n]) => a + n*shipPrice(g), 0);
  return `<h2>Sọt bán hàng</h2>
   <p class="sub">Bỏ nông sản vào sọt tre, nửa đêm người của lái buôn Vạn đến gom, sáng mai tiền đã nằm trong nhà. Giá bằng 90% giá chợ thường, không phải đi xa.</p>
   <div class="box" style="background:var(--bg)">Trong sọt đang có hàng trị giá <b>${tot} đồng</b>.${tot ? ` <button class="btn s" data-act="unship">Lấy lại hết</button>` : ""}</div>
   <div class="rows sec">${rows}</div>`;
}
function shipGood(g, all){
  const have = S.goods[g]||0; if (!have) return;
  const n = all ? have : 1; S.goods[g] -= n; S.ship = S.ship || {}; S.ship[g] = (S.ship[g]||0) + n; stat("sot", n); RLA.sfx("mua");
  toast("Bỏ " + n + " " + GOODS[g].n + " vào sọt."); commit();
}
function unship(){ for (const g in S.ship || {}) S.goods[g] = (S.goods[g]||0) + S.ship[g]; S.ship = {}; toast("Đã lấy lại hàng trong sọt."); commit(); }

/* ===== Hội làng ngày 7 mỗi mùa ở đình làng Dâu ===== */
const HOI = [
  {n:"Hội xuân thi rau", g:"rau", need:3, prize:60},
  {n:"Hội đua mía mùa Hạ", g:"mia", need:3, prize:80},
  {n:"Hội thi lúa mùa Thu", g:"thoc", need:5, prize:100},
  {n:"Hội khoai mùa Đông", g:"khoai", need:3, prize:60}
];
const isHoi = () => dis(S.day) === 7;
function vHoi(){
  if (!isHoi()) return `<p class="note sec">Hội làng mở ngày 7 mỗi mùa ở sân đình, ai đến dự cũng được cả làng quý thêm.</p>`;
  const H = HOI[seasonOf(S.day)], done = S.hoi === S.day, have = S.goods[H.g]||0;
  return `<div class="box sec" style="background:var(--bg)"><h3>Hôm nay: ${H.n}</h3>
   <p>Cả làng tụ về sân đình, có cờ người, đánh đu, hát quan họ. Đến dự hội thì ai ở làng Dâu cũng quý anh thêm (+5 tình cảm mỗi người).</p>
   <p class="note">Mang ${H.need} ${GOODS[H.g].n} đến dự thi để giành giải ${H.prize} đồng (hàng vẫn giữ lại). Kho đang có ${have}.</p>
   <button class="btn p" data-act="duhoi" ${done ? "disabled" : ""}>${done ? "Đã dự hội hôm nay" : "Dự hội"}</button></div>`;
}
function duHoi(){
  if (!isHoi() || S.hoi === S.day) return;
  S.hoi = S.day; const H = HOI[seasonOf(S.day)];
  NPCS.forEach(n => { if (n.map === "lang") addRel(n.id, 5); });
  let m = "Anh dự " + H.n + " ở đình làng, cả làng Dâu quý anh thêm.";
  if ((S.goods[H.g]||0) >= H.need){ S.money += H.prize; m += " Hàng của anh đoạt giải nhất, được thưởng " + H.prize + " đồng!"; RLA.sfx("thang"); } else RLA.sfx("sang");
  addLog(m, "good"); toast(m); commit();
}

/* ===== Việc trong đêm: sọt hàng, tiếng xấu giảm, đám cưới, vợ tưới ruộng ===== */
function nightExtra(notes){
  const tot = Object.entries(S.ship || {}).reduce((a, [g, n]) => a + n*shipPrice(g), 0);
  if (tot){ S.money += tot; stat("ban", tot); notes.push(["good", "Lái buôn gom hàng trong sọt, trả " + tot + " đồng."]); S.ship = {}; }
  if (S.toi > 0) S.toi = Math.max(0, S.toi - 5);
  if (S.wed && S.day >= S.wed.day){
    const n = NPCS.find(x => x.id === S.wed.id);
    S.spouse = S.wed.id; S.lover = null; S.wed = null; applySpouse(); addRel(n.id, 10);
    notes.unshift(["good", "Hôm nay làng Dâu mở tiệc cưới ở sân đình. " + n.n + " về làm vợ anh, họ hàng làng xóm đến mừng đông vui!"]);
    setTimeout(() => RLA.sfx("thang"), 1200);
  } else if (S.spouse){
    const n = NPCS.find(x => x.id === S.spouse); let k = 0;
    for (const p of S.plots) if (p.c && !p.w && p.a < CROPS[p.c].days && k < 3){ p.w = true; k++; }
    if (k) notes.push(["good", n.ten + " dậy sớm tưới giúp " + k + " thửa ruộng."]);
  }
  if (dis(S.day) === 7) notes.push(["good", "Hôm nay hội làng ở đình làng Dâu: " + HOI[seasonOf(S.day)].n + "."]);
}

/* ===== Túi đồ (gùi tre trên lưng) ===== */
const FOOD = {khoai:3, trung:2, rau:2, banh:5, thuoc:10, ca:3, cam:3};
function vTui(){
  const seeds = Object.entries(CROPS).map(([c, C]) => {
    const n = S.seeds[c]||0, sel = S.hold === c;
    return `<button class="slot ${sel ? "sel" : ""}" data-act="hold" data-c="${c}" ${n ? "" : "disabled"} aria-pressed="${sel}"><span class="si">${C.i}</span><span class="sn">${C.n}</span><span class="sc num">${n}</span></button>`;
  }).join("");
  const goods = Object.entries(GOODS).map(([g, G]) => {
    const n = S.goods[g]||0, f = FOOD[g];
    return `<div class="slot"><span class="si">${G.i}</span><span class="sn">${G.n}</span><span class="sc num">${n}</span>${f ? `<button class="btn s" data-act="eat" data-g="${g}" ${n && S.suc < MAXS ? "" : "disabled"}>Ăn +${f} sức</button>` : ""}</div>`;
  }).join("");
  const H = S.hold && CROPS[S.hold];
  return `<h2>Túi đồ</h2>
   <p class="sub">Đồ đựng trong gùi tre anh đeo sau lưng. Chạm một loại giống để <b>cầm trên tay</b>: ra ruộng đứng trên thửa trống bấm Làm là gieo luôn, không phải chọn lại.</p>
   <div class="box" style="background:var(--bg)">Đang cầm: <b>${H ? H.n + " (còn " + (S.seeds[S.hold]||0) + " giống)" : "tay không"}</b>${H ? ` <button class="btn s" data-act="hold" data-c="">Cất đi</button>` : ""}</div>
   <div class="sec"><h3>Hạt giống</h3><div class="slots">${seeds}</div></div>
   <div class="sec"><h3>Nông sản</h3><div class="slots">${goods}</div><p class="note">Đói thì ăn khoai, trứng, rau, cá, cam, bánh giầy hoặc uống thuốc bổ để hồi sức ngay trong ngày (sức tối đa ${MAXS}). Còn lại mang ra chợ bán.</p></div>
   <div class="sec"><h3>Vật nuôi, nhà cửa</h3><p class="note">${S.animals.length} con trong chuồng · ${S.plots.length} thửa ruộng · ${Object.keys(S.up).length ? "đã có: " + UPG.filter(u => S.up[u.id]).map(u => u.n).join(", ") : "chưa sắm nâng cấp nào"}.</p></div>`;
}
function eatGood(g){
  const f = FOOD[g]; if (!f || !(S.goods[g] > 0) || S.suc >= MAXS) return;
  S.goods[g]--; S.suc = Math.min(MAXS, S.suc + f); RLA.sfx("mua");
  toast("Ăn 1 " + GOODS[g].n + ", hồi " + f + " sức."); commit();
}
function holdSeed(c){
  S.hold = c && S.seeds[c] > 0 ? c : null; RLA.sfx("tap");
  toast(S.hold ? "Đang cầm giống " + CROPS[c].n + ". Ra thửa trống bấm Làm để gieo." : "Đã cất giống vào túi.");
  commit();
}


const PANELS = {nv:vNhiemVu, tui:vTui, quanhe:vQuanHe, chuong:vChuong, cho:vCho, kho:vKho, nang:vNang, ly:vLy, dinh:vDinh, gieng:vGieng, quan:vQuan, phu:vPhu, choh:vChoh, thuoc:vThuoc, tro:vTro, sot:vSot, nguc:vNguc, vuon:vTrom};
function openPanel(id){
  openModal("");
  panel = id; sheet.classList.add("wide"); sheet.scrollTop = 0; renderPanel();
  const b = sheet.querySelector("button"); if (b) b.focus({preventScroll:true});
}
function renderPanel(){
  if (!panel || modal.hidden) return;
  const st = sheet.scrollTop;
  sheet.innerHTML = `<div class="shead"><button class="btn s" data-act="close">Đóng ✕</button></div>` + PANELS[panel]();
  sheet.scrollTop = st;
  drawPortraits(sheet);
}

/* ===== Vẽ thanh trên và bảng tin ===== */
let newsOpen = true, newsDay = 0;
function clockText(){
  const m = Math.floor(Math.min(S.time, 1439)/10)*10, h = Math.floor(m/60), mm = m % 60;
  const part = h < 11 ? "sáng" : h < 13 ? "trưa" : h < 18 ? "chiều" : h < 22 ? "tối" : "khuya";
  return h + ":" + String(mm).padStart(2, "0") + " " + part;
}
function render(){
  const se = seasonOf(S.day);
  RLA.music.season(se);
  document.getElementById("hdr").innerHTML = `
   <div class="brand"><b>Ruộng Làng</b><span>${esc(MAPS[S.map].n)} · thời Lý–Trần</span></div>
   <div class="stat"><span class="season s${se}">${SEASONS[se]}</span><span class="num">Năm ${yearOf(S.day)} · ngày ${dis(S.day)}/${SL}</span></div>
   <div class="stat clockw" title="Giờ trong ngày"><span class="sun ${S.time >= 1110 ? "dem" : ""}" aria-hidden="true"></span><b class="num" id="clock">${clockText()}</b></div>
   <div class="stat money" title="Tiền"><span class="coin" aria-hidden="true"></span><b class="num">${S.money}</b> đồng</div>
   ${S.toi ? `<div class="stat"><span class="pill bad toipill" title="Tiếng xấu: từ 60 trở lên bị bắt">Tiếng xấu ${S.toi}</span></div>` : ""}
   <div class="stat" title="Sức còn lại hôm nay">Sức <span class="bar ${S.suc <= 3 ? "low" : ""}"><i style="width:${S.suc/MAXS*100}%"></i></span><span class="num">${S.suc}</span></div>
   <div class="btns">
    <button class="iconbtn" data-act="map" aria-label="Bản đồ">Bản đồ</button>
    <button class="iconbtn${RLA.music.on || RLA.sfxOn ? "" : " off"}" data-act="amthanh" aria-label="Âm thanh">♪</button>
    <button class="iconbtn" data-act="help" aria-label="Cách chơi">?</button>
    <button class="sleep" data-act="asksleep">Đi ngủ ▸</button>
   </div>`;

  const bn = [];
  if (S.ev) bn.push(`<div class="${S.ev.k}">${esc(S.ev.msg)}</div>`);
  if (isPhien(S.day) && (!S.ev || S.ev.k !== "good")) bn.push(`<div class="good">Hôm nay có chợ phiên ở làng Dâu: giá bán cao hơn 25%, có ${S.orders.length} đơn đặt hàng ở chợ.</div>`);
  if (isHoi()) bn.push(`<div class="good">Hôm nay ngày 7: ${HOI[se].n} ở đình làng Dâu. Đến dự để cả làng quý thêm.</div>`);
  if (S.warn) bn.push(`<div class="bad"><b>Tin báo:</b> sáng ngày ${dis(S.warn.day)} ${S.warn.id === "chau" ? "châu chấu kéo đến" : "nước sông lên"}${S.warn.id === "lu" && S.up.de ? " (đã có đê)" : ""}. Còn ${S.warn.day - S.day} đêm.</div>`);
  if (dis(S.day) >= SL-2 && !taxFree(S.day)){ const t = taxDue(), th = S.goods.thoc||0; bn.push(`<div class="${th < t ? "bad" : ""}">Cuối ngày ${SL} nộp tô thuế ${t} thóc. Kho đang có ${th} thóc${th < t ? ", thiếu " + (t-th) + " thóc sẽ phải nộp bù khoảng " + (t-th)*sellPrice("thoc") + " đồng" : ""}.</div>`); }
  if (se === 2){ const w = winterInfo(); bn.push(`<div class="bad">Còn ${SL - dis(S.day) + 1} ngày đến mùa Đông. Thóc đủ cho nhà ăn <b>${Math.min(w.riceDays,SL)}/${SL}</b> ngày${w.romDays === null ? "" : `, rơm cỏ đủ cho gia súc <b>${Math.min(w.romDays,SL)}/${SL}</b> ngày`}.</div>`); }
  if (se === 3 && !S.ev){ const w = winterInfo(); bn.push(`<div>Mùa Đông: cả nhà ăn 1 thóc mỗi ngày (còn ${w.riceDays} thóc)${w.romDays === null ? "" : `, rơm cỏ còn đủ ${w.romDays} ngày`}.</div>`); }
  if (newsDay !== S.day){ newsDay = S.day; newsOpen = true; }
  const nC = claimable();
  document.getElementById("fabs").innerHTML = `<button class="fab" data-act="nv" aria-label="Nhiệm vụ${nC ? ", " + nC + " phần thưởng chờ nhận" : ""}">${RLA.art("thoc")}Nhiệm vụ${nC ? `<span class="badge">${nC}</span>` : ""}</button>
   <button class="fab" data-act="quanhe" aria-label="Sổ quan hệ">${RLA.art("tim")}Quan hệ</button>
   <button class="fab" data-act="tui" aria-label="Túi đồ">${RLA.art("rom")}Túi đồ</button>`;
  document.getElementById("tools").innerHTML = vTools();
  document.getElementById("news").innerHTML = vTracker() + (bn.length
    ? `<button class="newsbtn" data-act="news" aria-expanded="${newsOpen}">${newsOpen ? "Ẩn tin ▴" : "Tin hôm nay (" + bn.length + ") ▾"}</button>${newsOpen ? `<div class="items">${bn.join("")}</div>` : ""}`
    : "");
  renderPanel();
}

function loadMap(id){
  M = MAPS[id]; MW = M.w; MH = M.h;
  ter = Array.from({length:MH}, () => new Uint8Array(MW));
  solid = Array.from({length:MH}, () => new Uint8Array(MW));
  PLACES = M.places; STALLS = M.stalls || []; TREES = M.trees || []; CAU = M.cau || []; HUTS = M.huts || []; EXITS = M.exits; FLAGS = M.flags || [];
  M.build();
  for (const k in PLACES){ if (k === "cho" || k === "choh") continue; const p = PLACES[k]; block(p.x, p.y, p.w, p.h); }
  STALLS.forEach(s => block(s[0], s[1], s[2], s[3]));
  HUTS.forEach(h => block(h[0], h[1], h[2], h[3]));
  TREES.forEach(t => block(Math.floor(t[0]), Math.floor(t[1]), 1, 1));
  CAU.forEach(t => block(Math.floor(t[0]), Math.floor(t[1]), 1, 1));
  bgKey = "";
}
const plotRect = i => [(6 + (i%4)*4)*T + 4, (7 + Math.floor(i/4)*4)*T + 4, 3*T - 8, 3*T - 8];

const solidAt = (x, y) => { const i = Math.floor(x/T), j = Math.floor(y/T); return i < 0 || j < 0 || i >= MW || j >= MH || solid[j][i] === 1; };
const hitBox = (x, y) => solidAt(x-7, y-6) || solidAt(x+7, y-6) || solidAt(x-7, y+1) || solidAt(x+7, y+1);
function tryMove(o, dx, dy){ if (dx && !hitBox(o.x + dx, o.y)) o.x += dx; if (dy && !hitBox(o.x, o.y + dy)) o.y += dy; }

let bg = null, bgKey = "", BGS = 2;
const GRASS = [["#9DC46B","#86AE57","#B2D27F"],["#86B551","#6F9E3E","#9CC764"],["#B5B65C","#9C9C48","#C7C46E"],["#98A889","#7F8F72","#AAB89C"]];
const LEAF = [["#4E8F2F","#6FAE45"],["#3F7F26","#5E9E36"],["#8E9A34","#B49A3A"],["#5E7A48","#748E5C"]];

function ensureBg(){
  const k = S.map + "|" + seasonOf(S.day) + "|" + (S.up.de ? 1 : 0) + (S.up.nha ? 1 : 0);
  if (bg && k === bgKey) return;
  bgKey = k;
  if (!bg) bg = document.createElement("canvas");
  BGS = Math.max(1, Math.min(2, dpr*zoom));
  if (bg.width !== MW*T*BGS || bg.height !== MH*T*BGS){ bg.width = MW*T*BGS; bg.height = MH*T*BGS; }
  const g = bg.getContext("2d"); g.setTransform(BGS,0,0,BGS,0,0); paintBg(g);
}
function paintBg(g){
  const se = seasonOf(S.day), R = rng(11 + ORDER.indexOf(S.map)*7), [gr, grd, grl] = GRASS[se];
  g.fillStyle = gr; g.fillRect(0, 0, MW*T, MH*T);
  g.globalAlpha = 0.35;
  for (let i = 0; i < MW*MH/8; i++){ g.fillStyle = R() < 0.5 ? grd : grl; g.beginPath(); g.ellipse(R()*MW*T, R()*MH*T, 20 + R()*50, 10 + R()*26, 0, 0, 7); g.fill(); }
  g.globalAlpha = 1;
  const TC = {1:"#4F80A8", 2:"#C8A472", 3:"#D9C695", 4:"#D4BE90", 5:"#7C9F55", 6:"#4C8197", 8:"#B4AA98"};
  for (let j = 0; j < MH; j++) for (let i = 0; i < MW; i++){ const v = ter[j][i]; if (v){ g.fillStyle = TC[v]; g.fillRect(i*T, j*T, T + 0.5, T + 0.5); } }
  /* đường lát đá ở phủ */
  g.strokeStyle = "rgba(70,60,50,.28)"; g.lineWidth = 1;
  for (let j = 0; j < MH; j++) for (let i = 0; i < MW; i++) if (ter[j][i] === 8){
    const x = i*T, y = j*T; g.beginPath(); g.moveTo(x, y + 16); g.lineTo(x + T, y + 16); g.moveTo(x + (j % 2 ? 10 : 22), y); g.lineTo(x + (j % 2 ? 10 : 22), y + 16); g.moveTo(x + (j % 2 ? 26 : 6), y + 16); g.lineTo(x + (j % 2 ? 26 : 6), y + T); g.stroke();
  }
  /* sỏi trên đường, cỏ lăn tăn */
  for (let i = 0; i < MW*MH/2.5; i++){
    const x = R()*MW*T, y = R()*MH*T, v = ter[Math.floor(y/T)][Math.floor(x/T)];
    if (v === 2 || v === 4){ g.fillStyle = R() < 0.5 ? "rgba(120,90,50,.35)" : "rgba(255,240,210,.35)"; g.beginPath(); g.ellipse(x, y, 1.5 + R()*2, 1 + R()*1.5, 0, 0, 7); g.fill(); }
  }
  g.lineWidth = 1.2; g.lineCap = "round";
  for (let i = 0; i < MW*MH; i++){
    const x = R()*MW*T, y = R()*MH*T, tj = Math.floor(y/T), ti = Math.floor(x/T);
    if (ter[tj][ti] !== 0 && ter[tj][ti] !== 5) continue;
    g.strokeStyle = R() < 0.6 ? grd : grl; g.beginPath(); g.moveTo(x, y); g.lineTo(x - 2, y - 5); g.moveTo(x, y); g.lineTo(x + 2, y - 4); g.stroke();
  }
  /* lũy tre */
  const bam = (x, y) => {
    g.lineCap = "round";
    for (let k = 0; k < 4; k++){ const bx = x + (R() - 0.5)*14, top = y - 22 - R()*18; g.strokeStyle = k % 2 ? "#7FA347" : "#5C8A2D"; g.lineWidth = 3; g.beginPath(); g.moveTo(bx, y + 10); g.quadraticCurveTo(bx + 3, (y + top)/2, bx + (R() - 0.5)*10, top); g.stroke(); }
    g.fillStyle = LEAF[se][0]; for (let k = 0; k < 6; k++){ g.beginPath(); g.ellipse(x + (R() - 0.5)*26, y - 14 - R()*22, 9, 4, R()*3, 0, 7); g.fill(); }

  };

  const lotus = (x0, y0, w, h, n) => { for (let i = 0; i < n; i++){ const x = (x0 + 0.5 + R()*(w - 1))*T, y = (y0 + 0.5 + R()*(h - 1))*T; g.fillStyle = "#4E8F2F"; g.beginPath(); g.arc(x, y, 7, 0.3, Math.PI*2 - 0.2); g.lineTo(x, y); g.fill(); if (se === 1 && R() < 0.7){ g.fillStyle = "#E58FAE"; g.beginPath(); g.ellipse(x + 3, y - 4, 3, 5, 0.3, 0, 7); g.fill(); g.beginPath(); g.ellipse(x - 1, y - 5, 3, 5, -0.3, 0, 7); g.fill(); } } };
  const paddy = (x0, y0, w, h) => { g.fillStyle = "rgba(255,255,255,.08)"; for (let c = x0 + 2; c < x0 + w; c += 3) g.fillRect(c*T + 6, y0*T, T - 12, h*T); g.strokeStyle = "rgba(60,80,30,.35)"; g.lineWidth = 2; g.strokeRect(x0*T, y0*T, w*T, h*T); };

  const hut = (h, R2) => {

    if (ngoi) bldg(g, x*T, y*T, w*T, hh*T, {wall:["#E9DDBF","#D9C8A0","#EFE4C8"][Math.floor(R2()*3)], roof:"#9E4A30", roof2:"#7A3422", ngoi:true, cong:true, cot:"#6E4823", gian:2});

  };

    g.strokeRect(2*T, 23*T, 38*T, 2*T); g.strokeRect(36*T, 10*T, 2*T, 13*T);
    g.fillStyle = "#3F6E95"; g.fillRect(0, 2.6*T, MW*T, 0.4*T);
    if (S.up.de){
      g.fillStyle = "#8B6A45"; g.fillRect(0, 3.5*T, MW*T, 1.3*T);

      for (let x = 4; x < MW*T; x += 11){ const y = 3.9*T + R()*6; g.beginPath(); g.moveTo(x, y); g.lineTo(x - 3, y - 12); g.moveTo(x, y); g.lineTo(x + 2, y - 14); g.stroke(); }

function bldg(g, X, Y, Wd, Ht, o){
  g.fillStyle = "rgba(0,0,0,.18)"; g.beginPath(); g.ellipse(X + Wd/2, Y + Ht, Wd/2 + 6, 8, 0, 0, 7); g.fill();

  if (!o.nodoor){
    const dw = Math.min(26, Wd*0.24); g.fillStyle = o.door || "#5A3A20"; g.fillRect(X + Wd/2 - dw/2, wy + wh*0.32, dw, wh*0.68);
    if (Wd > 100){
      for (const s of [-1, 1]){ const sx = X + Wd/2 + s*Wd*0.28 - 10; g.fillStyle = "#6E4823"; g.fillRect(sx, wy + wh*0.3, 20, wh*0.36); g.strokeStyle = o.wall; g.lineWidth = 1.5; g.beginPath(); for (let q = 1; q < 4; q++){ g.moveTo(sx + q*5, wy + wh*0.3); g.lineTo(sx + q*5, wy + wh*0.66); } g.stroke(); }
    }
  }
  g.fillStyle = "rgba(0,0,0,.18)"; g.fillRect(X + 6, Y + Ht - 4, Wd - 12, 4);
  const ry = Y + 2, ey = wy + 8, ov = o.small ? 4 : 8;
  g.fillStyle = o.roof; g.beginPath(); g.moveTo(X - ov, ey); g.lineTo(X + Wd*0.2, ry); g.lineTo(X + Wd*0.8, ry); g.lineTo(X + Wd + ov, ey); g.closePath(); g.fill();
  g.save(); g.clip(); g.strokeStyle = o.roof2;
  if (o.ngoi){ g.lineWidth = 1.2; for (let yy = ry + 5; yy < ey; yy += 5){ g.beginPath(); g.moveTo(X - ov, yy); g.lineTo(X + Wd + ov, yy); g.stroke(); } for (let xx = X - ov; xx < X + Wd + ov; xx += 7){ g.beginPath(); g.moveTo(xx, ry); g.lineTo(xx, ey); g.stroke(); } }
  else { g.lineWidth = 1; for (let xx = X - ov; xx < X + Wd + ov; xx += 3){ g.beginPath(); g.moveTo(xx, ry); g.lineTo(xx + (xx - X - Wd/2)*0.1, ey); g.stroke(); } g.strokeStyle = "rgba(0,0,0,.15)"; g.lineWidth = 2; g.beginPath(); g.moveTo(X - ov, (ry + ey)/2); g.lineTo(X + Wd + ov, (ry + ey)/2); g.stroke(); }
  g.restore();
  g.strokeStyle = o.roof2; g.lineWidth = 4; g.lineCap = "round"; g.beginPath(); g.moveTo(X + Wd*0.2, ry); g.lineTo(X + Wd*0.8, ry); g.stroke();
  if (o.cong){
    g.lineWidth = 3.5; g.beginPath();
    g.moveTo(X - ov, ey); g.quadraticCurveTo(X - ov - 6, ey - 4, X - ov - 4, ey - 14);
    g.moveTo(X + Wd + ov, ey); g.quadraticCurveTo(X + Wd + ov + 6, ey - 4, X + Wd + ov + 4, ey - 14);
    g.moveTo(X + Wd*0.2, ry); g.quadraticCurveTo(X + Wd*0.2 - 6, ry - 1, X + Wd*0.2 - 8, ry - 9);
    g.moveTo(X + Wd*0.8, ry); g.quadraticCurveTo(X + Wd*0.8 + 6, ry - 1, X + Wd*0.8 + 8, ry - 9);
    g.stroke();
  }
  g.strokeStyle = "rgba(0,0,0,.25)"; g.lineWidth = 2; g.beginPath(); g.moveTo(X - ov, ey); g.lineTo(X + Wd + ov, ey); g.stroke();

function shed(g, X, Y, Wd, Ht){

function pen(g){

  rail(X, Y + 4, X + Wd, Y + 4); rail(X, Y + 4, X, Y + Ht - 6); rail(X + Wd, Y + 4, X + Wd, Y + Ht - 6);
  rail(X, Y + Ht - 12, gx0, Y + Ht - 12); rail(gx1, Y + Ht - 12, X + Wd, Y + Ht - 12);
  g.fillStyle = "#5A3A20";
  for (let x = X; x <= X + Wd; x += 16){ g.fillRect(x - 2, Y - 2, 5, 18); if (x <= gx0 || x >= gx1) g.fillRect(x - 2, Y + Ht - 18, 5, 18); }
  for (let y = Y; y <= Y + Ht; y += 16){ g.fillRect(X - 2, y - 2, 5, 16); g.fillRect(X + Wd - 2, y - 2, 5, 16); }
  g.fillRect(gx0 - 4, Y + Ht - 26, 8, 26); g.fillRect(gx1 - 4, Y + Ht - 26, 8, 26);
}
function stall(g, X, Y, Wd, Ht, cloth, R){

function tree(g, x, y, s, se, R){
  g.fillStyle = "rgba(0,0,0,.2)"; g.beginPath(); g.ellipse(x, y, 16*s, 6*s, 0, 0, 7); g.fill();
  g.fillStyle = "#6E4823"; g.fillRect(x - 3*s, y - 18*s, 6*s, 18*s);
  if (s > 1.5){ g.strokeStyle = "#6E4823"; g.lineWidth = 2; for (let k = 0; k < 6; k++){ const rx = x + (R() - 0.5)*40*s; g.beginPath(); g.moveTo(rx, y - 30*s); g.lineTo(rx + (R() - 0.5)*4, y - 2); g.stroke(); } }
  const [a, b] = LEAF[se];
  g.fillStyle = a; for (let k = 0; k < 6; k++){ g.beginPath(); g.arc(x + (R() - 0.5)*24*s, y - 28*s - R()*14*s, (10 + R()*6)*s, 0, 7); g.fill(); }
  g.fillStyle = b; for (let k = 0; k < 4; k++){ g.beginPath(); g.arc(x + (R() - 0.5)*18*s, y - 34*s - R()*10*s, (6 + R()*4)*s, 0, 7); g.fill(); }
}
function cau(g, x, y, se){
  g.fillStyle = "rgba(0,0,0,.2)"; g.beginPath(); g.ellipse(x, y, 9, 4, 0, 0, 7); g.fill();
  g.strokeStyle = "#8C7A60"; g.lineWidth = 4; g.lineCap = "round"; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 3, y - 30, x + 1, y - 56); g.stroke();
  g.strokeStyle = LEAF[se][0]; g.lineWidth = 3;
  for (let k = 0; k < 8; k++){ const a = k/8*Math.PI*2; g.beginPath(); g.moveTo(x + 1, y - 56); g.quadraticCurveTo(x + 1 + Math.cos(a)*12, y - 62 + Math.sin(a)*6, x + 1 + Math.cos(a)*20, y - 52 + Math.sin(a)*8); g.stroke(); }
  g.fillStyle = "#C9A24E"; g.beginPath(); g.arc(x + 3, y - 52, 3, 0, 7); g.fill();
}

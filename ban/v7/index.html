function shade(hex, k){ const n = parseInt(hex.slice(1), 16); const f = v => Math.max(0, Math.min(255, Math.round(v*k))); return "rgb(" + f(n >> 16) + "," + f((n >> 8) & 255) + "," + f(n & 255) + ")"; }

function person(x, y, dir, ph, mv, L, g){
  const c = g || cx, s = mv ? Math.sin(ph) : 0, bob = mv ? -Math.abs(Math.cos(ph))*1.8 : 0;
  const Y = v => v >= -13.5 ? v*1.63 : v >= -25 ? -22 + (v + 13.5)*1.565 : v - 15;
  const OL = "rgba(40,24,12,.6)", SK = "#E9B98C", SKd = "#C98F62", HAIR = L.toc || "#2A2420";
  const side = dir === 1 || dir === 3, back = dir === 0, front = dir === 2;
  c.fillStyle = "rgba(0,0,0,.22)"; c.beginPath(); c.ellipse(x, y, 11, 4.2, 0, 0, 7); c.fill();
  c.save(); c.translate(x, y + bob); if (dir === 3) c.scale(-1, 1); if (L.nho) c.scale(0.8, 0.8);
  c.lineJoin = "round"; c.lineCap = "round"; c.lineWidth = 0.9; c.strokeStyle = OL;
  const fill = (col, f) => { c.fillStyle = col; c.beginPath(); f(); c.fill(); c.stroke(); };
  const arm = (sx, hx, hy, col) => { const yy = Y(hy); c.strokeStyle = OL; c.lineWidth = 5.2; c.beginPath(); c.moveTo(sx, Y(-23.2)); c.lineTo(hx, yy); c.stroke(); c.strokeStyle = col; c.lineWidth = 3.6; c.stroke(); c.lineWidth = 0.9; fill(SK, () => c.arc(hx, yy + 0.5, 2.1, 0, 7)); };
  const gui = (bx, b0, w, h0) => {
    const by = Y(b0), h = Y(b0 + h0) - by;
    fill("#A9783F", () => { if (c.roundRect) c.roundRect(bx - w/2, by, w, h, 4); else c.rect(bx - w/2, by, w, h); });
    c.strokeStyle = "rgba(90,58,28,.75)"; c.lineWidth = 0.8; c.beginPath();
    for (let yy = by + 3; yy < by + h; yy += 3){ c.moveTo(bx - w/2 + 1, yy); c.lineTo(bx + w/2 - 1, yy); }
    for (let xx = bx - w/2 + 3; xx < bx + w/2; xx += 3.5){ c.moveTo(xx, by + 1); c.lineTo(xx, by + h - 1); }
    c.stroke(); c.strokeStyle = OL; c.lineWidth = 0.9;
    fill("#7E5629", () => c.ellipse(bx, by + 0.5, w/2 + 0.6, 2.2, 0, 0, 7));
    fill("#4E8F2F", () => { c.ellipse(bx - 2, by - 1.6, 2.6, 1.6, -0.4, 0, 7); c.ellipse(bx + 2.4, by - 1.2, 2.2, 1.4, 0.4, 0, 7); });
  };

  /* Ba lô gùi tre: nhìn mặt trước thì khuất sau lưng nên vẽ trước */
  if (L.balo && front) gui(0, -26.4, 18, 12);
  if (L.balo && side) gui(-7.5, -25.6, 7, 12.5);

  /* Chân */
  if (L.vay){
    fill(L.quan, () => { c.moveTo(-6.6, Y(-13.5)); c.lineTo(6.6, Y(-13.5)); c.lineTo(8.8, Y(-2.2)); c.lineTo(-8.8, Y(-2.2)); c.closePath(); });
    fill(SK, () => { c.ellipse(-3.5 + (side ? s*2.4 : 0), Y(-1.2) - (front || back ? Math.max(0, s)*1.5 : 0), 3, 1.5, 0, 0, 7); c.ellipse(3.5 - (side ? s*2.4 : 0), Y(-1.2) - (front || back ? Math.max(0, -s)*1.5 : 0), 3, 1.5, 0, 0, 7); });
  } else if (side){
    for (const [k, col] of [[-1, shade(L.quan, 0.72)], [1, L.quan]]){
      const dx = k*s*7, lift = k*s > 0 ? 0 : Math.abs(s)*1.6;
      fill(col, () => { c.moveTo(-3.2, Y(-13.5)); c.lineTo(3.2, Y(-13.5)); c.lineTo(dx + 2.6, Y(-2.6) - lift); c.lineTo(dx - 2.6, Y(-2.6) - lift); c.closePath(); });
      fill(k > 0 ? SK : SKd, () => c.ellipse(dx + 1.4, Y(-1.1) - lift, 3.4, 1.6, 0, 0, 7));
    }
  } else {
    for (const k of [-1, 1]){
      const lift = Math.max(0, k*s)*3.4, lx = k*3.5;
      fill(L.quan, () => { const h = Y(-1.6) - lift - Y(-13.5); if (c.roundRect) c.roundRect(lx - 2.7, Y(-13.5), 5.4, h, 1.5); else c.rect(lx - 2.7, Y(-13.5), 5.4, h); });
      fill(SK, () => c.ellipse(lx, Y(-1.1) - lift, 2.9, 1.6, 0, 0, 7));
    }
  }

  /* Tay phía sau (khi đi ngang) */
  if (side) arm(-1, -s*8 - 1, -13.8, shade(L.ao, 0.75));

  /* Thân áo (áo dài tới hông) */
  const bw = side ? 5.6 : 7.8;
  fill(L.ao, () => { c.moveTo(-bw, Y(-25)); c.quadraticCurveTo(0, Y(-26.2), bw, Y(-25)); c.lineTo(bw + 1.6, Y(-10.6)); c.quadraticCurveTo(0, Y(-9.8), -bw - 1.6, Y(-10.6)); c.closePath(); });
  c.fillStyle = shade(L.ao, 0.82); c.beginPath(); c.moveTo(bw*0.35, Y(-25.4)); c.lineTo(bw, Y(-25)); c.lineTo(bw + 1.6, Y(-10.6)); c.lineTo(bw*0.35, Y(-10.2)); c.closePath(); c.fill();
  c.fillStyle = L.dai || shade(L.ao, 0.6); c.fillRect(-bw - 1.2, Y(-15.8), (bw + 1.2)*2, 2.8);
  if (front){
    fill(SK, () => { c.moveTo(-3, Y(-25.6)); c.lineTo(0, Y(-22)); c.lineTo(3, Y(-25.6)); c.closePath(); });
    c.fillStyle = shade(L.ao, 0.55); for (let k = 0; k < 4; k++){ c.beginPath(); c.arc(1.8, Y(-21.4) + k*3.2, 0.65, 0, 7); c.fill(); }
  } else if (back){
    c.strokeStyle = shade(L.ao, 0.65); c.beginPath(); c.moveTo(0, Y(-25)); c.lineTo(0, Y(-16)); c.stroke(); c.strokeStyle = OL;
  }
  /* Ba lô nhìn từ sau lưng: che gần hết lưng */
  if (L.balo && back) gui(0, -25.8, 16, 13);
  if (L.balo && front){ c.strokeStyle = "#6E4823"; c.lineWidth = 1.8; c.beginPath(); c.moveTo(-4.8, Y(-25)); c.lineTo(-4.3, Y(-15.8)); c.moveTo(4.8, Y(-25)); c.lineTo(4.3, Y(-15.8)); c.stroke(); c.lineWidth = 0.9; c.strokeStyle = OL; }
  if (L.balo && side){ c.strokeStyle = "#6E4823"; c.lineWidth = 1.8; c.beginPath(); c.moveTo(-3.8, Y(-25)); c.quadraticCurveTo(3.4, Y(-21), -2, Y(-15.8)); c.stroke(); c.lineWidth = 0.9; c.strokeStyle = OL; }

  /* Tay */
  if (side) arm(1, s*8 + 1, -13.8, L.ao);
  else { arm(-bw + 0.4, -bw - 1.8, -13.2 + s*2.6, shade(L.ao, back ? 0.85 : 1)); arm(bw - 0.4, bw + 1.8, -13.2 - s*2.6, shade(L.ao, 0.85)); }
  /* Ngọn giáo của lính tuần */
  if (L.giao){
    const gx = side ? s*8 + 2 : bw + 1.8, top = Y(-25) - 34;
    c.strokeStyle = "#6E4823"; c.lineWidth = 1.8; c.beginPath(); c.moveTo(gx, Y(-1)); c.lineTo(gx, top); c.stroke();
    c.lineWidth = 0.9; c.strokeStyle = OL; fill("#C9CED6", () => { c.moveTo(gx - 2.2, top + 1); c.lineTo(gx, top - 8); c.lineTo(gx + 2.2, top + 1); c.closePath(); });
    c.fillStyle = "#B23A28"; c.beginPath(); c.moveTo(gx - 2.6, top + 1.5); c.lineTo(gx + 2.6, top + 1.5); c.lineTo(gx + 1.5, top + 6); c.lineTo(gx - 1.5, top + 6); c.closePath(); c.fill();
  }

  /* Đầu */
  fill(SKd, () => c.rect(-2, Y(-26.6), 4, 2.6));
  const hx = side ? 0.8 : 0, HY = Y(-30.5);
  fill(SK, () => c.arc(hx, HY, 6.4, 0, 7));
  if (L.hat !== "troc"){
    c.fillStyle = HAIR;
    if (back){ c.beginPath(); c.arc(0, HY, 6.1, 0, 7); c.fill(); }
    else if (side){ c.beginPath(); c.arc(hx, HY, 6.2, Math.PI*0.55, Math.PI*1.55); c.fill(); }
    else { c.beginPath(); c.arc(0, HY - 1, 6.2, Math.PI*1.05, Math.PI*1.95); c.fill(); }
  } else if (back){ c.fillStyle = SKd; c.beginPath(); c.arc(0, HY, 5.8, 0, 7); c.fill(); }
  if (front){
    c.fillStyle = "#1D1A14"; c.beginPath(); c.ellipse(-2.3, HY + 0.5, 0.95, 1.25, 0, 0, 7); c.ellipse(2.3, HY + 0.5, 0.95, 1.25, 0, 0, 7); c.fill();
    c.fillStyle = "rgba(222,110,90,.35)"; c.beginPath(); c.arc(-3.9, HY + 2.4, 1.3, 0, 7); c.arc(3.9, HY + 2.4, 1.3, 0, 7); c.fill();
    c.strokeStyle = "#8C4A32"; c.lineWidth = 0.8; c.beginPath(); c.arc(0, HY + 2.8, 1.3, 0.2, Math.PI - 0.2); c.stroke(); c.strokeStyle = OL; c.lineWidth = 0.9;
  } else if (side){
    fill(SK, () => c.arc(hx + 6.2, HY + 0.9, 1.4, -1.2, 1.6));
    c.fillStyle = "#1D1A14"; c.beginPath(); c.ellipse(hx + 3.3, HY - 0.1, 0.9, 1.2, 0, 0, 7); c.fill();
    fill(SKd, () => c.arc(hx - 1.6, HY + 0.7, 1.5, 0, 7));
    c.strokeStyle = "#8C4A32"; c.lineWidth = 0.8; c.beginPath(); c.moveTo(hx + 3.7, HY + 3); c.lineTo(hx + 5.3, HY + 2.8); c.stroke(); c.strokeStyle = OL; c.lineWidth = 0.9;
  }

  /* Mũ */
  const ax = side ? 1.5 : 0;
  if (L.hat === "non"){
    const cy = HY - 2.5, top = HY - 15.5;
    fill("#E8D08F", () => { c.moveTo(-15, cy); c.lineTo(ax, top); c.lineTo(15, cy); c.quadraticCurveTo(0, cy + 3.6, -15, cy); });
    c.fillStyle = "#CDB06A"; c.beginPath(); c.moveTo(ax, top); c.lineTo(15, cy); c.quadraticCurveTo(7, cy + 2.6, ax + 2, cy + 1.6); c.closePath(); c.fill();
    c.strokeStyle = "rgba(150,115,50,.8)"; c.lineWidth = 0.7; c.beginPath();
    for (const t of [0.35, 0.6, 0.82]){ const yy = top + (cy + 1.6 - top)*t, w = 15*t; c.moveTo(ax - w, yy); c.quadraticCurveTo(ax, yy + 2*t, ax + w, yy); }
    c.stroke();
    if (front){ c.strokeStyle = "#9A3324"; c.lineWidth = 0.8; c.beginPath(); c.moveTo(-5.5, HY - 1); c.quadraticCurveTo(0, HY + 7.5, 5.5, HY - 1); c.stroke(); }
    c.strokeStyle = OL; c.lineWidth = 0.9;
  } else if (L.hat === "khan"){
    fill("#1E1A16", () => c.ellipse(hx, HY - 4.7, side ? 6.8 : 7.6, 3.8, 0, 0, 7));
    c.strokeStyle = "#4A4038"; c.lineWidth = 0.7; c.beginPath(); c.moveTo(hx - 6.3, HY - 5.1); c.quadraticCurveTo(hx, HY - 3.1, hx + 6.3, HY - 5.1); c.moveTo(hx - 5.8, HY - 6.3); c.quadraticCurveTo(hx, HY - 4.5, hx + 5.8, HY - 6.3); c.stroke(); c.strokeStyle = OL; c.lineWidth = 0.9;
  } else if (L.hat === "toc"){
    fill(HAIR, () => c.arc(side ? hx - 3 : 0, back ? HY - 2.5 : HY - 6.9, 3.2, 0, 7));
  } else if (L.hat === "linh"){
    /* nón dấu của lính: chóp nhỏ sơn đen, núm đỏ, quai dưới cằm */
    const cy = HY - 3.2;
    fill("#2A2018", () => { c.moveTo(-9.5, cy); c.lineTo(ax, cy - 9); c.lineTo(9.5, cy); c.quadraticCurveTo(0, cy + 2.4, -9.5, cy); });
    c.fillStyle = "#B23A28"; c.beginPath(); c.arc(ax, cy - 9.6, 2, 0, 7); c.fill();
    if (front){ c.strokeStyle = "#B23A28"; c.lineWidth = 0.8; c.beginPath(); c.moveTo(-5, HY - 1); c.quadraticCurveTo(0, HY + 7, 5, HY - 1); c.stroke(); }
    c.strokeStyle = OL; c.lineWidth = 0.9;
  } else if (L.hat === "mao"){
    /* mũ cánh chuồn của quan */
    fill("#16141A", () => c.ellipse(hx, HY - 5, side ? 6.4 : 7, 4.4, 0, Math.PI, 0));
    fill("#16141A", () => c.rect(hx - (side ? 6.4 : 7), HY - 5, (side ? 6.4 : 7)*2, 2.4));
    if (!side){ fill("#16141A", () => { c.ellipse(-11.5, HY - 5.4, 5, 1.6, -0.15, 0, 7); }); fill("#16141A", () => { c.ellipse(11.5, HY - 5.4, 5, 1.6, 0.15, 0, 7); }); }
    else fill("#16141A", () => c.ellipse(hx - 9, HY - 5.6, 4.6, 1.5, 0.2, 0, 7));
    c.fillStyle = "#E3B53C"; c.fillRect(hx - 1.2, HY - 7.6, 2.4, 2);
  }
  c.restore();
}
/* Chân dung nhỏ trong hộp thoại và sổ quan hệ */
function drawPortraits(root){
  root.querySelectorAll("canvas.pt[data-npc]").forEach(el => {
    const n = NPCS.find(x => x.id === el.dataset.npc); if (!n) return;
    const g = el.getContext("2d"), k = el.width/36;
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, el.width, el.height);
    g.fillStyle = n.bgc || "#D9C8A0"; g.beginPath(); g.arc(el.width/2, el.height/2, el.width/2, 0, 7); g.fill();
    g.save(); g.beginPath(); g.arc(el.width/2, el.height/2, el.width/2, 0, 7); g.clip();
    g.setTransform(k, 0, 0, k, 18*k, (n.look.nho ? 51 : 63)*k); person(0, 0, 2, 0, false, n.look, g);
    g.restore();
  });
}

/* ---------- Tự tìm đường khi chạm vào bản đồ ---------- */
let route = null, tapMark = null;
function nearestFree(px, py){
  const ti = Math.floor(px/T), tj = Math.floor(py/T); let best = null, bd = 1e9;
  for (let j = tj - 4; j <= tj + 4; j++) for (let i = ti - 4; i <= ti + 4; i++){
    if (i < 0 || j < 0 || i >= MW || j >= MH || solid[j][i]) continue;
    const d = Math.hypot((i + 0.5)*T - px, (j + 0.5)*T - py); if (d < bd){ bd = d; best = [i, j]; }
  }
  return best;
}
function bfs(si, sj, gi, gj){
  const N = MW*MH, prev = new Int32Array(N).fill(-1), q = new Int32Array(N); let h = 0, t = 0;
  const s = sj*MW + si, goal = gj*MW + gi; q[t++] = s; prev[s] = s;
  while (h < t){
    const c = q[h++]; if (c === goal) break;
    const ci = c % MW, cj = (c - ci)/MW;
    for (const [di, dj] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const ni = ci + di, nj = cj + dj; if (ni < 0 || nj < 0 || ni >= MW || nj >= MH || solid[nj][ni]) continue;
      const n = nj*MW + ni; if (prev[n] !== -1) continue; prev[n] = c; q[t++] = n;
    }
  }
  if (prev[goal] === -1) return null;
  const pts = []; for (let c = goal; c !== s; c = prev[c]){ const ci = c % MW; pts.push([(ci + 0.5)*T, ((c - ci)/MW + 0.5)*T + 6]); }
  return pts.reverse();
}

function walkTo(px, py, target){
  const goal = nearestFree(px, py); if (!goal){ route = null; return; }
  const pts = bfs(Math.floor(P.x/T), Math.floor((P.y - 3)/T), goal[0], goal[1]);
  if (!pts){ route = null; toast("Không có lối đi tới đó."); return; }
  if (!hitBox(px, py)) pts.push([px, py]);
  route = {pts, target, stuck:0};
}
function goWorld(wx, wy){
  const L = interacts(); let hit = null;
  for (const it of L){ const [x, y, w, h] = it.r; if (wx >= x - 6 && wx <= x + w + 6 && wy >= y - 6 && wy <= y + h + 6){ hit = it; if (it.npc) break; } }
  if (!hit) for (const k in PLACES){ const p = PLACES[k]; if (wx >= p.x*T && wx <= (p.x + p.w)*T && wy >= p.y*T - T && wy <= (p.y + p.h)*T){ hit = L.find(it => it.id === k); break; } }
  tapMark = {x:wx, y:wy, t:performance.now()};
  pendingGo = null;
  if (hit){
    if (focus && focus.id === hit.id){ route = null; hit.go(); return; }
    if (hit.foot) walkTo(hit.foot[0], hit.foot[1], hit.id);
    else { const [x, y, w, h] = hit.r; walkTo(x + w/2, y + h/2, hit.id); }
  } else walkTo(wx, wy, null);
}
function goPlace(k){
  const nn = k.startsWith("npc:") && NPCS.find(x => x.id === k.slice(4));
  const m = nn ? nn.map : PLACE_MAP[k]; if (!m) return;
  if (nn && m === S.map){ walkTo(nn.x, nn.y + 24, "npc_" + nn.id); return; }
  if (m !== S.map){
    const dir = ORDER.indexOf(m) > ORDER.indexOf(S.map) ? 1 : -1, ex = EXITS.find(e => e.dir === dir);
    pendingGo = k; walkTo((ex.r[0] + 0.5)*T, (ex.r[1] + 1)*T, "exit");
    toast("Đang đi tới " + (nn ? nn.n : ALLPLACES[k].n) + " ở " + MAPS[m].n + "."); return;
  }
  const d = PLACES[k].door; walkTo((d[0] + d[2]/2)*T, (d[1] + d[3]/2)*T, k);
}

const MOVE = {KeyW:[0,-1], ArrowUp:[0,-1], KeyS:[0,1], ArrowDown:[0,1], KeyA:[-1,0], ArrowLeft:[-1,0], KeyD:[1,0], ArrowRight:[1,0]};

/* ---------- Cập nhật mỗi khung hình ---------- */
let focus = null, walked = 0, lastLab = null, saveT = 0, hintT = 0, tAcc = 0, lastClock = "", lastNight = -1;
function update(dt){
  const free = modal.hidden && !switching;
  /* Đồng hồ: 1 phút trong game = 0,6 giây thật, chỉ chạy khi không mở bảng nào */
  if (free){
    tAcc += dt;
    while (tAcc >= 0.6){ tAcc -= 0.6; S.time++; }
    if (S.time >= 1320 && S.nw !== S.day){ S.nw = S.day; toast("Đã 22 giờ đêm. Về nhà ngủ đi, quá 24 giờ anh sẽ kiệt sức mà ngất.", "warn"); }
    if (S.time >= 1440){ S.time = 1440; toast("Quá nửa đêm, anh kiệt sức ngất đi...", "warn"); doSleep({faint:true}); return; }
    const night = S.time >= 1110 ? 1 : 0;
    if (night !== lastNight){ lastNight = night; render(); }
  }
  const ct = clockText(); if (ct !== lastClock){ lastClock = ct; const el = document.getElementById("clock"); if (el) el.textContent = ct; }
  let mx = 0, my = 0;
  if (free){
    for (const c of held){ const v = MOVE[c]; mx += v[0]; my += v[1]; }
    if (ptr && ptr.joy){ let jx = (ptr.x - ptr.sx)/42, jy = (ptr.y - ptr.sy)/42; const l = Math.hypot(jx, jy); if (l > 1){ jx /= l; jy /= l; } mx += jx; my += jy; }
  }
  if (mx || my){ route = null; pendingGo = null; if (FISH){ FISH = null; toast("Thu cần câu."); } }
  else if (route && free){
    const wp = route.pts[0];
    if (!wp) route = null;
    else { const dx = wp[0] - P.x, dy = wp[1] - P.y, d = Math.hypot(dx, dy); if (d < 3){ route.pts.shift(); if (!route.pts.length && !route.target) route = null; } else { mx = dx/d; my = dy/d; } }
  }
  let l = Math.hypot(mx, my); if (l > 1){ mx /= l; my /= l; l = 1; }
  P.mv = false;
  if (l > 0.12 && free){
    const sp = 150*dt*(l < 0.5 ? 0.6 : 1), ox = P.x, oy = P.y;
    tryMove(P, mx*sp, my*sp);
    const moved = Math.hypot(P.x - ox, P.y - oy);
    walked += moved;
    if (route){ route.stuck = moved < sp*0.2 ? route.stuck + dt : 0; if (route.stuck > 0.6) route = null; }
    P.mv = moved > 0.1; P.ph += dt*10;
    P.dir = Math.abs(mx) > Math.abs(my) ? (mx > 0 ? 1 : 3) : (my > 0 ? 2 : 0);
  }
  /* Bước vào lối ra ở mép bản đồ thì sang vùng bên cạnh */
  if (free) for (const e of EXITS){ const [x, y, w, h] = e.r; if (P.x >= x*T && P.x <= (x + w)*T && P.y >= y*T && P.y <= (y + h)*T + 6){ switchMap(e.to, e.at); return; } }
  focus = pickFocus();
  if (route && route.target && focus && focus.id === route.target && free){ const f = focus; route = null; f.go(); }
  if (route && !route.pts.length) route = null;
  NPCS.forEach(n => { if (n.map !== S.map) return; updNpc(n, dt);
    /* người quen thấy anh đi qua thì vẫy chào; lính tuần nhắc về nhà khi khuya */
    if (npcVisible(n) && Math.hypot(n.x - P.x, n.y - P.y) < 64){
      if (S.talked[n.id] && n.seen !== S.day && !n.emo){ n.seen = S.day; const r = S.rel[n.id]; emo(n, r && r.mad === S.day ? "gian" : heartsOf(n.id) >= 5 ? "tim" : "vui"); }
      if (n.patrol && S.time >= 1260 && S.sw !== S.day){ S.sw = S.day; emo(n, "gian"); toast(n.n + ": “Khuya rồi, anh về nhà nghỉ đi!”"); }
    }
  });
  updHerd(dt); updCat(dt); updFx(dt);
  if (P.anim){ P.anim.t -= dt; if (P.anim.t <= 0) P.anim = null; }
  if (FISH && free){
    FISH.t += dt;
    if (FISH.phase === "wait" && FISH.t >= FISH.bite){ FISH.phase = "bite"; FISH.t = 0; RLA.sfx("tap"); }
    else if (FISH.phase === "bite" && FISH.t > 1.1){ FISH = null; toast("Cá ăn mồi rồi chạy mất. Bấm Làm để thả câu lại."); }
  }
  if (arrestPending && free) showArrest();
  if (free && S.map !== "nha" && S.time >= 1380 && S.cf !== S.day && NPCS.some(n => n.patrol && npcVisible(n) && Math.hypot(n.x - P.x, n.y - P.y) < 140)){ S.cf = S.day; addToi(10, "đi đêm quá giờ giới nghiêm, bị lính tuần bắt gặp"); save(); render(); }
  if (modal.hidden) talking = null;
  const lab = focus ? focus.lab : "";
  if (lab !== lastLab){
    lastLab = lab;
    actBtn.innerHTML = `<b>Làm${coarse ? "" : " (E)"}</b><small>${lab ? esc(lab) : "Đến gần chỗ cần làm"}</small>`;
    actBtn.classList.toggle("idle", !lab);
  }
  S.pos = [Math.round(P.x), Math.round(P.y)];
  saveT += dt; if (saveT > 5){ saveT = 0; save(); }
  hintT += dt; if ((walked > 400 || hintT > 25) && !hintEl.classList.contains("gone")) hintEl.classList.add("gone");
}

    FLAGS.forEach((f, i) => { const x = (f[0] + 0.5)*T + 2, y = (f[1] + 0.9)*T - 86; cx.fillStyle = i ? "#B23A28" : "#E3B53C"; cx.beginPath(); cx.moveTo(x, y); for (let q = 0; q <= 6; q++){ cx.lineTo(x + q*5, y + Math.sin(t*4 + q*0.9 + i)*2.2); } for (let q = 6; q >= 0; q--){ cx.lineTo(x + q*5, y + 16 - q*0.8 + Math.sin(t*4 + q*0.9 + i)*2.2); } cx.closePath(); cx.fill(); });
  }
  if (focus && focus.plot !== undefined){ const [x, y, w, h] = focus.r; cx.setLineDash([6, 4]); cx.strokeStyle = "#fff"; cx.lineWidth = 2; rr(cx, x - 3, y - 3, w + 6, h + 6, 8); cx.stroke(); cx.setLineDash([]); }
  if (tapMark){ const a = (performance.now() - tapMark.t)/500; if (a > 1) tapMark = null; else { cx.strokeStyle = `rgba(255,255,255,${1 - a})`; cx.lineWidth = 2; cx.beginPath(); cx.ellipse(tapMark.x, tapMark.y, 6 + a*14, 3 + a*7, 0, 0, 7); cx.stroke(); } }
  if (route && route.pts.length){ const e = route.pts[route.pts.length - 1]; cx.fillStyle = "rgba(255,255,255,.7)"; cx.beginPath(); cx.ellipse(e[0], e[1], 5, 2.5, 0, 0, 7); cx.fill(); }
  /* lối sang vùng khác nhấp nháy */
  EXITS.forEach(e => { const [x, y, w, h] = e.r; cx.fillStyle = `rgba(255,236,170,${0.25 + 0.2*Math.sin(t*3)})`; cx.fillRect(x*T, y*T, w*T, h*T); });
  const sp = [];
  if (S.map === "nha"){
    const AS = {ga:24, lon:34, trau:44};
    herd.forEach((h, i) => { const a = S.animals[i]; if (!a) return; sp.push([h.y, () => {
      const s = AS[a.t]; cx.fillStyle = "rgba(0,0,0,.18)"; cx.beginPath(); cx.ellipse(h.x, h.y, s*0.36, s*0.12, 0, 0, 7); cx.fill();
      img(a.t, h.x, h.y - s*0.42 - (h.mv ? Math.abs(Math.sin(t*10))*1.5 : 0), s, h.fl);
      if (a.h > 0){ cx.fillStyle = "#B23A28"; cx.beginPath(); cx.arc(h.x, h.y - s - 4, 6, 0, 7); cx.fill(); cx.fillStyle = "#fff"; cx.font = "700 9px sans-serif"; cx.textAlign = "center"; cx.textBaseline = "middle"; cx.fillText("!", h.x, h.y - s - 3.5); }
    }]); });
    if (S.up.cho) sp.push([DOG.y, () => { cx.fillStyle = "rgba(0,0,0,.18)"; cx.beginPath(); cx.ellipse(DOG.x, DOG.y, 9, 3, 0, 0, 7); cx.fill(); img("cho", DOG.x, DOG.y - 11 - (DOG.mv ? Math.abs(Math.sin(t*14))*2 : 0), 26, DOG.fl); }]);
    if (S.cat) sp.push([CAT.y, () => { drawCat(CAT.x, CAT.y, CAT.fl, CAT.mv, t, CAT.sit); if (CAT.emo) drawEmo(CAT.x + 6, CAT.y - 24, CAT.emo); }]);
  }
  NPCS.forEach(n => { if (npcVisible(n)) sp.push([n.y, () => { person(n.x, n.y, n.dir, n.ph, n.mv, n.look); if (n.emo) drawEmo(n.x, n.y - (n.look.nho ? 54 : 68), n.emo); }]); });
  sp.push([P.y, () => { const back = P.anim && P.dir === 0; if (back) drawTool(); person(P.x, P.y, P.dir, P.ph, P.mv, LOOK_ME); if (!back) drawTool(); }]);
  sp.sort((a, b) => a[0] - b[0]).forEach(s => s[1]());
  drawFx(); if (FISH) drawFish(t);
  /* Lớp màu theo giờ: bình minh, hoàng hôn, đêm tối có quầng sáng quanh người; mùa Đông se lạnh, nắng hạn vàng gắt */
  const hr = S.time/60, dark = hr < 7 ? (7 - hr)*0.22 : Math.max(0, Math.min(1, (hr - 18)/3))*0.66, dusk = Math.max(0, 1 - Math.abs(hr - 18)/1.6)*0.2;
  if (dark > 0.02){
    cx.globalCompositeOperation = "lighter";
    const glow = (wx, wy, r, a) => { const gr = cx.createRadialGradient(wx, wy, 0, wx, wy, r); gr.addColorStop(0, `rgba(255,190,90,${a})`); gr.addColorStop(1, "rgba(255,190,90,0)"); cx.fillStyle = gr; cx.fillRect(wx - r, wy - r, 2*r, 2*r); };
    for (const key in PLACES){ const d = PLACES[key].door; glow((d[0] + d[2]/2)*T, d[1]*T - 8, 70, 0.32*dark); }
    HUTS.forEach(h => glow((h[0] + h[2]/2)*T, (h[1] + h[3])*T - 10, 46, 0.22*dark));
    NPCS.forEach(n => { if (n.patrol && npcVisible(n)) glow(n.x + 10, n.y - 30, 60, 0.5*dark); });
    cx.globalCompositeOperation = "source-over";
  }
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const se = seasonOf(S.day);
  if (se === 3){ cx.fillStyle = "rgba(120,150,200,.10)"; cx.fillRect(0, 0, W, H); }
  if (S.ev && S.ev.id === "han"){ cx.fillStyle = "rgba(255,170,60,.12)"; cx.fillRect(0, 0, W, H); }
  if (dusk > 0.01){ cx.fillStyle = `rgba(255,120,50,${dusk})`; cx.fillRect(0, 0, W, H); }
  if (dark > 0.02){
    const px = (P.x - camX)*zoom, py = (P.y - 30 - camY)*zoom, gr = cx.createRadialGradient(px, py, 50*zoom, px, py, 230*zoom);
    gr.addColorStop(0, `rgba(14,18,46,${dark*0.35})`); gr.addColorStop(1, `rgba(14,18,46,${dark})`);
    cx.fillStyle = gr; cx.fillRect(0, 0, W, H);
  }
  if (S.ev && S.ev.id === "mua"){
    cx.strokeStyle = "rgba(210,225,255,.5)"; cx.lineWidth = 1.2; cx.beginPath();
    for (let i = 0; i < 90; i++){ const rx = ((i*97.3 + t*60) % (W + 40)) - 20, ry = ((i*53.1 + t*520) % (H + 40)) - 20; cx.moveTo(rx, ry); cx.lineTo(rx - 4, ry + 12); }
    cx.stroke();
  }
  /* Tên các nơi */
  const toS = (wx, wy) => [(wx - camX)*zoom, (wy - camY)*zoom];
  for (const key in PLACES){ const p = PLACES[key]; if (key === "gieng") continue; const [lx, ly] = toS((p.x + p.w/2)*T, p.y*T - (key === "chua" ? 26 : key === "phu" ? 32 : 6)); if (lx > -80 && lx < W + 80 && ly > -20 && ly < H + 20) labelAt(p.n + (isOpen(key) ? "" : " · đóng cửa"), lx, ly); }
  for (const [n, x, y] of M.labels){ const [lx, ly] = toS(x*T, y*T); if (lx > -80 && lx < W + 80 && ly > -20 && ly < H + 20) labelAt(n, lx, ly); }
  if (focus && modal.hidden){ const [bx, by] = toS(P.x, P.y - 80); labelAt((coarse ? "" : "E · ") + focus.lab, bx, by, true); }
}

let lastT = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - lastT)/1000); lastT = now;
  if (S && W > 0 && !document.hidden){ try { update(dt); draw(now/1000); } catch(e){ console.error(e); } }
  requestAnimationFrame(frame);
}


/* ---------- Bản đồ vùng đang đứng và đường sang các vùng khác ---------- */
function showMap(){
  if (!S) return;
  ensureBg();
  const groups = ORDER.map(id => `<div class="mapgrp${id === S.map ? " here" : ""}"><b>${esc(MAPS[id].n)}${id === S.map ? " · anh đang ở đây" : ""}</b><div class="places">${Object.keys(MAPS[id].places).map(k => `<button class="btn s" data-act="goto" data-place="${k}">${MAPS[id].places[k].n}</button>`).join("")}</div></div>`).join(`<span class="maparrow" aria-hidden="true">⇄</span>`);
  openModal(`<h2>Bản đồ · ${esc(MAPS[S.map].n)}</h2><p class="note">Chạm vào bản đồ hoặc tên một nơi, nhân vật sẽ tự đi tới đó, kể cả sang vùng khác. Chấm đỏ là anh đang đứng. Xóm Bãi nối với làng Dâu, làng Dâu nối với phủ Thiên Đức bằng đường cái.</p>
   <canvas id="mapcv" class="mapcv" width="${MW*12}" height="${MH*12}" data-act="mapgo" aria-label="Bản đồ ${esc(MAPS[S.map].n)}"></canvas>
   <div class="mapgrps">${groups}</div>
   <div class="acts"><button class="btn p" data-act="close">Đóng</button></div>`);
  sheet.classList.add("wide");
  const mc = document.getElementById("mapcv"), g = mc.getContext("2d"), s = 12/T;
  g.drawImage(bg, 0, 0, mc.width, mc.height);
  g.font = "600 13px 'Be Vietnam Pro',sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  for (const k in PLACES){ const p = PLACES[k], x = (p.x + p.w/2)*T*s, y = (p.y + p.h/2)*T*s, w = g.measureText(p.n).width + 12; g.fillStyle = "rgba(33,38,26,.78)"; rr(g, x - w/2, y - 10, w, 20, 10); g.fill(); g.fillStyle = "#fff"; g.fillText(p.n, x, y + 0.5); }
  EXITS.forEach(e => { const lab = "→ " + MAPS[e.to].n, x = Math.min(mc.width - 70, Math.max(70, (e.r[0] + 0.5)*T*s)), y = (e.r[1] + 1)*T*s - 18, w = g.measureText(lab).width + 12; g.fillStyle = "rgba(178,58,40,.9)"; rr(g, x - w/2, y - 10, w, 20, 10); g.fill(); g.fillStyle = "#fff"; g.fillText(lab, x, y + 0.5); });
  if (S.map === "nha") for (let i = 0; i < 16; i++){ const [x, y, w, h] = plotRect(i), p = S.plots[i]; g.fillStyle = !p ? "rgba(60,80,30,.35)" : p.c && p.a >= CROPS[p.c].days ? "#E3B53C" : p.c ? "#5E8A35" : "#8B6A45"; g.fillRect(x*s, y*s, w*s, h*s); }
  g.fillStyle = "#B23A28"; g.strokeStyle = "#fff"; g.lineWidth = 3; g.beginPath(); g.arc(P.x*s, P.y*s, 8, 0, 7); g.stroke(); g.fill();
}

/* ===== Sự kiện chạm, bấm ===== */
document.addEventListener("click", e => {
  if (e.target === modal && !modalLock){ closeModal(); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const d = el.dataset;
  switch (d.act){
    case "do": doAct(); break;
    case "nv": openPanel("nv"); break;
    case "tui": openPanel("tui"); break;
    case "quanhe": openPanel("quanhe"); break;
    case "claim": claimQuest(d.id); break;
    case "hold": holdSeed(d.c); break;
    case "eat": eatGood(d.g); break;
    case "map": showMap(); break;
    case "goto": closeModal(); goPlace(d.place); break;
    case "mapgo": { const r = el.getBoundingClientRect(); const wx = (e.clientX - r.left)/r.width*MW*T, wy = (e.clientY - r.top)/r.height*MH*T; closeModal(); goWorld(wx, wy); break; }
    case "news": newsOpen = !newsOpen; render(); break;
    case "chat": if (talking) showTalk(talking, nextLine(talking), ""); break;
    case "tip": talkTip(); break;
    case "giftmenu": giftMenu(); break;
    case "gift": giveGift(d.g); break;
    case "talkback": if (talking) showTalk(talking, nextLine(talking), ""); break;
    case "npcpanel": if (talking){ const k = talking.panel; if (HOURS[k] && !isOpen(k)){ closeModal(); enterPlace(k); } else openPanel(k); } break;
    case "buycat": buyCat(); break;
    case "tool": pickTool(d.k); break;
    case "gian": S.gian = el.checked; save(); toast(S.gian ? "Đang cân điêu: bán đắt hơn nhưng dễ bị bắt quả tang." : "Đã thôi cân điêu, buôn bán thật thà."); break;
    case "totinh": toTinh(); break;
    case "cauhon": cauHon(); break;
    case "trom": doTrom(); break;
    case "jail": doJail(); break;
    case "chuoc": chuocToi(); break;
    case "ship": shipGood(d.g, false); break;
    case "shipall": shipGood(d.g, true); break;
    case "unship": unship(); break;
    case "duhoi": duHoi(); break;
    case "che": if (S.che !== S.day && S.money >= 3){ S.money -= 3; S.che = S.day; S.suc = Math.min(MAXS, S.suc + 3); RLA.sfx("mua"); toast("Bát chè xanh nóng, hồi 3 sức."); commit(); } else if (S.money < 3) toast("Không đủ tiền.", "warn"); break;
    case "com": if (S.com !== S.day && S.money >= 15){ S.money -= 15; S.com = S.day; S.suc = Math.min(MAXS, S.suc + 8); RLA.sfx("mua"); toast("Mâm cơm trọ nóng hổi, hồi 8 sức."); commit(); } else if (S.money < 15) toast("Không đủ tiền.", "warn"); break;
    case "buyg": buyThing(d.g, +d.n, +d.p); break;
    case "dangthoc": dangThoc(); break;
    case "sellh": sellTran(d.g, false); break;
    case "sellhall": sellTran(d.g, true); break;
    case "sleeptro": if (S.money >= 20){ S.money -= 20; doSleep({at:{map:"tran", x:44*T, y:28.4*T}}); } break;
    case "asksleep": askSleep(); break;
    case "plot": tapPlot(+d.i); break;
    case "plant": plant(+d.i, d.c); break;
    case "early": harvest(+d.i, false, true); break;
    case "order": fillOrder(+d.i); break;
    case "waterall": waterAll(); break;
    case "harvestall": harvestAll(); break;
    case "sleep": doSleep(); break;
    case "sell": sellGood(d.g, false); break;
    case "sellall": sellGood(d.g, true); break;
    case "buyseed": buySeed(d.c, +d.n); break;
    case "buyrom": buyRom(+d.n); break;
    case "buyanimal": buyAnimal(d.t); break;
    case "sellanimal": sellAnimal(+d.i); break;
    case "upg": buyUpg(d.id); break;
    case "buyplot": closeModal(); buyPlot(); break;
    case "help": showHelp(); break;
    case "credits": showCredits(); break;
    case "amthanh": showSound(); break;
    case "snd": if (d.k === "nhac") RLA.music.set(el.checked); else RLA.setSfx(el.checked); render(); break;
    case "closehelp": S.seenHelp = S.seenHelp4 = S.seenHelp5 = S.seenHelp6 = S.seenHelp7 = true; save(); closeModal(); break;
    case "close": closeModal(); break;
    case "reset": showReset(); break;
    case "doreset": S = fresh(); NPCS.forEach(n => { Object.assign(n, n.id0); n.x = n.hx*T; n.y = n.hy*T; n.tx = n.x; n.ty = n.y; }); FISH = null; arrestPending = false; migrate(); genOrders(); loadMap("nha"); P.x = HOME[0]; P.y = HOME[1]; route = null; pendingGo = null; herd = []; save(); closeModal(); render(); showHelp(); break;
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !modal.hidden) closeModal(); });

/* Ván cũ từ bản 5 trở về trước: chuyển sang bản đồ ba vùng, thêm giờ giấc và tình cảm */
function migrate(){
  if (!MAPS[S.map]){ S.map = "nha"; S.pos = null; }
  if (typeof S.time !== "number") S.time = 360;
  S.rel = S.rel || {}; S.known = S.known || {}; S.talked = S.talked || {};
  const OLD = {"Cu Tí chăn trâu":"ti", "Bà Hương bán hàng":"huong", "Thầy đồ Chu":"chu", "Sư bác chùa Dâu":"su"};
  for (const k in OLD) if (S.talked[k]){ S.talked[OLD[k]] = 1; delete S.talked[k]; }
  for (const p of S.plots) if (p.t === undefined) p.t = true;
  if (typeof S.water !== "number") S.water = 8;
  S.tool = S.tool || "cuoc"; S.toi = S.toi || 0; S.ship = S.ship || {};
  if (S.spouse) applySpouse();
}
function start(data){
  S = (data && data.S && data.S.v === 2 && data.S) || load() || fresh();
  migrate();
  if (!S.orders.length && S.day === 1) genOrders();
  loadMap(S.map);
  if (Array.isArray(S.pos) && !hitBox(S.pos[0], S.pos[1])){ P.x = S.pos[0]; P.y = S.pos[1]; }
  else if (S.map !== "nha"){ const ex = EXITS[0]; P.x = (ex.r[0] + (ex.dir > 0 ? -1.5 : 2.5))*T; P.y = (ex.r[1] + 0.6)*T; }
  if (S.cat && S.map === "nha") placeCat();
  hintEl.textContent = coarse
    ? "Kéo ngón tay trên bản đồ để đi, hoặc chạm vào chỗ muốn đến. Tới gần thửa ruộng, người hay nơi nào thì bấm nút Làm, đồ nghề tự đổi theo việc."
    : "Đi: phím W A S D hoặc mũi tên, hoặc bấm chuột vào chỗ muốn đến. Làm việc, trò chuyện: phím E. Đồ nghề: 1 đến 5 · Bản đồ: M · Nhiệm vụ: Q · Túi đồ: I · Quan hệ: R.";
  hintEl.classList.toggle("coarse", coarse);
  ensureQuests();
  joyRest();
  render();
  if (!S.seenHelp7) showHelp(); else showBanner(MAPS[S.map]);
  requestAnimationFrame(frame);
}
/* Chỉ dùng khi chạy thử máy: thêm ?thu=1 vào đường dẫn */
if (/[?&]thu=1/.test(location.search)) window.__rl = {get S(){ return S; }, get FISH(){ return FISH; }, P, NPCS, CAT, goPlace, switchMap};
try { window.claude?.hot?.snapshot?.(() => ({S})); } catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

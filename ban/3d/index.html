<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xóm Bãi 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@600;700&family=Quicksand:wght@500;700&display=swap">
<style>
/* Bố cục: sa bàn 3D tràn màn hình, chữ nổi trên các mảnh giấy dó màu lúa; một thế giới ấm, không đổi theo giao diện sáng/tối */
:root{
  --dat:#2a1d12;        /* nâu đất, chữ chính */
  --do:#fbf3df;         /* giấy dó */
  --do-mo:rgba(251,243,223,.92);
  --lua:#c98a1b;        /* vàng lúa chín */
  --son:#a3341f;        /* đỏ son */
  --la:#3f6b2a;         /* xanh lá tre */
  --mo:#6d5a44;         /* chữ phụ */
  --f-tieu:"Mali","Quicksand",system-ui,sans-serif;
  --f-than:"Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%;overflow:hidden}
body{background:#cfe3c0;color:var(--dat);font-family:var(--f-than);touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;display:block;width:100%;height:100%}
#vin{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,rgba(0,0,0,0) 55%,rgba(40,28,10,.32) 100%);transition:opacity .4s}
#vin.tat{opacity:0}
.ts{position:fixed;left:0;right:0;height:24%;pointer-events:none;-webkit-backdrop-filter:blur(2.4px);backdrop-filter:blur(2.4px)}
#tsT{top:0;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
#tsB{bottom:0;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
body.thap .ts,#vin.tat~.ts{display:none}
.manh{background:var(--do-mo);border-radius:12px;box-shadow:0 2px 0 rgba(42,29,18,.25),0 6px 18px rgba(42,29,18,.15);border:1px solid rgba(42,29,18,.12)}
#top{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;max-width:calc(100% - 24px)}
#ten{padding:8px 14px}
#ten h1{margin:0;font-family:var(--f-tieu);font-size:20px;line-height:1.1;color:var(--son);font-weight:700}
#ten p{margin:2px 0 0;font-size:12px;color:var(--mo)}
#so{display:flex;gap:6px;flex-wrap:wrap}
.o{padding:6px 11px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.o i{font-style:normal;font-size:11px;color:var(--mo);font-weight:500;letter-spacing:.04em;text-transform:uppercase}
#nut{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#xoay{display:flex;gap:6px}
button{font-family:var(--f-than);font-weight:700;color:var(--dat);cursor:pointer;border:1px solid rgba(42,29,18,.18)}
button:focus-visible{outline:3px solid var(--lua);outline-offset:2px}
.nn{background:var(--do-mo);border-radius:10px;padding:8px 11px;font-size:13px;box-shadow:0 2px 0 rgba(42,29,18,.25)}
#lam{background:var(--son);color:#fff7e6;border:none;border-radius:18px;padding:12px 22px;font-family:var(--f-tieu);font-size:20px;box-shadow:0 3px 0 #6e1f10,0 8px 18px rgba(0,0,0,.2);min-width:150px}
#lam small{display:block;font-family:var(--f-than);font-size:12px;font-weight:500;opacity:.9}
#lam:disabled{background:#8c7b66;box-shadow:0 3px 0 #5a4c3c}
#goi{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:9px 13px;font-size:12.5px;line-height:1.5;max-width:min(380px,calc(100% - 210px))}
#goi b{color:var(--son)}
#bao{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:9px 16px;font-weight:700;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#bao.hien{opacity:1}
#joy{position:fixed;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:rgba(251,243,223,.35);border:2px solid rgba(251,243,223,.8);box-shadow:0 4px 14px rgba(0,0,0,.18);touch-action:none;display:none}
#joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--do);box-shadow:0 3px 0 rgba(42,29,18,.3)}
@media (pointer:coarse){#joy{display:block}#goi{display:none}}
@media (max-width:620px){#goi{display:none}#bao{top:auto;bottom:calc(120px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){#bao,#vin{transition:none}}
</style>

<canvas id="c" aria-label="Sa bàn 3D xóm Bãi"></canvas>
<div id="vin"></div><div class="ts" id="tsT"></div><div class="ts" id="tsB"></div>
<div id="top">
  <div id="ten" class="manh"><h1>Xóm Bãi</h1><p>Bản thử 3D · Ruộng Làng Đại Việt</p></div>
  <div id="so">
    <div class="o manh"><i>Giờ</i><span id="gio">7:00</span></div>
    <div class="o manh"><i>Thóc</i><span id="thoc">0</span></div>
    <div class="o manh"><i>Hạt</i><span id="hat">12</span></div>
    <div class="o manh"><i>Nước</i><span id="nuoc">4/8</span></div>
    <div class="o manh"><i>Cá</i><span id="ca">0</span></div>
    <div class="o manh"><i>Trứng</i><span id="trung">0</span></div>
  </div>
</div>
<div id="goi" class="manh"><b>Đi:</b> W A S D, phím mũi tên, hoặc bấm vào chỗ muốn đến. <b>Làm:</b> E hoặc Space: cuốc, gieo, tưới, gặt ở ruộng; múc nước ở giếng; nhặt trứng, rải thóc cho gà; câu cá ở ao hoặc sông. <b>Xoay cảnh:</b> Z / C. <b>Gần xa:</b> lăn chuột.</div>
<div id="nut">
  <div id="xoay">
    <button class="nn" id="bXL" aria-label="Xoay trái">⟲</button>
    <button class="nn" id="bXR" aria-label="Xoay phải">⟳</button>
    <button class="nn" id="bVin" aria-label="Bật tắt viền mờ">Viền</button>
    <button class="nn" id="bQ" aria-label="Đổi chất lượng hình">Hình: Cao</button>
    <button class="nn" id="bAo" aria-label="Đổi trang phục">Áo: Nông dân</button>
  </div>
  <button id="lam" disabled>Làm<small id="lamt">Đến gần chỗ cần làm</small></button>
</div>
<div id="bao" class="manh"></div>
<div id="joy" aria-label="Cần điều khiển"><i id="joyk"></i></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
// ---------- Dụng cụ chung ----------
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=rng(20260429);
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function mat(c,o){return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:1,metalness:0,flatShading:true},o||{}));}
function smat(c,o){return mat(c,Object.assign({flatShading:false},o||{}));}
function mesh(g,m,x,y,z,sh){const o=new THREE.Mesh(g,m);o.position.set(x||0,y||0,z||0);if(sh!==false){o.castShadow=true;o.receiveShadow=true;}return o;}
let saveOK=true; function ld(){try{return JSON.parse(localStorage.getItem("xombai3d")||"null");}catch(e){saveOK=false;return null;}}
function sv(){if(!saveOK)return;try{localStorage.setItem("xombai3d",JSON.stringify({thoc,hat,nuoc,ca,trung,t:gameH,plots:plots.map(p=>[p.s,p.g])}));}catch(e){saveOK=false;}}

// ---------- Cảnh ----------
const canvas=$("c");
const ren=new THREE.WebGLRenderer({canvas,antialias:true});
ren.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
ren.shadowMap.enabled=true; ren.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xcfe3c0,60,120);
const cam=new THREE.PerspectiveCamera(32,1,0.5,300);
const hemi=new THREE.HemisphereLight(0xfff4dc,0x5d7a3a,0.65); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d0,1.0);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-34,right:34,top:34,bottom:-34,near:1,far:120}); sun.shadow.bias=-0.0025; sun.shadow.normalBias=0.06;
scene.add(sun); scene.add(sun.target);
// bóng tiếp đất mềm dưới cây, nhà (giả lập lớp tối ở chân vật)
const blobTex=(function(){const c=document.createElement("canvas");c.width=c.height=64;const x=c.getContext("2d");const g=x.createRadialGradient(32,32,2,32,32,32);g.addColorStop(0,"rgba(20,30,10,1)");g.addColorStop(1,"rgba(20,30,10,0)");x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);})();
const blobG=new THREE.PlaneGeometry(1,1).rotateX(-Math.PI/2);
function blob(x,z,r,o){const m=new THREE.Mesh(blobG,new THREE.MeshBasicMaterial({map:blobTex,transparent:true,opacity:o||0.32,depthWrite:false}));m.scale.set(r*2,1,r*2);m.position.set(x,0.03,z);m.renderOrder=1;scene.add(m);}
function glowTex(){const c=document.createElement("canvas");c.width=c.height=64;const x=c.getContext("2d");const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,"rgba(255,220,150,1)");g.addColorStop(0.35,"rgba(255,170,80,.45)");g.addColorStop(1,"rgba(255,140,40,0)");x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);}
// nước: bóng loáng, có ánh trời
function waterMat(c){return new THREE.MeshPhongMaterial({color:c,specular:0xcfe6f0,shininess:70,transparent:true,opacity:0.9,flatShading:true});}

const W=48,D=40, X0=-W/2, Z0=-D/2;
const blocked=[]; // {x,z,r} hoặc {x0,z0,x1,z1}
function free(x,z,pad){pad=pad||0;
  if(x<X0+1||x>-X0-1||z<Z0+5.2||z>-Z0-1)return false;
  for(const b of blocked){ if(b.r!==undefined){const dx=x-b.x,dz=z-b.z;if(dx*dx+dz*dz<(b.r+pad)*(b.r+pad))return false;}
    else if(x>b.x0-pad&&x<b.x1+pad&&z>b.z0-pad&&z<b.z1+pad)return false; }
  return true;}
const occ=[]; // vùng không trồng cây trang trí
function inOcc(x,z,p){for(const o of occ){if(x>o[0]-p&&x<o[2]+p&&z>o[1]-p&&z<o[3]+p)return true;}return false;}

// ---------- Mặt đất sa bàn ----------
(function ground(){
  const g=new THREE.PlaneGeometry(W,D,96,80); g.rotateX(-Math.PI/2);
  const pos=g.attributes.position, col=[];const c=new THREE.Color();
  for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i);
    const n=Math.sin(x*0.31+z*0.17)*0.5+Math.sin(x*0.07-z*0.23)*0.5+(R()-.5)*0.35;
    c.setHSL(0.25+n*0.015,0.45+n*0.06,0.40+n*0.05);
    if(z<Z0+5.6){c.setHSL(0.11,0.35,0.62);} // bãi cát ven sông
    col.push(c.r,c.g,c.b);}
  g.setAttribute("color",new THREE.Float32BufferAttribute(col,3));
  const m=mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,flatShading:false}),0,0,0); m.castShadow=false; scene.add(m);
  // thành sa bàn: lớp đất nâu bên dưới
  const slab=mesh(new THREE.BoxGeometry(W,3,D),mat(0x7a5634),0,-1.52,0); slab.castShadow=false; scene.add(slab);
  const slab2=mesh(new THREE.BoxGeometry(W+0.6,0.6,D+0.6),mat(0x5b3d22),0,-3.2,0); slab2.castShadow=false; scene.add(slab2);
})();

// ---------- Sông Cái ----------
const sway=[]; // các tán, lau sậy đung đưa
const river=(function(){
  // sông Cái: mặt nước vẽ bằng shader riêng, có vân nước trôi theo dòng, chỗ sâu sẫm, mép nông sáng và bọt ở bờ
  const g=new THREE.PlaneGeometry(W+2,5.4,160,18); g.rotateX(-Math.PI/2);
  const pa=g.attributes.position;
  for(let i=0;i<pa.count;i++){const x=pa.getX(i), z=pa.getZ(i); const e=z/2.7; // -1 bờ xa, +1 bờ gần
    const bend=Math.sin(x*0.23)*0.45+Math.sin(x*0.61+1.3)*0.18; if(e>0.2) pa.setZ(i,z+bend*e);}
  const mt=new THREE.ShaderMaterial({transparent:true,depthWrite:false,
    uniforms:{uT:{value:0},uLight:{value:1},uSky:{value:new THREE.Color(0xcfe3c0)}},
    vertexShader:`uniform float uT; varying vec2 vW; varying float vE;
      void main(){ vec3 p=position; vE=uv.y; vW=(modelMatrix*vec4(p,1.0)).xz;
        p.y+=sin(vW.x*0.55-uT*1.3)*0.014+sin(vW.x*1.7+vW.y*2.0-uT*2.1)*0.006;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}`,
    fragmentShader:`uniform float uT; uniform float uLight; uniform vec3 uSky; varying vec2 vW; varying float vE;
      float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
      float n(vec2 p){vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f); return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
      float fbm(vec2 p){float v=0.0,a=0.5; for(int k=0;k<4;k++){v+=a*n(p);p*=2.03;a*=0.5;} return v;}
      void main(){
        float edge=abs(vE-0.5)*2.0;                          // 0 giữa dòng, 1 sát bờ
        vec2 q=vec2(vW.x-uT*0.9, vW.y*2.2);                 // trôi theo chiều dòng chảy
        float a=fbm(q*0.55), b=fbm(vec2(vW.x-uT*1.5,vW.y*3.0)*1.3+a);
        vec3 deep=vec3(0.16,0.36,0.38), shal=vec3(0.42,0.62,0.55);
        vec3 c=mix(deep,shal,pow(edge,1.6));
        c=mix(c,uSky*0.9,0.18+0.12*b);                       // ánh trời
        float streak=smoothstep(0.58,0.78,b)*(1.0-edge*0.6);  // vân nước
        c+=vec3(0.05,0.07,0.065)*streak;
        float sp=pow(n(vec2(vW.x*5.0-uT*2.2,vW.y*8.0+uT*0.6)),22.0)*1.2; // lấp lánh
        c+=vec3(sp)*uLight;
        float foam=smoothstep(0.78,0.97,edge+0.18*(a-0.5)+0.08*sin(vW.x*3.0-uT*2.0));
        c=mix(c,vec3(0.86,0.9,0.86),foam*0.55);
        c*=0.35+0.65*uLight;
        gl_FragColor=vec4(c,0.94-foam*0.1);}`});
  const m=new THREE.Mesh(g,mt); m.position.set(0,0.07,Z0+2.5); m.renderOrder=2; scene.add(m);
  blocked.push({x0:X0,z0:Z0,x1:-X0,z1:Z0+5});
  // lau sậy, đá cuội ven bờ
  const lau=mat(0x6f8f3a), bong=mat(0xb59a6a), da=mat(0x8f8a80);
  for(let x=X0+1.2;x<-X0-1;x+=0.9+R()*1.6){ if(x>-8.2&&x<-3.8)continue; const z=Z0+5.0+Math.sin(x*0.23)*0.45*0.9+(R()-.5)*0.4;
    if(R()<0.6){ const g2=new THREE.Group(); g2.position.set(x,0,z); const k=3+Math.floor(R()*4);
      for(let j=0;j<k;j++){const hh=0.8+R()*0.9; const st=mesh(new THREE.CylinderGeometry(0.02,0.03,hh,4),lau,(R()-.5)*0.4,hh/2,(R()-.5)*0.3,false); st.rotation.z=(R()-.5)*0.3; g2.add(st);
        if(R()<0.6){const bp=mesh(new THREE.CylinderGeometry(0.045,0.045,0.22,5),bong,st.position.x,hh+0.05,st.position.z,false); g2.add(bp);}}
      scene.add(g2); sway.push({g:g2,ph:R()*6,k:0.06}); }
    else { const r=0.15+R()*0.2; scene.add(mesh(new THREE.DodecahedronGeometry(r,0),da,x,r*0.4,z)); } }
  // lá bèo, cành khô trôi theo dòng
  const drift=[]; const bm=smat(0x4f8a32), lm=mat(0x8a6a3a);
  for(let i=0;i<14;i++){const isLa=i<10; const d=isLa?mesh(new THREE.CylinderGeometry(0.14+R()*0.08,0.14,0.02,7),bm,0,0,0,false):mesh(new THREE.BoxGeometry(0.6,0.04,0.06),lm,0,0,0,false);
    d.position.set(X0+R()*W,0.1,Z0+0.8+R()*3.2); d.userData={v:0.6+R()*0.6,ph:R()*6}; scene.add(d); drift.push(d);}
  return {mt,drift};
})();
// bến tre và thuyền nan
(function ben(){
  const wood=mat(0x8a6234), bam=mat(0x9aa64a);
  const bx=-6, bz=Z0+5.6;
  for(let i=0;i<5;i++){ scene.add(mesh(new THREE.BoxGeometry(1.6,0.12,0.42),wood,bx,0.32,bz-0.5-i*0.48)); }
  for(const sx of[-0.75,0.75])for(const k of[0,1,2]) scene.add(mesh(new THREE.CylinderGeometry(0.06,0.07,1.3,6),bam,bx+sx,0.2,bz-0.6-k*0.9));
  const thuyen=new THREE.Group();
  const hull=mesh(new THREE.SphereGeometry(1,10,6,0,Math.PI*2,Math.PI/2,Math.PI/2),mat(0x6b5132,{side:THREE.DoubleSide}),0,0,0);
  hull.scale.set(0.75,0.35,0.75); thuyen.add(hull);
  thuyen.position.set(bx+2.2,0.28,Z0+2.6); scene.add(thuyen);
  window.__thuyen=thuyen;
  occ.push([bx-1.2,bz-3,bx+1.2,bz+0.4]);
})();

// ---------- Ao làng ----------
const POND={x:6,z:10,r:4.2};
const pond=(function(){
  const N=28, sh=new THREE.Shape(), rim=new THREE.Shape(); const pts=[];
  for(let i=0;i<N;i++){const a=i/N*Math.PI*2, r=POND.r*(1+0.13*Math.sin(a*3+1)+0.07*Math.sin(a*5));pts.push([Math.cos(a)*r,Math.sin(a)*r]);}
  pts.forEach((p,i)=>i?sh.lineTo(p[0],p[1]):sh.moveTo(p[0],p[1]));
  pts.forEach((p,i)=>{const k=1.16;i?rim.lineTo(p[0]*k,p[1]*k):rim.moveTo(p[0]*k,p[1]*k);});
  const rg=new THREE.ShapeGeometry(rim); rg.rotateX(-Math.PI/2);
  const rm=mesh(rg,mat(0xc9b07a),POND.x,0.015,POND.z); rm.castShadow=false; scene.add(rm);
  const wg=new THREE.ShapeGeometry(sh); wg.rotateX(-Math.PI/2);
  const wm=new THREE.Mesh(wg,waterMat(0x3a8582));
  // vệt sáng mép nước
  const fg=new THREE.ShapeGeometry(sh); fg.rotateX(-Math.PI/2); const foam=new THREE.Mesh(fg,new THREE.MeshBasicMaterial({color:0xdfeee6,transparent:true,opacity:0.35,depthWrite:false})); foam.scale.set(1.04,1,1.04); foam.position.set(POND.x,0.03,POND.z); scene.add(foam); window.__foam=foam;
  wm.position.set(POND.x,0.04,POND.z); wm.receiveShadow=true; scene.add(wm);
  // lá sen, hoa sen, bèo
  const leaf=mat(0x4f8a32), hoa=mat(0xf2a7b8), nhuy=mat(0xf3d36b);
  for(let i=0;i<11;i++){const a=R()*Math.PI*2,r=POND.r*(0.35+R()*0.5);

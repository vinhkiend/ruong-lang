<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruộng Làng Đại Việt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Bố cục: thanh trạng thái dính trên cùng, cánh đồng ô vuông như bờ ruộng, thanh tab dưới đáy trên điện thoại.
   Sáng: giấy mạ xanh nhạt, son đỏ, vàng hoè, chàm. Tối: nền sơn mài. */
:root{
  --bg:#E4E9D3; --bg2:#D5DCBC; --card:#F4F6EA; --ink:#21261A; --muted:#5B644C; --line:rgba(33,38,26,.16);
  --son:#B23A28; --onson:#FFFFFF; --hoe:#B88208; --cham:#2C4A6E; --la:#4A7A2C;
  --bo:#86A660; --soil:#8B6A45; --soilw:#5B4330; --ripe:#E3B53C; --good:#3F7A2A; --bad:#B23A28;
  --fd:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif; --fb:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13180F; --bg2:#1B2216; --card:#1E2619; --ink:#E7EBD8; --muted:#A2AC8C; --line:rgba(231,235,216,.14);
  --son:#E0694F; --onson:#1A0E09; --hoe:#E4B446; --cham:#88AAD8; --la:#8FC167;
  --bo:#3E5A2A; --soil:#64492F; --soilw:#3F2D1E; --ripe:#C99A2B; --good:#8FC167; --bad:#E0694F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13180F; --bg2:#1B2216; --card:#1E2619; --ink:#E7EBD8; --muted:#A2AC8C; --line:rgba(231,235,216,.14);
  --son:#E0694F; --onson:#1A0E09; --hoe:#E4B446; --cham:#88AAD8; --la:#8FC167;
  --bo:#3E5A2A; --soil:#64492F; --soilw:#3F2D1E; --ripe:#C99A2B; --good:#8FC167; --bad:#E0694F; color-scheme:dark}
[hidden]{display:none!important}
.art{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.2em;flex:none}
.plot .ic .art{width:1.5em;height:1.5em;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.row .e .art,.seedpick .e .art{width:1.4em;height:1.4em}
.iconbtn.off{opacity:.55;text-decoration:line-through}
.sound{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.sound label{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.sound input{width:22px;height:22px;accent-color:var(--son)}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg2)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--cham);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);line-height:1.15;text-wrap:balance;margin:0}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Thanh trên */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg2);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.brand b{font-family:var(--fd);font-size:1.45rem;font-weight:800;color:var(--son);line-height:1}
.brand span{font-size:.75rem;color:var(--muted);letter-spacing:.04em}
.stat{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.season{font-family:var(--fd);font-weight:700;padding:1px 10px;border-radius:99px;color:var(--onson);background:var(--la)}
.season.s1{background:var(--hoe)}.season.s2{background:var(--son)}.season.s3{background:var(--cham)}
.coin{width:18px;height:18px;border-radius:50%;background:var(--hoe);position:relative;flex:none;box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}
.coin::after{content:"";position:absolute;inset:6px;background:var(--bg2);border-radius:1px}
.money b{font-family:var(--fd);font-size:1.15rem}
.bar{width:74px;height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--la);border-radius:9px;transition:width .25s}
.bar.low i{background:var(--son)}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:4px 10px;font-size:.85rem}
.sleep{background:var(--cham);color:var(--bg);border:0;border-radius:12px;padding:8px 16px;font-family:var(--fd);font-weight:700;font-size:1rem}

.banner{max-width:1120px;margin:10px auto 0;}
.banner > div{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:12px;background:var(--card);border-left:5px solid var(--cham)}
.banner .bad{border-left-color:var(--bad)}.banner .good{border-left-color:var(--good)}
.banner small{color:var(--muted)}

/* Tabs */
.tabs{max-width:1120px;margin:12px auto 0;display:flex;gap:6px}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:10px 10px 0 0;padding:8px 16px;font-weight:600;color:var(--muted);position:relative}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);border-bottom-color:var(--card)}
.tabs .dot{position:absolute;top:4px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--son)}

.wrap{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding-block:0 32px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:0 14px 14px 14px;padding:16px;min-width:0}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.box h3,.panel h2{font-size:1.15rem;margin-bottom:8px}
.panel h2{font-size:1.3rem}
.sub{color:var(--muted);font-size:.88rem;margin:0 0 12px}
.mobile-only{display:none}

/* Ruộng */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.btn{border:1.5px solid var(--ink);background:var(--card);border-radius:10px;padding:6px 12px;font-weight:600;font-size:.9rem;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.p{background:var(--son);border-color:var(--son);color:var(--onson)}
.btn.s{padding:3px 9px;font-size:.82rem}
.field{background:var(--bo);padding:10px;border-radius:14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.plot{aspect-ratio:1;max-width:100%;border:0;border-radius:8px;background:var(--soil);color:#F7EEDC;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;overflow:hidden;
  background-image:repeating-linear-gradient(0deg,transparent 0 10px,rgba(0,0,0,.08) 10px 12px);transition:transform .12s}
.plot:active{transform:scale(.96)}
.plot.wet{background-color:var(--soilw);box-shadow:inset 0 0 0 2px rgba(136,170,216,.55)}
.plot.ripe{box-shadow:inset 0 0 0 3px var(--ripe),0 0 0 2px var(--ripe);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:inset 0 0 0 3px var(--ripe),0 0 10px 3px var(--ripe)}}
.plot .ic{font-size:clamp(1.6rem,6vw,2.4rem);line-height:1}
.plot .ic.sm{font-size:clamp(1.2rem,4.5vw,1.7rem)}
.plot .nm{font-size:.74rem;font-weight:600;line-height:1.2;text-align:center}
.plot .tag{position:absolute;top:5px;left:5px;font-size:.64rem;font-weight:700;padding:0 6px;border-radius:6px;background:rgba(0,0,0,.35)}
.plot .tag.dry{background:var(--son);color:var(--onson)}
.plot .pg{position:absolute;left:8px;right:8px;bottom:7px;height:5px;border-radius:5px;background:rgba(0,0,0,.3);overflow:hidden}
.plot .pg i{display:block;height:100%;background:var(--ripe)}
.plot.empty{color:rgba(247,238,220,.75)}
.plot .mau{position:absolute;top:5px;right:5px;font-size:.62rem;font-weight:700;padding:0 5px;border-radius:6px;background:rgba(0,0,0,.35);color:#F7EEDC;font-variant-numeric:tabular-nums}
.plot .mau.lo{background:var(--hoe);color:#21261A}
.plot.add{background:transparent;border:2px dashed rgba(33,38,26,.35);color:var(--ink);background-image:none}
.plot.add .nm{font-size:.72rem}
.guide{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:.8rem;padding:2px 10px;border-radius:99px;border:1px solid var(--line);background:var(--bg)}
.chip.off{opacity:.45;text-decoration:line-through}

/* Danh sách / bảng */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .e{font-size:1.5rem;text-align:center}
.row .t b{display:block}
.row .t small{color:var(--muted);display:block;line-height:1.35}
.row .a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--good)}.down{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.sec{margin-top:18px}
.sec h3{font-size:1.05rem;margin-bottom:4px}
.note{font-size:.85rem;color:var(--muted)}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:0 8px;border-radius:99px;background:var(--bg2);color:var(--ink);margin-left:6px;vertical-align:1px}
.pill.bad{background:var(--son);color:var(--onson)}.pill.good{background:var(--la);color:var(--onson)}
.goal{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:.9rem}
.goal i{flex:none;width:16px;height:16px;border-radius:4px;border:2px solid var(--muted);margin-top:3px}
.goal.done{color:var(--muted)}.goal.done i{background:var(--la);border-color:var(--la)}
.goal small{color:var(--muted)}
.log{list-style:none;margin:0;padding:0;font-size:.84rem;max-height:340px;overflow:auto}
.log li{padding:4px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px}
.log li span{color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.log .bad{color:var(--bad)}

/* Hộp thoại */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,12,8,.5);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.modal{align-items:center}}
.sheet{background:var(--card);color:var(--ink);border-radius:18px;padding:20px;width:min(520px,100%);max-height:86vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.sheet h2{font-size:1.45rem;margin-bottom:6px;color:var(--son)}
.sheet ol,.sheet ul{padding-left:1.2rem;margin:8px 0}
.sheet li{margin:4px 0}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.notes{list-style:none;padding:0}
.notes li{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.notes li::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--cham)}
.notes li.bad::before{background:var(--bad)}.notes li.good::before{background:var(--good)}.notes li.tax::before{background:var(--hoe)}
.seedpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.seedpick button{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;text-align:left;display:flex;gap:10px;align-items:center}
.seedpick button:disabled{opacity:.45}
.seedpick .e{font-size:1.7rem}
.seedpick small{display:block;color:var(--muted);line-height:1.3}

.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(420px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:.9rem;font-weight:500;animation:tin .2s ease-out;text-align:center}
.toast.warn{background:var(--son);color:var(--onson)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr);padding-block:0 calc(90px + env(safe-area-inset-bottom,0px))}
  .side{display:none}
  .mobile-only{display:block}
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:25;background:var(--bg2);border-top:1px solid var(--line);
    padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));gap:4px}
  .tabs button{flex:1;border-radius:10px;padding:8px 2px;font-size:.82rem;border-color:transparent}
  .tabs button[aria-selected="true"]{background:var(--card);border-color:var(--line)}
  .panel{border-radius:14px;margin-top:12px}
  .toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:520px){
  .field{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:8px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .seedpick{grid-template-columns:minmax(0,1fr)}
  .brand b{font-size:1.25rem}
  .top-in{gap:6px 12px}
  .sleep{padding:7px 12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top"><div class="top-in gut" id="hdr"></div></header>
<div class="gut"><div class="banner" id="banner"></div></div>
<div class="gut"><nav class="tabs" id="tabs" role="tablist" aria-label="Khu vực"></nav></div>
<main class="wrap gut">
  <section class="panel" id="panel" role="tabpanel"></section>
  <aside class="side" id="side"></aside>
</main>
<div class="modal" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>

   Không dùng tệp hay tác phẩm của tác giả khác. Gọi: RLA.art(khoá), RLA.sfx(tên), RLA.music.season(0..3). */
const RLA = (function(){

  rau: `<path d="M24 45c0-10-1-18-6-25M24 45c0-9 2-17 8-23M24 45V14" stroke="#7FA347" stroke-width="2.4" fill="none" stroke-linecap="round"/>

  lac: `<path d="M8 44h32" stroke="#7A5A38" stroke-width="2" stroke-linecap="round"/>
    <g fill="#4E8F2F"><ellipse cx="14" cy="13" rx="5" ry="3.2" transform="rotate(-30 14 13)"/><ellipse cx="22" cy="9" rx="5" ry="3.2" transform="rotate(10 22 9)"/><ellipse cx="32" cy="12" rx="5" ry="3.2" transform="rotate(30 32 12)"/><ellipse cx="35" cy="20" rx="4.5" ry="3" transform="rotate(60 35 20)"/></g>
    <path d="M24 30V12M24 20l8-7M24 18l-9-4M24 24l10-4" stroke="#5C8A2D" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <g fill="#D9B27C" stroke="#9C7443" stroke-width="1"><path d="M10 34c0-3 3-5 6-4 2 .6 3 2 5 2s3 2 3 4-2 5-6 4c-2-.5-3-2-5-2-2 0-3-1-3-4z"/><path d="M26 38c0-3 3-5 6-4 2 .6 3 2 5 2s3 2 3 4-2 5-6 4c-2-.5-3-2-5-2-2 0-3-1-3-4z"/></g>
    <g stroke="#9C7443" stroke-width=".7" fill="none"><path d="M14 31v6M18 32v5M30 35v6M34 36v5"/></g>`,
  mia: `<g stroke-linecap="round"><path d="M17 46V8" stroke="#6B3A57" stroke-width="5"/><path d="M28 46V4" stroke="#7E4566" stroke-width="5"/></g>

    <g fill="none" stroke="#5C8A2D" stroke-width="2.2" stroke-linecap="round"><path d="M17 10c-5 0-10 3-13 8M17 12c3-4 7-6 11-6M28 6c5 1 10 5 13 10M28 8c-3-2-7-3-10-2M28 18c5 1 9 4 12 9"/></g>`,
  khoai: `<g fill="#5C8A2D" stroke="#3A6A1F" stroke-width=".9"><path d="M14 20c-5-2-8-7-6-11 3-3 6-1 6 2 0-3 4-5 6-2 2 4-2 9-6 11z"/><path d="M31 16c-4-3-6-8-3-11 3-2 6 0 6 3 1-3 5-4 6-1 2 4-3 8-9 9z"/></g>
    <path d="M14 20c2 4 6 7 10 9M31 16c-2 5-4 9-7 13" stroke="#5C8A2D" stroke-width="1.8" fill="none"/>
    <g fill="#B5475B" stroke="#7E2C3C" stroke-width="1"><path d="M6 37c2-6 10-9 18-8s14 4 13 9-8 7-16 6S4 43 6 37z"/><path d="M28 40c2-4 8-6 13-4s4 6 1 8-9 2-12 0-3-2-2-4z"/></g>
    <g stroke="#E3A2AE" stroke-width=".9" fill="none" stroke-linecap="round"><path d="M12 36l2 1M19 34l1 2M26 38l2-1M35 39l1 2"/></g>`,
  co: `<g fill="none" stroke-linecap="round" stroke-width="2.4"><path d="M10 44c0-8-2-14-6-20" stroke="#6F9E3A"/><path d="M16 44c0-12 1-20 4-30" stroke="#4E8F2F"/><path d="M24 44c0-10-2-18-8-26" stroke="#7FB04A"/><path d="M28 44c0-12 3-22 10-30" stroke="#4E8F2F"/><path d="M34 44c0-8 3-14 9-19" stroke="#6F9E3A"/><path d="M22 44c0-14 2-24 2-34" stroke="#5E9A33"/></g>`,
  mam: `<path d="M24 44V26" stroke="#6FA23A" stroke-width="2.6" stroke-linecap="round"/>
    <g fill="#79B347" stroke="#3E7A22" stroke-width="1"><path d="M24 28c-2-7-8-11-15-10 1 7 7 11 15 10z"/><path d="M24 26c1-8 7-13 15-12-1 8-7 12-15 12z"/></g>

/* ---------- Âm thanh ---------- */
const PKEY = "ruonglang-amthanh";
let pref = {nhac:true, tiengdong:true};
try { const r = JSON.parse(localStorage.getItem(PKEY) || "null"); if (r) pref = {...pref, ...r}; } catch(e){}
function savePref(){ try { localStorage.setItem(PKEY, JSON.stringify(pref)); } catch(e){} }

let ac = null, master = null, musBus = null, sfxBus = null, verb = null, noiseBuf = null;
function ctx(){
  if (ac) return ac;
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
  try { ac = new AC(); } catch(e){ return null; }
  master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
  musBus = ac.createGain(); musBus.gain.value = pref.nhac ? 0.32 : 0; musBus.connect(master);
  sfxBus = ac.createGain(); sfxBus.gain.value = 0.55; sfxBus.connect(master);
  /* Vang nhẹ như đồng không mông quạnh: tiếng vọng ngắn tạo từ nhiễu tắt dần */
  verb = ac.createConvolver();
  const len = ac.sampleRate * 1.8, ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++){ const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 3.2); }
  verb.buffer = ir;
  const vg = ac.createGain(); vg.gain.value = 0.28; verb.connect(vg); vg.connect(master);
  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random()*2-1;
  return ac;
}
function out(node, bus, wet){ node.connect(bus); if (wet){ const s = ac.createGain(); s.gain.value = wet; node.connect(s); s.connect(verb); } }
const hz = m => 440 * Math.pow(2, (m - 69) / 12);

/* Nhạc cụ */
function danBau(t, m, dur, vel, bend){
  /* Đàn bầu: một dây, tiếng tròn, nhấn luyến lên xuống và rung ở đuôi nốt */
  const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  const lfo = ac.createOscillator(), lg = ac.createGain();
  o.type = "triangle"; o2.type = "sine"; f.type = "lowpass"; f.frequency.value = 2200;
  const fr = hz(m);
  o.frequency.setValueAtTime(bend ? hz(m + bend) : fr, t); o2.frequency.setValueAtTime(fr*2, t);
  if (bend){ o.frequency.exponentialRampToValueAtTime(fr, t + 0.16); }
  lfo.frequency.value = 5.2; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(fr*0.012, t + Math.min(dur*0.6, 0.5));
  lfo.connect(lg); lg.connect(o.frequency);
  const g2 = ac.createGain(); g2.gain.value = 0.18; o2.connect(g2); g2.connect(f);
  o.connect(f); f.connect(g);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vel, t + 0.02);
  g.gain.exponentialRampToValueAtTime(vel*0.45, t + 0.25); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.35);
  out(g, musBus, 0.5);
  [o, o2, lfo].forEach(x => { x.start(t); x.stop(t + dur + 0.4); });
}
function sao(t, m, dur, vel){
  /* Sáo trúc: âm thổi, có hơi gió */
  const o = ac.createOscillator(), g = ac.createGain(); o.type = "sine"; o.frequency.value = hz(m);
  const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 4.6; lg.gain.value = hz(m)*0.006; lfo.connect(lg); lg.connect(o.frequency);
  const n = ac.createBufferSource(), nf = ac.createBiquadFilter(), ng = ac.createGain();
  n.buffer = noiseBuf; nf.type = "bandpass"; nf.frequency.value = hz(m)*2; nf.Q.value = 6; ng.gain.value = vel*0.5;
  n.connect(nf); nf.connect(ng); ng.connect(g); o.connect(g);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vel, t + 0.08); g.gain.setValueAtTime(vel*0.85, t + dur*0.8); g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.12);
  out(g, musBus, 0.6);
  [o, lfo, n].forEach(x => { x.start(t); x.stop(t + dur + 0.2); });
}
function tranh(t, m, vel){
  /* Đàn tranh: gảy dây, tắt nhanh */
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  o.type = "sawtooth"; o.frequency.value = hz(m); f.type = "lowpass";
  f.frequency.setValueAtTime(3200, t); f.frequency.exponentialRampToValueAtTime(500, t + 0.6);
  o.connect(f); f.connect(g);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vel, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
  out(g, musBus, 0.45); o.start(t); o.stop(t + 1.3);
}
function mo(t, vel, bus){
  /* Mõ gỗ */
  const o = ac.createOscillator(), g = ac.createGain(); o.type = "sine";
  o.frequency.setValueAtTime(1150, t); o.frequency.exponentialRampToValueAtTime(820, t + 0.05);
  g.gain.setValueAtTime(vel, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
  o.connect(g); out(g, bus || musBus, 0.2); o.start(t); o.stop(t + 0.1);
}
function trong(t, vel){
  /* Trống cơm: tiếng bịch trầm */
  const o = ac.createOscillator(), g = ac.createGain(); o.type = "sine";
  o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.18);
  g.gain.setValueAtTime(vel, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
  o.connect(g); out(g, musBus, 0.15); o.start(t); o.stop(t + 0.32);
}
function cong(t, vel, bus, m){
  /* Cồng đồng: các họa âm lệch nhau, ngân dài */
  const base = hz(m || 45), parts = [1, 1.52, 2.03, 2.74, 3.4];
  parts.forEach((p, i) => {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = "sine"; o.frequency.value = base*p;
    const v = vel / (i + 1.3);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6 - i*0.35);
    o.connect(g); out(g, bus || musBus, 0.5); o.start(t); o.stop(t + 2.7);
  });
}
function noise(t, dur, vel, type, f0, f1, q, bus){
  const n = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  n.buffer = noiseBuf; f.type = type; f.Q.value = q || 1;
  f.frequency.setValueAtTime(f0, t); if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vel, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  n.connect(f); f.connect(g); out(g, bus || sfxBus, 0.15); n.start(t); n.stop(t + dur + 0.02);
}
function pluck(t, m, vel, bus, dur){
  const o = ac.createOscillator(), g = ac.createGain(); o.type = "triangle"; o.frequency.value = hz(m);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vel, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.4));
  o.connect(g); out(g, bus || sfxBus, 0.3); o.start(t); o.stop(t + (dur || 0.4) + 0.05);
}

/* ---------- Bài nhạc theo mùa (ngũ cung) ----------
   Mỗi mùa một điệu, ghi bằng bậc trong thang 5 âm: 0..4 là năm âm của một quãng tám, 5..9 là quãng tám trên, -1..-5 quãng dưới.
   Mỗi nốt: [bậc, số phách, nhấn luyến]. null là nghỉ. */
const SCALES = {
  bac:[0,2,5,7,9],   /* Hơi Bắc (Hò Xự Xang Xê Cống): sáng, vui */
  nam:[0,3,5,7,10],  /* Hơi Nam (gần thang ngũ cung thứ): man mác, buồn nhẹ */
  xuan:[0,2,4,7,9]   /* Ngũ cung trưởng: trong trẻo */
};
const SONGS = [
  { n:"Xuân · Ra đồng", key:62, sc:"xuan", bpm:88, lead:"sao", mel:[
    [5,1],[7,1],[6,.5],[5,.5],[4,1],  [3,1],[4,.5],[5,.5],[2,2],
    [3,1],[4,1],[5,1],[7,1],          [6,1.5],[5,.5],[4,2],

    [1,1],[2,.5],[3,.5],[4,1],[2,1],  [0,3],null ]},
  { n:"Hạ · Tát nước", key:60, sc:"bac", bpm:104, lead:"tranh", mel:[
    [5,.5],[5,.5],[7,1],[6,.5],[5,.5],[4,1],  [5,.5],[4,.5],[2,1],[3,2],
    [4,.5],[5,.5],[4,.5],[3,.5],[2,1],[0,1],  [1,1],[2,1],[3,2],
    [5,.5],[6,.5],[7,1],[9,1],[7,1],          [6,.5],[5,.5],[4,1],[5,2],
    [3,.5],[2,.5],[1,1],[2,1],[4,1],          [3,1],[1,1],[0,2] ]},
  { n:"Thu · Gặt hái", key:62, sc:"nam", bpm:76, lead:"danBau", mel:[
    [4,1.5,2],[3,.5],[2,1],[3,1],  [4,2,-2],[2,2],
    [0,1],[1,1],[2,1],[4,1,2],     [3,3],null,
    [5,1,2],[4,1],[3,1],[2,1],     [3,1.5],[2,.5],[1,2],
    [2,1],[1,1],[0,1,2],[-1,1],    [0,3,-2],null ]},
  { n:"Đông · Bên bếp lửa", key:57, sc:"bac", bpm:64, lead:"danBau", mel:[
    [2,2,2],[3,1],[4,1],  [5,3,-2],null,
    [4,1],[3,1],[2,1],[1,1],  [2,4,2],
    [0,2],[1,1],[2,1],    [4,2,2],[3,2],
    [2,1],[1,1],[0,1],[-1,1],  [0,4,-2] ]}
];
function deg(sc, d){ const s = SCALES[sc], o = Math.floor(d/5), i = ((d%5)+5)%5; return s[i] + 12*o; }

let mus = {on:false, song:0, idx:0, next:0, timer:null, bar:0};
function schedule(){
  if (!ac || !mus.on) return;
  const S = SONGS[mus.song], beat = 60 / S.bpm;
  while (mus.next < ac.currentTime + 0.25){
    const ev = S.mel[mus.idx];
    const t = mus.next;
    if (ev){
      const [d, b, bend] = ev, m = S.key + 12 + deg(S.sc, d), dur = b*beat;
      if (S.lead === "sao") sao(t, m, dur*0.92, 0.22);
      else if (S.lead === "tranh") tranh(t, m, 0.16);
      else danBau(t, m, dur*0.95, 0.26, bend);
      /* Đệm: đàn tranh rải ở phách mạnh, mõ giữ nhịp, trống cơm cuối câu */
      if (mus.beatPos % 2 < 0.01){
        tranh(t, S.key + deg(S.sc, (mus.bar % 4 === 3) ? 3 : 0), 0.07);
        tranh(t + beat*0.5, S.key + deg(S.sc, 2), 0.045);
      }
      if (mus.song !== 3) for (let k = 0; k < b; k += 1) mo(t + k*beat, mus.song === 1 ? 0.06 : 0.035);
      mus.beatPos += b;
      if (mus.beatPos >= 4){ mus.beatPos -= 4; mus.bar++; if (mus.bar % 4 === 0) trong(t + dur - beat*0.5, 0.18); }
      mus.next += dur;
    } else {
      mus.next += beat*2; mus.beatPos = 0;
    }
    mus.idx++;
    if (mus.idx >= S.mel.length){ mus.idx = 0; mus.beatPos = 0; mus.bar = 0; mus.next += beat*2; }
  }
}
function musStart(){

  if (id === "nha"){ mark("nha"); S.won = true; commit(); showWin(); return; }
  toast("Đã có " + u.n + "."); commit();
}
function buyPlot(){
  if (S.plots.length >= 16) return;
  const pr = plotPrice();
  if (S.money < pr){ toast("Không đủ tiền. Cần " + pr + " đồng.", "warn"); return; }
  S.money -= pr; RLA.sfx("mua"); S.plots.push({c:null, a:0, w:!!S.wet, m:60});
  toast("Khai hoang thêm 1 thửa ruộng."); commit();
}
function fillOrder(i){
  const o = S.orders[i]; if (!o) return;
  if ((S.goods[o.g]||0) < o.q){ toast("Chưa đủ hàng: cần " + o.q + " " + GOODS[o.g].n + ".", "warn"); return; }
  S.goods[o.g] -= o.q; S.money += o.pay; S.orders.splice(i,1);
  addLog("Giao đơn cho " + o.who + ": " + o.q + " " + GOODS[o.g].n + ", nhận " + o.pay + " đồng.", "good");
  RLA.sfx("ban"); toast("Giao xong đơn, nhận " + o.pay + " đồng."); commit();
}

/* ===== Qua đêm ===== */
function sleep(){
  RLA.sfx("ngu");
  const notes = [], d = S.day, se = seasonOf(d);
  const gentle = yearOf(d) === 1 && se === 3;
  let died = 0;
  for (const p of S.plots){
    if (!p.c){ p.m = clampM(p.m + 4); p.w = false; continue; }
    const C = CROPS[p.c];
    if (p.a < C.days){
      if (p.w) p.a++;
      else if (S.ev && S.ev.id === "han"){ p.c = null; p.a = 0; died++; }
    }
    p.w = false;
  }
  if (died) notes.push(["bad", "Nắng hạn làm héo " + died + " thửa chưa được tưới."]);

  let eggs = 0, hungry = 0, thin = 0; const lost = [];
  for (const a of S.animals){
    const A = ANIMALS[a.t];
    if ((S.goods.rom||0) >= A.eat){ S.goods.rom -= A.eat; a.h = 0; a.f = (a.f||0) + 1; if (a.t === "ga") eggs++; if (a.t === "lon" && a.f === A.fat) notes.push(["good","Một con lợn đã béo. Vào Chuồng để bán được 170 đồng."]); }
    else { a.h++; if (a.t === "trau") thin++; else hungry++; }
  }
  S.animals = S.animals.filter(a => { if (a.t !== "trau" && !gentle && a.h >= 3){ lost.push(ANIMALS[a.t].n); return false; } return true; });
  if (eggs){ S.goods.trung = (S.goods.trung||0) + eggs; notes.push(["good","Gà đẻ " + eggs + " quả trứng."]); }
  if (thin) notes.push(["bad","Trâu thiếu rơm nên gầy đi, chưa kéo cày được. Cho ăn đủ là khoẻ lại."]);
  if (hungry) notes.push(["bad", hungry + " con vật bị đói vì hết rơm cỏ." + (gentle ? " Mùa Đông đầu tiên chúng chưa chết, nhưng không đẻ, không lớn." : " Đói 3 ngày liền sẽ chết.")]);
  if (lost.length) notes.push(["bad","Chết vì đói: " + lost.join(", ") + "."]);

  /* Mùa Đông cả nhà ăn 1 thóc mỗi ngày */
  S.tired = false;
  if (se === 3){
    if ((S.goods.thoc||0) >= 1) S.goods.thoc--;
    else { S.tired = true; notes.push(["bad","Hết thóc ăn, cả nhà đói nên hôm nay chỉ còn " + (MAXS-3) + " sức."]); }
  }

  if (dis(d) === SL){
    const t = taxDue();
    if (taxFree(d)) notes.push(["tax","Mùa Đông năm đầu, lý trưởng miễn tô thuế cho nhà mình."]);
    else {
      const have = S.goods.thoc||0, giveT = Math.min(have, t), short = t - giveT;
      const cash = short * sellPrice("thoc");
      if (short === 0){ S.goods.thoc -= t; notes.push(["tax","Lý trưởng thu tô thuế mùa " + SEASONS[se] + ": " + t + " thóc."]); mark("thue"); }
      else if (S.money >= cash){ S.goods.thoc -= giveT; S.money -= cash; notes.push(["tax","Nộp tô thuế: " + giveT + " thóc, thiếu " + short + " thóc nộp bù " + cash + " đồng."]); }
      else {
        S.goods.thoc -= giveT; const paid = S.money; S.money = 0;
        let m = "Thiếu tô thuế: nộp " + giveT + " thóc và " + paid + " đồng vẫn chưa đủ.";
        if (S.plots.length > 4){ S.plots.pop(); m += " Quan thu lại 1 thửa ruộng."; }
        notes.push(["bad", m]);
      }
    }
  }

  S.day++; S.suc = S.tired ? MAXS-3 : MAXS;
  S.ev = null; S.wet = false;
  if (isPhien(S.day)){
    S.pp = {...S.pf};
    for (const g in S.pf){ const f = S.pf[g] + (Math.random()-0.5)*0.4 + (1 - S.pf[g])*0.2; S.pf[g] = Math.min(1.5, Math.max(0.6, f)); }
    genOrders();
    notes.push(["good","Hôm nay có chợ phiên: giá mới, có 3 đơn hàng mới, giá bán cao hơn 25%."]);
  }
  else if (S.orders.length && S.orders.some(o => o.until <= S.day)) S.orders = S.orders.filter(o => o.until > S.day);
  if (S.warn && S.warn.day === S.day){ strike(S.warn.id, notes); S.warn = null; }
  else rollEvent(notes);
  if (S.up.guong){ S.plots.forEach(p => { if (p.c) p.w = true; }); S.wet = true; }
  if (S.day === SL*4 + 1) mark("dong");
  const nd = dis(S.day), nse = seasonOf(S.day);
  if (nd === 1) notes.unshift(["season","Sang mùa " + SEASONS[nse] + ". " + SEASON_TIP[nse]]);
  if (nd === SL-2 && !taxFree(S.day)) notes.push(["tax","Còn 3 ngày nữa nộp tô thuế: " + taxDue() + " thóc (thiếu thì nộp bù bằng tiền)."]);
  if (nse === 2 && (nd === 1 || nd === 6)){
    const w = winterInfo();
    notes.push(["bad","Còn " + (SL - nd + 1) + " ngày nữa đến mùa Đông. Kho thóc đủ cho nhà ăn " + Math.min(w.riceDays, SL) + "/" + SL + " ngày" + (w.romDays === null ? "" : ", rơm cỏ đủ cho gia súc " + Math.min(w.romDays, SL) + "/" + SL + " ngày") + "."]);
  }
  const need = romNeed(), have = S.goods.rom||0;
  if (need && have < need*3) notes.push(["bad","Rơm cỏ chỉ còn " + have + ", đủ cho khoảng " + Math.floor(have/need) + " ngày."]);
  notes.forEach(n => addLog(n[1], n[0]));
  commit();
  showMorning(notes);
}
function pickW(opts){ const tot = opts.reduce((s,o) => s + o[1], 0); let r = Math.random()*tot; for (const o of opts){ if ((r -= o[1]) < 0) return o[0]; } return opts[0][0]; }
function wipe(list, n){ let k = 0; while (k < n && list.length){ const p = list.splice(Math.floor(Math.random()*list.length),1)[0]; p.c = null; p.a = 0; p.w = false; k++; } return k; }
/* Sự kiện báo trước tới ngày thì xảy ra */
function strike(id, notes){
  let msg, k = "bad";
  if (id === "chau"){
    const lua = S.plots.filter(p => p.c === "lua"), other = S.plots.filter(p => p.c && p.c !== "lua");
    const n = Math.max(1, Math.ceil((lua.length + other.length)/2));
    let hit = wipe(lua, n); hit += wipe(other, n - hit);
    msg = hit ? "Châu chấu kéo đến như trưởng làng báo, ăn trụi " + hit + " thửa chưa gặt." : "Châu chấu kéo đến nhưng ruộng đã gặt sạch, nhà mình không mất gì.";
    if (!hit) k = "good";
  } else {
    if (S.up.de){ msg = "Nước sông lên cao nhưng đê vững, ruộng an toàn."; k = "good"; }
    else {
      const hit = wipe(S.plots.filter(p => p.c), 3);
      msg = hit ? "Nước sông tràn bờ, ngập " + hit + " thửa ruộng. Đắp đê (mục Nâng cấp) để phòng lần sau." : "Nước sông tràn bờ, may ruộng đang trống nên không mất gì.";
    }
  }
  S.ev = {id, msg, k};
  notes.push([k, msg]);
}
function rollEvent(notes){
  const se = seasonOf(S.day);
  if (S.day < 4 || Math.random() > (se === 3 ? 0.2 : 0.38)) return;
  const opts = [["mua", se === 3 ? 1 : 3], ["hoi", 0.6]];
  if (se !== 3) opts.push(["han", se === 1 ? 2 : 1]);
  if (!S.warn && (se === 1 || se === 2)){ opts.push(["chau", 1.5]); if (S.day > SL) opts.push(["lu", 1.2]); }
  if (S.animals.some(a => a.t === "ga")) opts.push(["cao", 1]);
  const id = pickW(opts); let msg, k = "bad";
  if (id === "chau" || id === "lu"){
    S.warn = {id, day:S.day + 2};
    msg = id === "chau"
      ? "Trưởng làng báo tin: 2 ngày nữa (sáng ngày " + dis(S.day+2) + ") châu chấu sẽ kéo đến, ăn một nửa số thửa chưa gặt. Hãy gặt lúa chín, hoặc gặt sớm cây đã lớn quá nửa."
      : "Trưởng làng báo tin: 2 ngày nữa (sáng ngày " + dis(S.day+2) + ") nước sông lên." + (S.up.de ? " Nhà mình đã đắp đê nên yên tâm." : " Chưa có đê thì có thể mất 3 thửa. Gặt sớm, hoặc đắp đê ngay trong mục Nâng cấp.");
    S.ev = {id:"warn", msg, k};
    notes.push([k, msg]);
    return;
  }
  if (id === "mua"){ S.plots.forEach(p => { if (p.c) p.w = true; }); S.wet = true; msg = "Mưa rào: cả cánh đồng được tưới hôm nay, gieo mới cũng có nước."; k = "good"; }
  else if (id === "hoi"){ msg = "Làng mở hội: mọi hàng bán ở chợ hôm nay được thêm 20%."; k = "good"; }
  else if (id === "han"){ msg = "Nắng hạn: thửa nào chưa tưới đến tối sẽ héo chết. Giá thóc và rau tăng."; }
  else if (id === "cao"){
    if (S.up.cho){ msg = "Đêm qua có cáo lảng vảng, chó sủa đuổi đi."; k = "good"; }
    else { const i = S.animals.findIndex(a => a.t === "ga"); S.animals.splice(i,1); msg = "Cáo vào chuồng bắt mất 1 con gà. Nuôi chó giữ nhà để phòng."; }
  }
  S.ev = {id, msg, k};
  notes.push([k, msg]);
}

  if (se === 2){ const w = winterInfo(); bn.push(`<div class="bad"><span>Còn ${SL - dis(S.day) + 1} ngày đến mùa Đông. Kho thóc đủ cho nhà ăn <b>${Math.min(w.riceDays,SL)}/${SL}</b> ngày${w.romDays === null ? "" : `, rơm cỏ đủ cho gia súc <b>${Math.min(w.romDays,SL)}/${SL}</b> ngày`}.</span></div>`); }
  if (se === 3 && !S.ev){ const w = winterInfo(); bn.push(`<div><span>Mùa Đông: cả nhà ăn 1 thóc mỗi ngày (còn ${w.riceDays} thóc)${w.romDays === null ? "" : `, rơm cỏ còn đủ ${w.romDays} ngày`}.</span></div>`); }
  document.getElementById("banner").innerHTML = bn.length ? `<div style="display:flex;flex-direction:column;gap:6px">${bn.join("")}</div>` : "";

  const ripe = S.plots.some(p => p.c && p.a >= CROPS[p.c].days);
  const hungry = S.animals.some(a => a.h > 0) || (romNeed() && (S.goods.rom||0) < romNeed());
  document.getElementById("tabs").innerHTML = TABS.map(([id,n]) =>
    `<button role="tab" aria-selected="${tab === id}" data-act="tab" data-tab="${id}">${n}${(id === "ruong" && ripe) || (id === "chuong" && hungry) ? '<span class="dot" aria-hidden="true"></span>' : ""}</button>`).join("");

  const P = document.getElementById("panel");
  P.innerHTML = ({ruong:vRuong, chuong:vChuong, cho:vCho, kho:vKho, nang:vNang})[tab]();
  document.getElementById("side").innerHTML = vGoals() + vLog();
}
function vRuong(){
  const se = seasonOf(S.day);
  const needW = S.plots.filter(p => p.c && !p.w && p.a < CROPS[p.c].days).length;
  const nRipe = S.plots.filter(p => p.c && p.a >= CROPS[p.c].days).length;
  const tiles = S.plots.map((p,i) => {
    const mau = `<span class="mau ${p.m < 40 ? "lo" : ""}" title="Độ màu ruộng">màu ${p.m}</span>`;
    if (!p.c) return `<button class="plot empty" data-act="plot" data-i="${i}" aria-label="Thửa ${i+1}: đất trống, độ màu ${p.m}, chạm để gieo">${mau}<span class="ic sm">＋</span><span class="nm">Đất trống</span></button>`;
    const C = CROPS[p.c], r = p.a >= C.days;
    if (r) return `<button class="plot ripe" data-act="plot" data-i="${i}" aria-label="Thửa ${i+1}: ${C.n} đã chín, chạm để gặt">${mau}<span class="ic">${C.i}</span><span class="nm">${C.n} chín · gặt</span></button>`;
    const small = p.a < C.days/2;
    return `<button class="plot ${p.w ? "wet" : ""}" data-act="plot" data-i="${i}" aria-label="Thửa ${i+1}: ${C.n}, ${p.w ? "đã tưới" : "khô, chạm để tưới"}">
      <span class="tag ${p.w ? "" : "dry"}">${p.w ? "Ướt" : "Khô"}</span>${mau}
      <span class="ic ${small ? "sm" : ""}">${small ? RLA.art("mam") : C.i}</span><span class="nm">${C.n}</span>
      <span class="pg"><i style="width:${p.a/C.days*100}%"></i></span></button>`;
  }).join("");
  const add = S.plots.length < 16 ? `<button class="plot add" data-act="buyplot"><span class="ic sm">＋</span><span class="nm">Khai hoang<br>${plotPrice()} đồng</span></button>` : "";
  const chips = Object.values(CROPS).map(C => `<span class="chip ${C.ss.includes(se) ? "" : "off"}">${C.i} ${C.n}</span>`).join("");
  return `<h2>Cánh đồng nhà mình</h2>
   <p class="sub">Chạm ô trống để gieo, ô “Khô” để tưới, ô viền vàng để gặt, ô đã tưới để xem hoặc gặt sớm. Số “màu” là độ màu ruộng: trồng lạc hoặc để đất nghỉ cho màu lại.${S.up.guong ? " Guồng nước đã tưới sẵn mỗi sáng." : ""}</p>
   <div class="toolbar">
     <button class="btn" data-act="waterall" ${needW ? "" : "disabled"}>Tưới hết (${needW})</button>
     <button class="btn" data-act="harvestall" ${nRipe ? "" : "disabled"}>Gặt hết (${nRipe})</button>
   </div>
   <div class="field">${tiles}${add}</div>
   <div class="guide"><span class="note" style="margin-right:4px">Mùa ${SEASONS[se]} trồng được:</span>${chips}</div>`;
}
function vChuong(){
  const need = romNeed(), have = S.goods.rom||0;
  const list = S.animals.length ? S.animals.map((a,i) => {
    const A = ANIMALS[a.t];
    let st = a.h ? `<span class="pill bad">${a.t === "trau" ? "Gầy, " : ""}Đói ${a.h} ngày</span>` : `<span class="pill good">No</span>`;
    let extra = a.t === "lon" ? (a.f >= A.fat ? " · đã béo" : " · béo sau " + (A.fat - a.f) + " ngày ăn no") : a.t === "trau" ? " · giúp gặt lúa thêm 1 thóc" : " · 1 trứng mỗi ngày";
    return `<div class="row"><span class="e">${A.i}</span><span class="t"><b>${A.n}${st}</b><small>Ăn ${A.eat} rơm cỏ/ngày${extra}</small></span>
     <span class="a"><button class="btn s" data-act="sellanimal" data-i="${i}">Bán ${animalValue(a)}đ</button></span></div>`;
  }).join("") : `<p class="note">Chuồng đang trống.</p>`;
  const shop = Object.entries(ANIMALS).map(([t,A]) => `<div class="row"><span class="e">${A.i}</span><span class="t"><b>${A.n}</b><small>${A.desc}</small></span>
    <span class="a"><button class="btn s p" data-act="buyanimal" data-t="${t}">Mua ${A.price}đ</button></span></div>`).join("");
  return `<h2>Chuồng trại</h2>
   <p class="sub">Đang nuôi ${S.animals.length}/${cap()} con. Mỗi tối gia súc tự ăn rơm cỏ trong kho.</p>
   <div class="box" style="background:var(--bg)"><b>Rơm cỏ trong kho: ${have}</b><br>
     <span class="note">Cần ${need} mỗi ngày${need ? " · đủ cho " + Math.floor(have/need) + " ngày" : ""}. Có rơm từ gặt lúa và trồng cỏ, hoặc mua ở chợ (${romBuy()} đồng/bó${seasonOf(S.day) === 3 ? ", mùa Đông đắt" : ""}).</span>
     <div class="toolbar" style="margin:8px 0 0"><button class="btn s" data-act="buyrom" data-n="5">Mua 5 bó · ${romBuy()*5}đ</button><button class="btn s" data-act="buyrom" data-n="20">Mua 20 bó · ${romBuy()*20}đ</button></div>
   </div>
   <div class="sec"><h3>Đang nuôi</h3><div class="rows">${list}</div></div>
   <div class="sec"><h3>Mua gia súc</h3><div class="rows">${shop}</div></div>`;
}
function vCho(){
  const ar = {up:"▲", down:"▼", flat:"–"};
  const goods = Object.entries(GOODS).map(([g,G]) => {
    const have = S.goods[g]||0, pr = sellPrice(g), tr = trend(g);
    return `<div class="row"><span class="e">${G.i}</span><span class="t"><b>${G.n}</b><small class="num">Trong kho: ${have} · giá <b style="display:inline" class="${tr}">${pr}đ ${ar[tr]}</b></small></span>
     <span class="a"><button class="btn s" data-act="sell" data-g="${g}" ${have ? "" : "disabled"}>Bán 1</button><button class="btn s p" data-act="sellall" data-g="${g}" ${have ? "" : "disabled"}>Bán hết ${have ? "· " + pr*have + "đ" : ""}</button></span></div>`;
  }).join("");
  const se = seasonOf(S.day);
  const seeds = Object.entries(CROPS).map(([c,C]) => {
    const outs = Object.entries(C.out).map(([g,n]) => n + " " + GOODS[g].n).join(" + ");
    return `<div class="row"><span class="e">${C.i}</span><span class="t"><b>${C.n}${C.ss.includes(se) ? "" : '<span class="pill">trái mùa</span>'}</b><small>Mùa ${C.ss.map(x => SEASONS[x]).join(", ")} · ${C.days} đêm · được ${outs} (ruộng màu 50) · ${fdText(C.fd)}${C.note ? " · " + C.note : ""} · có ${S.seeds[c]||0}</small></span>
     <span class="a"><button class="btn s" data-act="buyseed" data-c="${c}" data-n="1">Mua 1 · ${C.seed}đ</button><button class="btn s p" data-act="buyseed" data-c="${c}" data-n="5">Mua 5 · ${C.seed*5}đ</button></span></div>`;
  }).join("");
  return `<h2>Chợ làng</h2>
   <p class="sub">Giá đổi vào mỗi phiên chợ (ngày 5 và 10 mỗi mùa). ▲ là tăng, ▼ là giảm so với phiên trước. Đúng ngày phiên giá bán cao hơn 25%.${isPhien(S.day) ? " <b>Hôm nay là chợ phiên.</b>" : ""}</p>
   <div class="box" style="background:var(--bg);margin-bottom:16px"><h3>Đơn đặt hàng</h3>
   ${S.orders.length ? `<div class="rows">${S.orders.map((o,i) => { const G = GOODS[o.g], have = S.goods[o.g]||0; return `<div class="row"><span class="e">${G.i}</span><span class="t"><b>${esc(o.who)} cần ${o.q} ${G.n}</b><small>Trả ${o.pay} đồng (gấp ${String(o.mult).replace(".",",")} giá) · nhận đến hết ngày ${dis(o.until-1)} · kho có ${have}</small></span><span class="a"><button class="btn s p" data-act="order" data-i="${i}" ${have >= o.q ? "" : "disabled"}>Giao hàng</button></span></div>`; }).join("")}</div>` : `<p class="note">Chưa có đơn nào. Phiên chợ tới (ngày ${dis(S.day) < 5 ? 5 : 10}) sẽ có 3 đơn mới.</p>`}
   </div>
   <div class="grid2"><div style="min-width:0"><h3 style="font-family:var(--fd)">Bán nông sản</h3><div class="rows">${goods}</div></div>
   <div style="min-width:0"><h3 style="font-family:var(--fd)">Mua giống</h3><div class="rows">${seeds}</div></div></div>`;
}
function vKho(){
  const goods = Object.entries(GOODS).map(([g,G]) => `<div class="row"><span class="e">${G.i}</span><span class="t"><b>${G.n}</b></span><span class="a num"><b>${S.goods[g]||0}</b></span></div>`).join("");
  const seeds = Object.entries(CROPS).map(([c,C]) => `<div class="row"><span class="e">${C.i}</span><span class="t"><b>Giống ${C.n}</b></span><span class="a num"><b>${S.seeds[c]||0}</b></span></div>`).join("");
  return `<h2>Kho nhà</h2><p class="sub">Tiến độ được lưu tự động trên trình duyệt này.</p>
   <div class="grid2"><div style="min-width:0"><h3 style="font-family:var(--fd)">Nông sản</h3><div class="rows">${goods}</div></div>
   <div style="min-width:0"><h3 style="font-family:var(--fd)">Hạt giống</h3><div class="rows">${seeds}</div></div></div>
   <div class="mobile-only sec">${vGoals()}</div>
   <div class="mobile-only sec">${vLog()}</div>
   <div class="toolbar sec"><button class="btn" data-act="help">Cách chơi</button><button class="btn" data-act="credits">Ghi công</button><button class="btn" data-act="reset">Chơi lại từ đầu</button></div>`;
}
function vNang(){
  const plot = S.plots.length < 16
    ? `<div class="row"><span class="e">＋</span><span class="t"><b>Khai hoang thêm ruộng</b><small>Đang có ${S.plots.length}/16 thửa. Thêm ruộng thì thuế mỗi mùa tăng 6 đồng.</small></span><span class="a"><button class="btn s p" data-act="buyplot">${plotPrice()}đ</button></span></div>`
    : `<div class="row"><span class="e">＋</span><span class="t"><b>Khai hoang thêm ruộng</b><small>Đã đủ 16 thửa.</small></span><span class="a"></span></div>`;
  const ups = UPG.map(u => `<div class="row"><span class="e">${RLA.art(u.id)}</span><span class="t"><b>${u.n}${S.up[u.id] ? '<span class="pill good">Đã có</span>' : ""}</b><small>${u.desc}</small></span>
    <span class="a">${S.up[u.id] ? "" : `<button class="btn s p" data-act="upg" data-id="${u.id}">${u.price.toLocaleString("vi-VN")}đ</button>`}</span></div>`).join("");
  return `<h2>Nâng cấp</h2><p class="sub">Đầu tư để làm ăn dễ hơn và phòng thiên tai.</p><div class="rows">${plot}${ups}</div>`;
}
function vGoals(){
  return `<div class="box"><h3>Mục tiêu</h3>${GOALS.map(g => `<div class="goal ${S.goals[g.id] ? "done" : ""}"><i></i><span>${g.t}${g.r ? ` <small>+${g.r}đ</small>` : ""}</span></div>`).join("")}</div>`;
}
function vLog(){
  return `<div class="box"><h3>Nhật ký</h3>${S.log.length ? `<ul class="log">${S.log.slice(0,25).map(l => `<li class="${l.k === "bad" ? "bad" : ""}"><span>N${l.d}</span>${esc(l.t)}</li>`).join("")}</ul>` : `<p class="note">Chưa có gì. Bấm “Đi ngủ” để sang ngày mới.</p>`}</div>`;
}

/* ===== Sự kiện chạm ===== */
document.addEventListener("click", e => {
  if (e.target === modal && !modalLock){ closeModal(); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const d = el.dataset;
  switch (d.act){
    case "tab": tab = d.tab; render(); window.scrollTo({top:0}); break;
    case "gotab": tab = d.tab; closeModal(); render(); break;
    case "plot": tapPlot(+d.i); break;
    case "plant": plant(+d.i, d.c); break;
    case "early": harvest(+d.i, false, true); break;
    case "order": fillOrder(+d.i); break;
    case "waterall": waterAll(); break;
    case "harvestall": harvestAll(); break;
    case "sleep": sleep(); break;
    case "sell": sellGood(d.g, false); break;
    case "sellall": sellGood(d.g, true); break;
    case "buyseed": buySeed(d.c, +d.n); break;
    case "buyrom": buyRom(+d.n); break;
    case "buyanimal": buyAnimal(d.t); break;
    case "sellanimal": sellAnimal(+d.i); break;
    case "upg": buyUpg(d.id); break;
    case "buyplot": buyPlot(); break;
    case "help": showHelp(); break;
    case "credits": showCredits(); break;
    case "amthanh": showSound(); break;
    case "snd": if (d.k === "nhac") RLA.music.set(el.checked); else RLA.setSfx(el.checked); render(); break;
    case "closehelp": S.seenHelp = true; save(); closeModal(); break;
    case "close": closeModal(); break;
    case "reset": showReset(); break;
    case "doreset": S = fresh(); genOrders(); tab = "ruong"; save(); closeModal(); render(); showHelp(); break;
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !modal.hidden) closeModal(); });

function start(data){
  S = (data && data.S && data.S.v === 2 && data.S) || load() || fresh();
  if (!S.orders.length && S.day === 1) genOrders();
  tab = (data && data.tab) || "ruong";
  render();
  if (!S.seenHelp) showHelp();
}
try { window.claude?.hot?.snapshot?.(() => ({S, tab})); } catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
